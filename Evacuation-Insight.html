<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Evacuation Insight | سامانه تحلیل تخلیه اضطراری</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
:root{
  --bg:#f4f6f9;--bg-card:#fff;--bg-sidebar:#1e293b;--bg-sidebar-hover:#334155;
  --text:#0f172a;--text-muted:#64748b;--text-sidebar:#e2e8f0;
  --primary:#2563eb;--primary-hover:#1d4ed8;--primary-light:#dbeafe;
  --success:#16a34a;--warning:#d97706;--danger:#dc2626;--border:#e2e8f0;
  --radius:8px;--shadow:0 1px 3px rgba(0,0,0,.08);--shadow-md:0 4px 12px rgba(0,0,0,.1);
  --sidebar-w:280px;--sidebar-c:64px;--font:'Vazirmatn',system-ui,sans-serif;--t:.2s ease;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;overflow-x:hidden}
.app{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);background:var(--bg-sidebar);color:var(--text-sidebar);display:flex;flex-direction:column;position:fixed;top:0;right:0;height:100vh;z-index:100;transition:width var(--t);border-left:1px solid #0f172a}
.sidebar.collapsed{width:var(--sidebar-c)}
.sidebar.collapsed .logo-text,.sidebar.collapsed .nav-item span,.sidebar.collapsed .version{display:none}
.sidebar.collapsed .nav-item{justify-content:center;padding:.75rem}
.sidebar-header{display:flex;align-items:center;justify-content:space-between;padding:1rem;border-bottom:1px solid #334155}
.logo{display:flex;align-items:center;gap:.75rem;overflow:hidden}
.logo-icon{width:28px;height:28px;color:#60a5fa;flex-shrink:0}
.logo-title{font-weight:700;font-size:.95rem;white-space:nowrap}
.logo-sub{font-size:.7rem;color:#94a3b8;white-space:nowrap}
.sidebar-nav{flex:1;padding:.75rem 0;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:.75rem;padding:.7rem 1.25rem;color:#cbd5e1;text-decoration:none;font-size:.9rem;transition:background var(--t),color var(--t);border-right:3px solid transparent;cursor:pointer}
.nav-item:hover{background:var(--bg-sidebar-hover);color:#fff}
.nav-item.active{background:var(--bg-sidebar-hover);color:#fff;border-right-color:var(--primary)}
.nav-item i{width:20px;height:20px;flex-shrink:0}
.sidebar-footer{padding:1rem;border-top:1px solid #334155;text-align:center}
.version{font-size:.7rem;color:#64748b;margin-top:.5rem}
.main{flex:1;margin-right:var(--sidebar-w);transition:margin-right var(--t);min-height:100vh;display:flex;flex-direction:column}
.sidebar.collapsed~.main{margin-right:var(--sidebar-c)}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:.75rem 1.25rem;background:var(--bg-card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;gap:.75rem;flex-wrap:wrap}
.topbar-left{display:flex;align-items:center;gap:.75rem;min-width:0;flex:1}
.topbar-left h1{font-size:1.1rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-right{display:flex;gap:.5rem;flex-shrink:0;flex-wrap:wrap;align-items:center}
.project-name-wrap{min-width:0;flex:1;max-width:280px}
.project-name-input{width:100%;border:1px solid transparent;background:#f1f5f9;border-radius:999px;padding:.35rem .85rem;font-family:inherit;font-size:.85rem;font-weight:500;color:var(--text)}
.project-name-input:hover{border-color:var(--border)}
.project-name-input:focus{outline:none;border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px var(--primary-light)}
.view-container{flex:1;padding:1.5rem;overflow-y:auto;overflow-x:hidden;max-width:100%}
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.5rem 1rem;border:none;border-radius:var(--radius);font-family:inherit;font-size:.875rem;font-weight:500;cursor:pointer;transition:background var(--t),opacity var(--t);white-space:nowrap}
.btn i{width:16px;height:16px;flex-shrink:0}
.btn-sm{padding:.3rem .55rem;font-size:.78rem}
.btn-sm i{width:14px;height:14px}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-hover)}.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-secondary{background:#e2e8f0;color:var(--text)}.btn-secondary:hover{background:#cbd5e1}
.btn-ghost{background:transparent;color:var(--text-muted)}.btn-ghost:hover{background:#f1f5f9;color:var(--text)}
.btn-danger{background:var(--danger);color:#fff}.btn-danger:hover{background:#b91c1c}
.btn-icon{background:transparent;border:none;color:inherit;cursor:pointer;padding:.4rem;border-radius:6px;display:inline-flex;align-items:center;justify-content:center}
.btn-icon:hover{background:rgba(255,255,255,.1)}.btn-icon i{width:18px;height:18px}
.badge{display:inline-flex;align-items:center;padding:.2rem .55rem;border-radius:999px;font-size:.72rem;font-weight:500}
.badge-neutral{background:#e2e8f0;color:#475569}.badge-success{background:#dcfce7;color:#166534}.badge-warning{background:#fef3c7;color:#92400e}
.badge-danger{background:#fee2e2;color:#991b1b}.badge-info{background:#dbeafe;color:#1e40af}
.badge-source-txt{background:#e0e7ff;color:#3730a3}.badge-source-ai{background:#fce7f3;color:#9d174d}.badge-source-combined{background:#d1fae5;color:#065f46}
.hidden{display:none!important}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:1.25rem;margin-bottom:1rem;overflow:hidden;max-width:100%}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:.5rem}
.card-title{font-size:1rem;font-weight:600;display:flex;align-items:center;gap:.5rem;min-width:0}
.card-title i{width:18px;height:18px;color:var(--primary);flex-shrink:0}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem}
@media(max-width:900px){.grid-2{grid-template-columns:1fr}.sidebar{width:var(--sidebar-c)}.sidebar .logo-text,.sidebar .nav-item span{display:none}.main{margin-right:var(--sidebar-c)}.topbar-right .btn span{display:none}}
.dropzone{border:2px dashed var(--border);border-radius:12px;padding:2rem 1.25rem;text-align:center;cursor:pointer;transition:border-color var(--t),background var(--t);background:#fafbfc}
.dropzone:hover,.dropzone.dragover{border-color:var(--primary);background:var(--primary-light)}
.file-list{display:flex;flex-direction:column;gap:.5rem}
.file-item{display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:.75rem 1rem;background:#f8fafc;border:1px solid var(--border);border-radius:var(--radius)}
.image-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem;width:100%}
.image-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;max-width:100%}
.image-card img{width:100%;height:160px;object-fit:cover;object-position:center;display:block;background:#e2e8f0}
.image-card-body{padding:.75rem;min-width:0;overflow:hidden}
.image-card-body > div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.beh-filter{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.75rem;max-height:120px;overflow-y:auto;padding:.5rem;background:#f8fafc;border:1px solid var(--border);border-radius:var(--radius)}
.beh-filter label{display:inline-flex;align-items:center;gap:.3rem;padding:.25rem .55rem;background:#fff;border:1px solid var(--border);border-radius:999px;font-size:.78rem;cursor:pointer;user-select:none}
.beh-filter label:has(input:checked){background:var(--primary-light);border-color:#93c5fd;color:#1e40af;font-weight:600}
.beh-filter input{accent-color:var(--primary)}
.beh-filter-actions{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.5rem}
.ar-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media(max-width:1000px){.ar-grid{grid-template-columns:1fr}}
.ar-drop{border:2px dashed var(--border);border-radius:10px;padding:1rem;text-align:center;background:#fafbfc;cursor:pointer}
.ar-drop:hover{border-color:var(--primary);background:var(--primary-light)}
.ar-thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:.6rem;margin-top:.75rem}
.ar-thumb{border:1px solid var(--border);border-radius:8px;overflow:hidden;background:#fff;position:relative}
.ar-thumb img{width:100%;height:90px;object-fit:cover;display:block}
.ar-thumb .cap{padding:.4rem .5rem;font-size:.72rem;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ar-thumb .rm{position:absolute;top:4px;left:4px}
.theme-row{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.theme-row input[type=color]{width:42px;height:32px;border:none;background:none;cursor:pointer}

.radio-group{display:flex;flex-direction:column;gap:.5rem}
.radio-item{display:flex;align-items:center;gap:.5rem;padding:.5rem .75rem;border:1px solid var(--border);border-radius:var(--radius);cursor:pointer}
.radio-item.disabled{opacity:.55;cursor:not-allowed}
.coming-soon{font-size:.7rem;background:#fef3c7;color:#92400e;padding:.1rem .4rem;border-radius:4px;margin-right:.35rem}
.security-warning{display:flex;gap:.75rem;margin-top:1rem;padding:.85rem 1rem;background:#fffbeb;border:1px solid #fcd34d;border-radius:var(--radius);font-size:.85rem}
.rec-item{border:1px solid var(--border);border-radius:var(--radius);padding:1rem;margin-bottom:.75rem;background:#fff}
.rec-priority{display:inline-block;font-size:.72rem;font-weight:700;padding:.15rem .5rem;border-radius:999px;margin-left:.4rem}
.rec-problem{font-weight:600;margin:.35rem 0}
.rec-cause{font-size:.85rem;color:var(--text-muted)}
.rec-action{font-size:.9rem;margin-top:.4rem;padding:.5rem .75rem;background:var(--primary-light);border-radius:6px}
.sc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
@media(max-width:1100px){.sc-grid{grid-template-columns:1fr}}
.sc-card{border:1px solid var(--border);border-radius:12px;padding:1rem;background:#fff;display:flex;flex-direction:column;gap:.65rem;min-height:100%}
.sc-card.filled{border-color:#93c5fd;background:#f8fbff}
.sc-card.winner{border-color:#86efac;background:#f0fdf4}
.sc-tag{display:inline-block;font-size:.72rem;font-weight:700;padding:.15rem .5rem;border-radius:999px;background:#e2e8f0;color:#334155}
.sc-drop{border:2px dashed var(--border);border-radius:10px;padding:.85rem;text-align:center;cursor:pointer;background:#fafbfc;font-size:.85rem;color:var(--text-muted)}
.sc-drop:hover{border-color:var(--primary);background:var(--primary-light)}
.sc-kpi-row{display:flex;justify-content:space-between;font-size:.82rem;padding:.2rem 0;border-bottom:1px dashed #e2e8f0}
.sc-verdict{padding:1rem 1.1rem;border-radius:12px;border:1px solid #bfdbfe;background:#eff6ff;margin-bottom:1rem}
.sc-verdict.ok{border-color:#86efac;background:#f0fdf4}
.sc-verdict.warn{border-color:#fcd34d;background:#fffbeb}
table{width:100%;border-collapse:collapse;font-size:.875rem}
th,td{padding:.6rem .75rem;text-align:right;border-bottom:1px solid var(--border)}
th{background:#f8fafc;font-weight:600;color:var(--text-muted);font-size:.8rem}
tr:hover td{background:#f8fafc}
.form-group{margin-bottom:1rem}
.form-group label{display:block;font-size:.85rem;font-weight:500;margin-bottom:.35rem;color:var(--text-muted)}
.form-control{width:100%;padding:.55rem .75rem;border:1px solid var(--border);border-radius:var(--radius);font-family:inherit;font-size:.9rem;background:#fff}
.form-control:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
.empty-state{text-align:center;padding:3rem 1.5rem;color:var(--text-muted)}
.empty-state i{width:48px;height:48px;margin-bottom:1rem;opacity:.4}
.toast-container{position:fixed;bottom:1.5rem;left:1.5rem;z-index:1000;display:flex;flex-direction:column;gap:.5rem}
.toast{background:#1e293b;color:#fff;padding:.75rem 1.25rem;border-radius:var(--radius);font-size:.875rem;box-shadow:var(--shadow-md);animation:slideIn .25s ease;max-width:360px}
.toast.success{border-right:4px solid var(--success)}.toast.error{border-right:4px solid var(--danger)}.toast.warning{border-right:4px solid var(--warning)}
@keyframes slideIn{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.loading-overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:999}
.loading-box{background:#fff;padding:2rem;border-radius:12px;text-align:center;min-width:280px;box-shadow:var(--shadow-md)}
.spinner{width:40px;height:40px;border:3px solid #e2e8f0;border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 1rem}
@keyframes spin{to{transform:rotate(360deg)}}
.progress-bar{height:6px;background:#e2e8f0;border-radius:3px;margin:1rem 0;overflow:hidden}
.progress-fill{height:100%;background:var(--primary);width:0%;transition:width .3s}
.modal{position:fixed;inset:0;z-index:800;display:flex;align-items:center;justify-content:center}
.modal-backdrop{position:absolute;inset:0;background:rgba(15,23,42,.7)}
.modal-content{position:relative;background:#fff;border-radius:12px;max-width:90vw;max-height:90vh;overflow:auto;box-shadow:var(--shadow-md);padding:1rem}
.modal-close{position:absolute;top:.5rem;left:.5rem;z-index:10;background:rgba(0,0,0,.5);color:#fff;border-radius:50%}
.image-viewer{display:flex;align-items:center;justify-content:center;overflow:auto;max-height:75vh}
.image-viewer img{max-width:100%;max-height:75vh;transition:transform .2s}
.severity-critical{color:#7f1d1d;font-weight:700}.severity-high{color:#dc2626;font-weight:600}.severity-medium{color:#d97706}.severity-low{color:#16a34a}
.footer-note{text-align:center;font-size:.75rem;color:var(--text-muted);padding:1.5rem;border-top:1px solid var(--border);margin-top:2rem}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:1rem;margin-bottom:1.5rem}
.kpi-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:1.1rem;box-shadow:var(--shadow)}
.kpi-label{font-size:.78rem;color:var(--text-muted);margin-bottom:.35rem;display:flex;align-items:center;gap:.35rem}
.kpi-label i{width:14px;height:14px}
.kpi-value{font-size:1.4rem;font-weight:700;line-height:1.2}
.kpi-value.muted{color:var(--text-muted);font-size:1rem;font-weight:500}
.kpi-unit{font-size:.75rem;color:var(--text-muted);margin-right:.25rem}
.assessment-box{display:flex;align-items:center;gap:1rem;padding:1rem 1.25rem;border-radius:var(--radius);border:1px solid var(--border);margin-bottom:1.5rem}
.assessment-box.acceptable{background:#f0fdf4;border-color:#86efac}
.assessment-box.needs-review{background:#fffbeb;border-color:#fcd34d}
.assessment-box.high-concern{background:#fef2f2;border-color:#fca5a5}
.assessment-box.critical-concern{background:#450a0a;color:#fecaca;border-color:#7f1d1d}
.assessment-icon{width:32px;height:32px;flex-shrink:0}
.assessment-label{font-weight:600;font-size:1.05rem}
.assessment-desc{font-size:.85rem;opacity:.85}
.chart-container{position:relative;height:260px;margin-top:.5rem}
.chart-placeholder{height:180px;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:.9rem;background:#f8fafc;border-radius:var(--radius);border:1px dashed var(--border)}
.quality-bar{height:8px;background:#e2e8f0;border-radius:4px;overflow:hidden;margin:.5rem 0}
.sc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
@media(max-width:1100px){.sc-grid{grid-template-columns:1fr}}
.sc-card{border:1px solid var(--border);border-radius:12px;padding:1rem;background:#fff;display:flex;flex-direction:column;gap:.55rem;min-height:100%}
.sc-card.filled{border-color:#86efac;background:#f8fff9}
.sc-card h3{font-size:.95rem;display:flex;align-items:center;gap:.4rem}
.sc-how{font-size:.8rem;color:var(--text-muted);background:#f8fafc;border-radius:8px;padding:.65rem .75rem;line-height:1.55}
.sc-file{font-size:.82rem;font-weight:600;color:#166534}
.sc-winner{border:1px solid #86efac;background:#f0fdf4;border-radius:12px;padding:1.1rem 1.25rem;margin-bottom:1rem}
.sc-warn{border:1px solid #fcd34d;background:#fffbeb;border-radius:12px;padding:1.1rem 1.25rem;margin-bottom:1rem}
.sc-bad{border:1px solid #fca5a5;background:#fef2f2;border-radius:12px;padding:1.1rem 1.25rem;margin-bottom:1rem}
.cmp-table{width:100%;border-collapse:collapse;font-size:.88rem}
.cmp-table th,.cmp-table td{border-bottom:1px solid var(--border);padding:.55rem .6rem;text-align:center}
.cmp-table th{background:#f8fafc;font-weight:600}
.cmp-table td:first-child,.cmp-table th:first-child{text-align:right}
.cmp-best{background:#dcfce7;font-weight:700}
.hazard-group{display:flex;flex-wrap:wrap;gap:.5rem}
.sc-insight{background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:.9rem 1rem;margin-bottom:.75rem}
.sc-kpi-mini{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:.5rem;margin:.65rem 0 0}
.sc-kpi-mini > div{background:#fff;border:1px solid var(--border);border-radius:8px;padding:.55rem .4rem;text-align:center}
.sc-kpi-mini .l{font-size:.72rem;color:var(--text-muted)}
.sc-kpi-mini .v{font-size:.95rem;font-weight:700;margin-top:.15rem}
.sc-score{display:inline-block;font-size:1.4rem;font-weight:800;color:var(--primary)}
.delta-up{color:#dc2626;font-weight:700}.delta-down{color:#16a34a;font-weight:700}
.help-toc{display:flex;flex-wrap:wrap;gap:.35rem;margin:0 0 1rem;position:sticky;top:8px;z-index:6;background:#fff;border:1px solid var(--border);border-radius:10px;padding:.5rem .6rem;box-shadow:var(--shadow);max-width:100%}
.help-toc button{background:#fff;border:1px solid var(--border);border-radius:999px;padding:.3rem .7rem;font-size:.78rem;color:var(--text);cursor:pointer;font-family:inherit;line-height:1.4}
.help-toc button:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-light)}
.help-sec{scroll-margin-top:64px;overflow:hidden;max-width:100%}
.help-sec p,.help-sec li,.help-step > div{overflow-wrap:anywhere;word-wrap:break-word}
.help-sec code{font-family:ui-monospace,Consolas,monospace;font-size:.8em;background:#f1f5f9;padding:.05rem .35rem;border-radius:4px;word-break:break-all}
.help-step{display:flex;gap:.75rem;margin:.4rem 0 .65rem;align-items:flex-start}
.help-n{width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.82rem;flex-shrink:0;margin-top:2px}
.help-fig{margin:.75rem 0 1rem;background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden;max-width:100%}
.help-fig svg,.help-fig img{width:100%;max-width:100%;height:auto;max-height:340px;display:block;object-fit:contain;object-position:center;background:#f8fafc}
.help-cap{font-size:.8rem;color:var(--text-muted);padding:.5rem .85rem;text-align:center;line-height:1.55;background:#f8fafc;border-top:1px solid var(--border)}
.help-call,.help-warn{border-radius:10px;padding:.8rem .95rem;margin:.55rem 0 .9rem;font-size:.88rem;line-height:1.65;overflow-wrap:anywhere}
.help-call{background:#eff6ff;border:1px solid #bfdbfe}
.help-warn{background:#fffbeb;border:1px solid #fcd34d}
.help-map{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.6rem;margin:.85rem 0}
.help-tile{display:block;width:100%;text-align:right;background:#fff;border:1px solid var(--border);border-radius:10px;padding:.8rem .85rem;cursor:pointer;font-family:inherit;color:inherit;min-width:0}
.help-tile:hover{border-color:var(--primary);background:#eff6ff}
.help-tile .t{font-weight:700;font-size:.88rem;margin-bottom:.25rem;display:flex;align-items:center;gap:.4rem;min-width:0}
.help-tile .t i{width:16px;height:16px;flex-shrink:0;color:var(--primary)}
.help-tile .d{font-size:.78rem;color:var(--text-muted);line-height:1.55}
.help-track{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.45rem;margin:1rem 0 .25rem}
@media(max-width:900px){.help-track{grid-template-columns:repeat(2,minmax(0,1fr))}.help-flow{grid-template-columns:1fr 1fr 1fr!important}}
.help-track .chip{border:1px solid var(--border);border-radius:10px;padding:.5rem .55rem;background:#fff;font-size:.78rem;min-width:0;cursor:pointer;font-family:inherit;text-align:right}
.help-track .chip.on{border-color:#86efac;background:#f0fdf4}
.help-track .chip .k{font-size:.7rem;color:var(--text-muted)}
.help-track .chip .v{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.help-flow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:.4rem;margin:.75rem 0 1rem}

function toast(msg, type='info'){
  const box = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = 'toast '+type;
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(()=>el.remove(), 4000);
}
function sevFa(s){

  return m[s]||m[String(s||'').toLowerCase()]||s||'—';
}
function fmt(v, u=''){
  if(v==null||v==='') return '<span class="kpi-value muted">اطلاعات موجود نیست</span>';
  return `<span class="kpi-value">${v}<span class="kpi-unit">${u}</span></span>`;
}
function formatSize(b){
  if(!b) return '0 B';
  const k=1024,s=['B','KB','MB'],i=Math.floor(Math.log(b)/Math.log(k));
  return (b/Math.pow(k,i)).toFixed(1)+' '+s[i];
}
function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function uid(){return Date.now()+'_'+Math.random().toString(36).slice(2,7);}
async function hashBuf(buf){
  const h = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function showLoading(t,p=0){
  document.getElementById('loading-text').textContent=t;
  document.getElementById('progress-fill').style.width=p+'%';
  document.getElementById('loading-overlay').classList.remove('hidden');
}

/* ========== PARSER ========== */
/** تبدیل اعداد فارسی/عربی به انگلیسی + نرمال‌سازی اعشار */
function toAsciiDigits(str){
  if(str==null) return '';
  return String(str)
    .replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
    .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))
    .replace(/٫/g, '.')   // Persian decimal
    .replace(/,/g, '');   // thousand sep sometimes
}
function parseNum(s){
  const n = parseFloat(toAsciiDigits(s));
  return isNaN(n) ? null : n;
}
// digit class for regex: English + Persian + Arabic
const D = '[0-9۰-۹٠-٩]';
const ND = `${D}+(?:[\\.٫]${D}+)?`;

const PATTERNS = [
  {key:'totalOccupants',label:'تعداد کل افراد',unit:'نفر',re:[
    new RegExp(`Total\\s+Occupants?\\s*[:=]?\\s*(${D}+)`,'i'),
    new RegExp(`number\\s+of\\s+occupants?\\s*[:=]?\\s*(${D}+)`,'i')
  ]},
  {key:'evacuationTime',label:'زمان کل تخلیه',unit:'s',re:[
    // Pathfinder: Max under Completion Times
    new RegExp(`Completion\\s+Times[\\s\\S]{0,200}?Max\\s*:\\s*(${ND})`,'i'),
    new RegExp(`total\\s+evacuation\\s+time\\s*[:=]?\\s*(${ND})`,'i'),
    new RegExp(`last\\s+occupant\\s+(?:exit|out)\\s*[:=]?\\s*(${ND})`,'i')
  ]},
  {key:'lastOccupantExit',label:'زمان خروج آخرین نفر',unit:'s',re:[
    new RegExp(`Completion\\s+Times[\\s\\S]{0,200}?Max\\s*:\\s*(${ND})`,'i')
  ]},
  {key:'firstOccupantExit',label:'زمان خروج اولین نفر',unit:'s',re:[
    new RegExp(`Completion\\s+Times[\\s\\S]{0,200}?Min\\s*:\\s*(${ND})`,'i')
  ]},
  {key:'averageExitTime',label:'متوسط زمان خروج',unit:'s',re:[
    new RegExp(`Completion\\s+Times[\\s\\S]{0,280}?Average\\s*:\\s*(${ND})`,'i'),
    new RegExp(`average\\s+(?:exit\\s+)?time\\s*[:=]?\\s*(${ND})`,'i')
  ]},
  {key:'numberOfFloors',label:'تعداد طبقات',unit:'',re:[
    new RegExp(`(?:number\\s+of\\s+)?floors?\\s*[:=]?\\s*(${D}+)`,'i')
  ]},
  {key:'numberOfExits',label:'تعداد خروجی‌ها',unit:'',re:[
    new RegExp(`(?:number\\s+of\\s+)?exits?\\s*[:=]?\\s*(${D}+)`,'i')
  ]},
  {key:'maxWaitingTime',label:'بیشترین زمان انتظار',unit:'s',re:[
    new RegExp(`max(?:imum)?\\s+wait(?:ing)?\\s+time\\s*[:=]?\\s*(${ND})`,'i')
  ]},
  {key:'averageWaitingTime',label:'متوسط زمان انتظار',unit:'s',re:[
    new RegExp(`average\\s+wait(?:ing)?\\s+time\\s*[:=]?\\s*(${ND})`,'i')
  ]},
  {key:'averageSpeed',label:'متوسط سرعت',unit:'m/s',re:[
    new RegExp(`average\\s+speed\\s*[:=]?\\s*(${ND})`,'i')
  ]},
  {key:'averageDistance',label:'متوسط مسافت حرکت',unit:'m',re:[
    new RegExp(`Travel\\s+Distances[\\s\\S]{0,200}?Average\\s*:\\s*(${ND})`,'i')
  ]},
  {key:'maxDistance',label:'بیشترین مسافت حرکت',unit:'m',re:[
    new RegExp(`Travel\\s+Distances[\\s\\S]{0,200}?Max\\s*:\\s*(${ND})`,'i')
  ]}
];

function parseTxt(rawText){
  const extracted={}, tables={floors:[],exits:[],rooms:[],stairs:[],behaviors:[],components:[]};
  if(!rawText||rawText.trim().length<10) return {extracted,tables,success:false};
  const text = toAsciiDigits(rawText);

  for(const p of PATTERNS){
    let found=null;
    for(const r of p.re){
      const m=text.match(r);
      if(m){found=parseFloat(m[1]);break;}
    }
    extracted[p.key]={value:found,label:p.label,unit:p.unit,status:found!=null&&!isNaN(found)?'extracted':'missing'};
  }

  if(extracted.evacuationTime.status==='missing'&&extracted.lastOccupantExit.status==='extracted'){
    extracted.evacuationTime={...extracted.evacuationTime,value:extracted.lastOccupantExit.value,status:'extracted'};
  }

  // استخراج صریح بلوک Completion Times for All Occupants (دقیق‌تر از regex عمومی)
  const allOcc = text.match(/Completion Times for All Occupants[\s\S]{0,400}?(?=Completion Times by Behavior|Travel Distances|$)/i);
  if(allOcc){
    const block=allOcc[0];
    const minM=block.match(/Min\s*:\s*([\d.]+)/i);
    const maxM=block.match(/Max\s*:\s*([\d.]+)/i);
    const avgM=block.match(/Average\s*:\s*([\d.]+)/i);
    if(minM){
      const v=parseFloat(minM[1]);
      if(!isNaN(v)) extracted.firstOccupantExit={value:v,label:'زمان خروج اولین نفر',unit:'s',status:'extracted'};
    }
    if(maxM){
      const v=parseFloat(maxM[1]);
      if(!isNaN(v)){
        extracted.lastOccupantExit={value:v,label:'زمان خروج آخرین نفر',unit:'s',status:'extracted'};
        extracted.evacuationTime={value:v,label:'زمان کل تخلیه',unit:'s',status:'extracted'};
      }
    }
    if(avgM){
      const v=parseFloat(avgM[1]);
      if(!isNaN(v)) extracted.averageExitTime={value:v,label:'متوسط زمان خروج',unit:'s',status:'extracted'};
    }
  }


  // --- helpers ---
  const floorFromName=(name)=>{
    if(!name) return null;
    let m=name.match(/Floor\s*([-+]?\d+(?:\.\d+)?)\s*m/i);
    if(m) return m[1];
    m=name.match(/(?:WAIT_|EVAC-?F-?|C-F)(\d+)/i);
    if(m) return m[1];
    m=name.match(/F(\d+)/i);
    if(m) return m[1];
    return null;
  };
  const classify=(name)=>{
    if(/stair/i.test(name)) return 'stair';
    if(/door|exit/i.test(name)) return 'door';
    if(/room|corridor|hall|lobb|refuge|راهرو|اتاق|پناه/i.test(name)) return 'room';
    if(/WAIT_|EVAC|C-F/i.test(name)) return 'behavior';
    return 'component';
  };

  // Door Flow Rates / Room sections (tab-separated Pathfinder format)
  const lines=text.split(/\r?\n/);
  let mode=null;
  for(const rawLine of lines){
    const t=rawLine.trim();
    if(/Door\s+Flow\s+Rates/i.test(t)){mode='door';continue;}
    if(/Room\s+Usage|Rooms?\s*:|Room\s+Clearance|Usage Times for Rooms|Room Usage/i.test(t)){mode='room';continue;}
    if(/Trigger\s+Usage|Travel\s+Distances|Completion\s+Times|Movement\s+Distance/i.test(t)){mode=null;continue;}
    if(!mode||!t) continue;
    if(/^Door\s+First|^Name\s+|^\(s\)|First_In|Last_Out_Name|^\-+$/i.test(t)) continue;

    // Pathfinder: Name \t First_In \t Last_Out \t Last_Out_Name \t Total_Use \t Flow_Avg?
    let fields;
    if(rawLine.includes('\t')){
      fields=rawLine.split('\t').map(x=>x.trim()).filter(x=>x!=='');
    } else {
      fields=t.split(/\s{2,}/).map(x=>x.trim()).filter(Boolean);
    }
    if(fields.length<3) continue;
    const name=fields[0];
    if(/^(Door|Room|First|Last|Total|\*)/i.test(name) && fields.length<5) continue;

    const firstIn=parseNum(fields[1]);
    const lastOut=parseNum(fields[2]);
    // fields[3] = Last_Out_Name (may look numeric like 00398) — always skip as name
    let totalUse=null, flowAvg=null;
    if(fields.length>=5){
      totalUse=parseNum(fields[4]);
      if(fields.length>=6) flowAvg=parseNum(fields[5]);
    } else if(fields.length===4){
      // ممکن است بدون نام خروجی: First Last Use
      totalUse=parseNum(fields[3]);
    }
    if(firstIn==null && lastOut==null) continue;
    if(totalUse==null || totalUse<=0) continue;

    const floor=floorFromName(name);
    const type=classify(name);
    const e={name,firstIn,lastOut,totalUse,flowAvg,floor,type: type==='component' && mode==='room' ? 'room' : type};

    if(e.type==='stair') tables.stairs.push(e);
    if(e.type==='door') tables.exits.push(e);
    if(e.type==='room' || mode==='room') {
      e.type='room';
      tables.rooms.push(e);
    }
    tables.components.push(e);
    if(e.type==='stair'||e.type==='room') tables.floors.push(e);
  }

  // Behaviors: Completion Times by Behavior
  // ستون‌ها: Behavior | Count | Min | Min_Name | Max | Max_Name | Avg | StdDev
  const behaviorSection = text.match(/Completion Times by Behavior[\s\S]*?(?=Completion Times by Profile|Travel Distances|$)/i);
  if(behaviorSection){
    for(const raw of behaviorSection[0].split(/\r?\n/)){
      const line=raw.trim();
      if(!line || /Behavior|all behaviors/i.test(line)) continue;
      let fields;
      if(raw.includes('\t')) fields=raw.split('\t').map(x=>x.trim()).filter(x=>x!=='');
      else fields=line.split(/\s{2,}/).map(x=>x.trim()).filter(Boolean);
      if(fields.length<5) continue;
      const name=fields[0];
      if(!name || name.startsWith('*')) continue;
      const count=parseNum(fields[1]);
      const minT=parseNum(fields[2]);
      // fields[3] = Min_Name
      let maxT=null, avgT=null;
      if(fields.length>=7){
        maxT=parseNum(fields[4]);
        avgT=parseNum(fields[6]);
      } else {
        const nums=[];
        for(let i=2;i<fields.length;i++){ const n=parseNum(fields[i]); if(n!=null) nums.push(n); }
        // nums: min, max, avg, std roughly
        if(nums.length>=3){ maxT=nums[1]; avgT=nums[2]; }
        else if(nums.length>=2){ maxT=nums[1]; }
      }
      if(count==null && minT==null && maxT==null) continue;
      const e={
        name, type:'behavior',
        firstIn:minT, lastOut:maxT, totalUse:count,
        flowAvg:avgT, avg:avgT,
        floor:floorFromName(name)
      };
      tables.behaviors.push(e);
      tables.floors.push(e);
    }
  }

  // Distance average if not in patterns
  if(extracted.averageDistance?.status!=='extracted'){
    const dm=text.match(/Travel Distances[\s\S]{0,200}?Average\s*:\s*([\d.]+)/i);
    if(dm) extracted.averageDistance={value:parseFloat(dm[1]),label:'متوسط مسافت حرکت',unit:'m',status:'extracted'};
  }

  // تعداد طبقات: فقط از ارتفاع‌های واقعی Pathfinder به شکل Floor X.X m
  // (نه از شماره رفتارهایی مثل WAIT_F1 که با تراز ارتفاع یکی نیستند)
  const elevSet=new Set();
  const floorRe=/Floor\s*([-+]?\d+(?:\.\d+)?)\s*m/gi;
  let fm;
  while((fm=floorRe.exec(text))) elevSet.add(fm[1]);
  // نرمال‌سازی 6 و 6.0
  const elevNorm=new Set();
  [...elevSet].forEach(e=>{
    const n=parseFloat(e);
    elevNorm.add(isNaN(n)?e:String(n));
  });
  // همیشه تعداد ترازهای ارتفاع را به‌عنوان تعداد طبقات بنویس (الگوی floors? اشتباهی عدد Floor را می‌گیرد)
  if(elevNorm.size){
    extracted.numberOfFloors={value:elevNorm.size,label:'تعداد طبقات (تراز)',unit:'',status:'extracted'};
  }
  tables._elevations=[...elevNorm].sort((a,b)=>parseFloat(a)-parseFloat(b));

  // تعداد خروجی‌های فعال
  if(extracted.numberOfExits.status==='missing' && tables.exits.length){
    const unique=new Set(tables.exits.map(e=>e.name));
    extracted.numberOfExits={value:unique.size,label:'تعداد خروجی‌ها',unit:'',status:'extracted'};
  }

  // سرعت متوسط ≈ مسافت / زمان
  if(extracted.averageSpeed.status==='missing'){
    const dist=extracted.averageDistance?.value ?? (()=>{
      const m=text.match(/Travel Distances[\s\S]{0,200}?Average\s*:\s*([\d.]+)/i);
      return m?parseFloat(m[1]):null;
    })();
    const t=extracted.averageExitTime?.value||extracted.evacuationTime?.value;
    if(dist!=null && t!=null && t>0){
      extracted.averageSpeed={value:+(dist/t).toFixed(3),label:'متوسط سرعت',unit:'m/s',status:'extracted'};
    }
  }

  // مسافت حرکت به ازای Behavior برای تخمین انتظار
  const distByBehavior={};
  const distSection=text.match(/Movement Distance by Behavior[\s\S]*?(?=Movement Distance by Profile|Trigger Usage|$)/i);
  if(distSection){
    for(const line of distSection[0].split(/\r?\n/)){
      if(/Behavior|all behaviors/i.test(line)) continue;
      const m=line.match(new RegExp(`^\\s*(\\S+)\\s+(${D}+)\\s+(${ND})\\s+\\S*\\s+(${ND})\\s+\\S*\\s+(${ND})`));
      if(m) distByBehavior[m[1]]=parseNum(m[5]); // Avg distance
      else {
        const parts=line.trim().split(/\\s{2,}|\\t+/).filter(Boolean);
        if(parts.length>=6){
          const name=parts[0];
          const nums=[];
          for(let i=1;i<parts.length;i++){const n=parseNum(parts[i]); if(n!=null) nums.push(n);}
          // Count Min Max Avg → avg is often 4th number
          if(nums.length>=4) distByBehavior[name]=nums[3];
        }
      }
    }
  }

  // تخمین زمان انتظار ≈ زمان تکمیل − مسافت/سرعت
  const speed = extracted.averageSpeed?.value || (()=>{
    const dist=extracted.averageDistance?.value;
    const t=extracted.averageExitTime?.value;
    return (dist&&t)?dist/t:0.5;
  })();
  const waitBehaviors=tables.behaviors.filter(b=>/WAIT/i.test(b.name));
  const waitEstimates=[];
  for(const b of waitBehaviors){
    const avgT=b.avg??b.flowAvg;
    const dist=distByBehavior[b.name];
    if(avgT!=null && dist!=null && speed>0){
      const travel=dist/speed;
      const wait=Math.max(0, avgT-travel);
      waitEstimates.push({name:b.name,wait,avgT,dist});
    } else if(avgT!=null){
      // بدون مسافت: از اختلاف با میانگین رفتارهای EVAC هم‌تراز استفاده نکن — فقط علامت‌گذاری
    }
  }
  // اگر تخمین از مسافت ممکن نبود، از اختلاف Max WAIT و Max EVAC
  if(!waitEstimates.length && waitBehaviors.length){
    const evac=tables.behaviors.filter(b=>/EVAC/i.test(b.name));
    const maxWait=Math.max(...waitBehaviors.map(b=>b.lastOut||0));
    const maxEvac=evac.length?Math.max(...evac.map(b=>b.lastOut||0)):0;
    if(maxWait>maxEvac){
      waitEstimates.push({name:'derived',wait:maxWait-maxEvac});
    }
  }
  if(waitEstimates.length && extracted.maxWaitingTime.status==='missing'){
    const mx=Math.max(...waitEstimates.map(w=>w.wait));
    extracted.maxWaitingTime={value:+mx.toFixed(1),label:'بیشترین زمان انتظار (تخمینی)',unit:'s',status:'extracted'};
  }
  if(waitEstimates.length && extracted.averageWaitingTime.status==='missing'){
    const av=waitEstimates.reduce((s,w)=>s+w.wait,0)/waitEstimates.length;
    extracted.averageWaitingTime={value:+av.toFixed(1),label:'متوسط زمان انتظار (تخمینی)',unit:'s',status:'extracted'};
  }

  // اگر StdDev در summary بود نگه داریم
  const stdM=text.match(/Completion Times[\s\S]{0,280}?StdDev\s*:\s*([\d.]+)/i);
  if(stdM) extracted.completionStdDev={value:parseFloat(stdM[1]),label:'انحراف معیار زمان خروج',unit:'s',status:'extracted'};

  const ok=Object.values(extracted).some(e=>e.status==='extracted')||tables.exits.length||tables.behaviors.length||tables.rooms.length;
  return {extracted,tables,success:ok};
}

function runNumerical(extracted,tables){
  const get=k=>extracted[k]?.status==='extracted'?extracted[k].value:null;

  // تجمیع زمان خروج هر طبقه — فقط تراز ارتفاع (Floor X m) نه شماره Behavior
  const elevKey=(x)=>{
    if(!x||!x.name) return null;
    const m=String(x.name).match(/Floor\s*([-+]?\d+(?:\.\d+)?)\s*m/i);
    if(m){ const n=parseFloat(m[1]); return isNaN(n)?m[1]:String(n); }
    // فقط اگر floor شبیه ارتفاع اعشاری/منفی باشد
    if(x.floor!=null && /[.-]/.test(String(x.floor))) return String(parseFloat(x.floor));
    return null;
  };
  const floorMap={};
  const addFloor=(key,firstIn,lastOut,count,source)=>{
    if(key==null||key==='') return;
    const k=String(parseFloat(key)==parseFloat(key)?parseFloat(key):key); // نرمال 6.0 → 6
    if(!floorMap[k]) floorMap[k]={floor:k,maxExit:0,minFirst:Infinity,minLast:Infinity,sumLast:0,nLast:0,count:0,sources:[]};
    if(firstIn!=null && firstIn>0) floorMap[k].minFirst=Math.min(floorMap[k].minFirst,firstIn);
    if(lastOut!=null && lastOut>0){
      floorMap[k].maxExit=Math.max(floorMap[k].maxExit,lastOut);
      floorMap[k].minLast=Math.min(floorMap[k].minLast,lastOut);
      floorMap[k].sumLast+=lastOut;
      floorMap[k].nLast+=1;
    }
    if(count!=null) floorMap[k].count+=count;
    if(source) floorMap[k].sources.push(source);
  };
  (tables.exits||[]).forEach(e=>addFloor(elevKey(e),e.firstIn,e.lastOut,e.totalUse,e.name));
  (tables.stairs||[]).forEach(s=>addFloor(elevKey(s),s.firstIn,s.lastOut,s.totalUse,s.name));
  (tables.rooms||[]).forEach(r=>addFloor(elevKey(r),r.firstIn,r.lastOut,r.totalUse,r.name));
  if(!Object.keys(floorMap).length && tables._elevations){
    tables._elevations.forEach(e=>addFloor(e,null,null,null,null));
  }

  const floorClearance=Object.values(floorMap).map(f=>({
    floor:f.floor,
    name:'تراز '+f.floor+' m',
    maxExit:f.maxExit||null,
    minExit:f.minFirst!==Infinity?f.minFirst:(f.minLast!==Infinity?f.minLast:null),
    avgExit:f.nLast>0?+(f.sumLast/f.nLast).toFixed(1):null,
    count:f.count||null,
    lastOut:f.maxExit||null,
    totalUse:f.count||null,
    type:'floor'
  })).sort((a,b)=>parseFloat(a.floor)-parseFloat(b.floor));

  const numberOfFloors=get('numberOfFloors')??(floorClearance.length||null);

  // بحرانی‌ترین در (بدون تکرار نام)
  const _doorBest={};
  (tables.exits||[]).forEach(e=>{
    if(!e||!(e.totalUse>0)) return;
    const p=_doorBest[e.name];
    if(!p || (e.totalUse||0)>(p.totalUse||0)) _doorBest[e.name]=e;
  });
  const exitsSorted=Object.values(_doorBest).sort((a,b)=>{
    if((b.totalUse||0)!==(a.totalUse||0)) return (b.totalUse||0)-(a.totalUse||0);
    return (a.flowAvg||99)-(b.flowAvg||99);
  });
  const criticalDoor=exitsSorted[0]?{
    name:exitsSorted[0].name,
    totalUse:exitsSorted[0].totalUse,
    flowAvg:exitsSorted[0].flowAvg,
    lastOut:exitsSorted[0].lastOut,
    floor:exitsSorted[0].floor
  }:null;

  // بحرانی‌ترین راهرو/اتاق: بیشترین totalUse یا بیشترین lastOut
  const roomsSorted=[...(tables.rooms||[])].filter(r=>r.totalUse>0).sort((a,b)=>{
    if((b.totalUse||0)!==(a.totalUse||0)) return (b.totalUse||0)-(a.totalUse||0);
    return (b.lastOut||0)-(a.lastOut||0);
  });
  // اگر room نبود از component با نام corridor-like
  let criticalCorridor=roomsSorted[0]?{
    name:roomsSorted[0].name,
    totalUse:roomsSorted[0].totalUse,
    lastOut:roomsSorted[0].lastOut,
    floor:roomsSorted[0].floor
  }:null;
  if(!criticalCorridor){
    const corr=[...(tables.components||[])].filter(c=>/corridor|hall|lobb|راهرو|R-\d/i.test(c.name)&&c.totalUse>0)
      .sort((a,b)=>(b.totalUse||0)-(a.totalUse||0));
    if(corr[0]) criticalCorridor={name:corr[0].name,totalUse:corr[0].totalUse,lastOut:corr[0].lastOut,floor:corr[0].floor};
  }

  // بحرانی‌ترین راه‌پله
  const stairsSorted=[...(tables.stairs||[])].filter(s=>s.totalUse>0).sort((a,b)=>(b.totalUse||0)-(a.totalUse||0));
  const criticalStair=stairsSorted[0]?{
    name:stairsSorted[0].name,
    totalUse:stairsSorted[0].totalUse,
    flowAvg:stairsSorted[0].flowAvg,
    lastOut:stairsSorted[0].lastOut,
    floor:stairsSorted[0].floor
  }:null;

  const kpis={
    totalOccupants:get('totalOccupants'),
    numberOfFloors,
    numberOfExits:get('numberOfExits')??(exitsSorted.length||null),
    evacuationTime:get('evacuationTime')??get('lastOccupantExit'),
    averageEvacuationTime:get('averageExitTime'),
    maxWaitingTime:get('maxWaitingTime'),
    averageWaitingTime:get('averageWaitingTime'),
    averageSpeed:get('averageSpeed'),
    averageDistance:get('averageDistance'),
    firstOccupantExit:get('firstOccupantExit'),
    criticalDoor:criticalDoor?.name||null,
    criticalDoorUse:criticalDoor?.totalUse||null,
    criticalCorridor:criticalCorridor?.name||null,
    criticalCorridorUse:criticalCorridor?.totalUse||null,
    criticalStair:criticalStair?.name||null
  };

  // لیست اجزا برای جدول/نمودار/فیلتر
  const allComponents=[];
  const seenComp=new Set();
  const pushUnique=(arr)=>{
    arr.forEach(x=>{
      if(!x||!x.name) return;
      let fl=x.floor!=null?String(x.floor):null;
      if(fl!=null && fl!==''){ const n=parseFloat(fl); if(!isNaN(n)) fl=String(n); }
      const key=(x.type||'component')+'|'+x.name+'|'+fl;
      if(seenComp.has(key)) return;
      seenComp.add(key);
      // فقط رکورد با بیشترین use برای نام یکسان
      allComponents.push({
        name:x.name,
        type:x.type||'component',
        floor:fl,
        firstIn:x.firstIn,
        lastOut:x.lastOut,
        totalUse:x.totalUse,
        flowAvg:x.flowAvg,
        duration:(x.lastOut!=null&&x.firstIn!=null)?+(x.lastOut-x.firstIn).toFixed(2):null
      });
    });
  };
  pushUnique(exitsSorted.map(e=>({...e,type:'door'})));
  pushUnique(tables.stairs||[]);
  pushUnique(tables.rooms||[]);
  pushUnique((tables.behaviors||[]).map(b=>({...b,type:'behavior'})));

  const floorEvacuation=floorClearance;

  // Refuge rooms از Room Usage
  const refugeMap={};
  const collectRefuge=(arr)=>{
    (arr||[]).forEach(x=>{
      if(!x||!x.name) return;
      if(!/refuge|پناه/i.test(x.name)) return;
      if(!(x.totalUse>0)) return;
      const key=x.name;
      const prev=refugeMap[key];
      if(!prev || (x.totalUse||0)>(prev.totalUse||0)){
        // نام کوتاه برای نمودار
        let short=x.name;
        const m=x.name.match(/refuge[^\s>]*/i);
        if(m) short=m[0];
        refugeMap[key]={
          name:x.name,
          shortName:short,
          type:'refuge',
          floor:x.floor!=null?String(x.floor):null,
          firstIn:x.firstIn,
          lastOut:x.lastOut,
          totalUse:x.totalUse,
          flowAvg:x.flowAvg
        };
      }
    });
  };
  collectRefuge(tables.rooms);
  collectRefuge(tables.components);
  collectRefuge(tables.exits);
  const refugeRooms=Object.values(refugeMap).sort((a,b)=>(a.firstIn??9999)-(b.firstIn??9999));

  // جدول زمان خروج بر حسب Behavior
  const behaviorEvacuation=(tables.behaviors||[])
    .filter(b=>b && b.name && !/all behaviors/i.test(b.name))
    .map(b=>({
      name:b.name,
      type:'behavior',
      count:b.totalUse??null,
      minExit:b.firstIn??null,
      maxExit:b.lastOut??null,
      avgExit:b.avg??b.flowAvg??null,
      lastOut:b.lastOut??null,
      firstIn:b.firstIn??null,
      totalUse:b.totalUse??null,
      floor:b.floor!=null?String(b.floor):null
    }))
    .sort((a,b)=>(b.maxExit||0)-(a.maxExit||0));
  // حذف تکراری درها (Pathfinder چند بار همان در را می‌نویسد)
  const exitMap={};
  (tables.exits||[]).forEach(e=>{
    if(!e||!e.name||!(e.totalUse>0)) return;
    const prev=exitMap[e.name];
    if(!prev || (e.totalUse||0)>(prev.totalUse||0)){
      let fl=e.floor;
      const ek=elevKey(e);
      if(ek!=null) fl=ek;
      else if(fl!=null) fl=String(parseFloat(fl)==parseFloat(fl)?parseFloat(fl):fl);
      exitMap[e.name]={...e,floor:fl,type:'door'};
    }
  });
  const uniqueExits=Object.values(exitMap);
  const totalUseExit=uniqueExits.reduce((s,e)=>s+(e.totalUse||0),0);
  const exitUtilization=uniqueExits.map(e=>({
    name:e.name,totalUse:e.totalUse,firstIn:e.firstIn,lastOut:e.lastOut,flowAvg:e.flowAvg,floor:e.floor,
    type:'door',
    share:totalUseExit>0&&e.totalUse!=null?+((e.totalUse/totalUseExit)*100).toFixed(1):null
  })).sort((a,b)=>(b.totalUse||0)-(a.totalUse||0));

  // نرمال‌سازی floor روی stairs/rooms/components
  const normFloor=(x)=>{
    if(!x) return x;
    const ek=elevKey(x);
    if(ek!=null) x.floor=ek;
    else if(x.floor!=null && x.floor!==''){
      const n=parseFloat(x.floor);
      x.floor=isNaN(n)?String(x.floor):String(n);
    }
    return x;
  };
  (tables.stairs||[]).forEach(normFloor);
  (tables.rooms||[]).forEach(normFloor);
  (tables.exits||[]).forEach(normFloor);

  return {
    kpis,
    floorEvacuation,
    behaviorEvacuation,
    refugeRooms,
    exitUtilization,
    allComponents,
    rooms:(tables.rooms||[]).map(r=>({...r,type:'room'})),
    stairs:(tables.stairs||[]).map(s=>({...s,type:'stair'})),
    behaviors:tables.behaviors||[],
    criticalDoor,
    criticalCorridor,
    criticalStair,
    floorList:floorClearance.map(f=>f.floor)
  };
}

function dataQuality(extracted,imgCount,tables){
  const req=['totalOccupants','evacuationTime','numberOfFloors','numberOfExits','averageExitTime','maxWaitingTime'];
  let present=0;const missing=[];
  for(const k of req){if(extracted[k]?.status==='extracted')present++;else missing.push(extracted[k]?.label||k);}
  if(tables?.floors?.length||tables?.behaviors?.length)present+=0.5;
  if(tables?.exits?.length)present+=0.5;
  if(tables?.rooms?.length)present+=0.3;
  if(imgCount>0)present+=Math.min(imgCount*0.3,1.5);
  const completeness=Math.min(100,Math.round((present/(req.length+2.8))*100));
  const notes=[];
  if(!imgCount)notes.push('هیچ تصویری وارد نشده است.');
  if(missing.length)notes.push('فیلدهای مفقود یا تقریبی: '+missing.join('، '));
  if(extracted.maxWaitingTime?.label?.includes('تقریبی')) notes.push('زمان انتظار از رفتارهای WAIT تخمین زده شده است.');
  return {completeness,notes,missingFields:missing};
}

    recs.push({priority:'critical',problem:'زمان انتظار بسیار بالا',possibleCause:'ظرفیت ناکافی خروجی یا تجمع',recommendation:'بررسی فوری ظرفیت خروجی‌ها و امکان توزیع جریان به خروجی‌های جایگزین.',evidence:[`حداکثر انتظار: ${maxWait} s`],source:'TXT DATA'});
  }else if(maxWait!=null&&maxWait>30){
    bn.push({location:'سیستم (کلی)',issue:'زمان انتظار بالا',severity:'high',confidence:null,evidence:[`حداکثر زمان انتظار: ${maxWait} s`],source:'TXT DATA',recommendation:'بررسی ظرفیت خروجی و توزیع جریان.'});
    recs.push({priority:'high',problem:'زمان انتظار بالا در خروجی',possibleCause:'صف‌بندی یا گلوگاه',recommendation:'بررسی ظرفیت خروجی و امکان توزیع جریان افراد به خروجی‌های جایگزین.',evidence:[`حداکثر انتظار: ${maxWait} s`],source:'TXT DATA'});
  }

        recs.push({priority:'high',problem:'استفاده نامتوازن از خروجی‌ها',possibleCause:'مسیریابی پیش‌فرض',recommendation:'بررسی امکان هدایت بخشی از جمعیت به خروجی کم‌استفاده‌تر.',evidence:[`پرتراکم: ${mx}%`],source:'TXT DATA'});
      }
    }
  }
  if(num.criticalDoor){
    const d=num.criticalDoor;
    bn.push({location:d.name,issue:'بحرانی‌ترین در (بیشترین عبور)',severity:(d.totalUse||0)>100?'high':'medium',confidence:null,
      evidence:[`تعداد عبور: ${d.totalUse??'—'}`, d.flowAvg!=null?`جریان متوسط: ${d.flowAvg} pers/s`:'', d.lastOut!=null?`آخرین خروج: ${d.lastOut} s`:''].filter(Boolean),
      source:'TXT DATA',recommendation:'بررسی عرض مفید در و مسیرهای منتهی به آن؛ در صورت امکان توزیع به درهای موازی.'});
    recs.push({priority:(d.totalUse||0)>100?'high':'medium',problem:'تمرکز جریان روی در پرتراکم',possibleCause:'مسیریابی یا ظرفیت محدود',
      recommendation:'افزایش ظرفیت یا هدایت بخشی از جمعیت به خروجی‌های جایگزین.',evidence:[d.name+` — عبور ${d.totalUse}`],source:'TXT DATA'});
  }
  if(num.criticalCorridor){
    const c=num.criticalCorridor;
    bn.push({location:c.name,issue:'بحرانی‌ترین راهرو/فضا (بیشترین استفاده)',severity:'medium',confidence:null,
      evidence:[`استفاده: ${c.totalUse??'—'}`, c.lastOut!=null?`آخرین خروج: ${c.lastOut} s`:''].filter(Boolean),
      source:'TXT DATA',recommendation:'بررسی عرض راهرو و جلوگیری از تداخل جریان‌های متقابل.'});
  }
  if(num.criticalStair){
    const s=num.criticalStair;
    bn.push({location:s.name,issue:'راه‌پله پرتراکم',severity:(s.totalUse||0)>150?'high':'medium',confidence:null,
      evidence:[`عبور: ${s.totalUse??'—'}`, s.flowAvg!=null?`جریان: ${s.flowAvg} pers/s`:''].filter(Boolean),
      source:'TXT DATA',recommendation:'بررسی ظرفیت راه‌پله و امکان استفاده از راه‌پله‌های موازی.'});
  }
  // طبقات دیرتخلیه
  const lateFloors=(num.floorEvacuation||[]).filter(f=>f.maxExit!=null).sort((a,b)=>(b.maxExit||0)-(a.maxExit||0)).slice(0,2);
  lateFloors.forEach(f=>{
    if(f.maxExit!=null && num.kpis?.evacuationTime && f.maxExit>=0.85*num.kpis.evacuationTime){
      bn.push({location:f.name,issue:'زمان خروج بالا در طبقه',severity:'high',confidence:null,
        evidence:[`حداکثر زمان خروج طبقه: ${f.maxExit} s`],source:'TXT DATA',
        recommendation:'اولویت‌بندی تخلیه این طبقه یا افزایش ظرفیت مسیر خروج آن.'});
    }
  });
  for(const a of state.imageAnalyses){
    for(const f of (a.findings||[])){
      bn.push({
        location:f.location||'مکان نامشخص',issue:f.issue,severity:f.severity||'medium',
        confidence:f.confidence,evidence:[f.evidence||''].filter(Boolean),source:'IMAGE AI',
        recommendation:f.recommendation||null,imageName:a.fileName
      });
      if(f.severity==='critical'||f.severity==='high'){
        recs.push({priority:f.severity,problem:f.issue,possibleCause:f.evidence||'مشاهده تصویری',recommendation:f.recommendation||'بررسی ظرفیت و توزیع جریان در محل شناسایی‌شده.',evidence:[f.evidence||''],source:'IMAGE AI'});
      }
    }
  }
  const order={critical:0,high:1,medium:2,low:3};
  bn.sort((a,b)=>(order[a.severity]??9)-(order[b.severity]??9));
  recs.sort((a,b)=>(order[a.priority]??9)-(order[b.priority]??9));
  state.bottlenecks=bn;
  state.recommendations=recs;
  const crit=bn.filter(b=>b.severity==='critical').length;
  const high=bn.filter(b=>b.severity==='high').length;
  const comp=state.dataQuality.completeness||0;
  if(crit>=1||(maxWait!=null&&maxWait>90)) state.assessment={level:'critical-concern',label:'نگرانی بحرانی',description:'گلوگاه بحرانی یا زمان انتظار بسیار بالا. بازنگری فوری توصیه می‌شود.'};
  else if(high>=2||(maxWait!=null&&maxWait>45)) state.assessment={level:'high-concern',label:'نگرانی بالا',description:'چندین نقطه با شدت بالا. بررسی مهندسی پیشنهاد می‌شود.'};
  else if(high>=1||(maxWait!=null&&maxWait>25)||comp<40) state.assessment={level:'needs-review',label:'نیاز به بررسی',description:'یافته‌هایی وجود دارد که نیازمند بررسی متخصص است.'};
  else if(comp<25) state.assessment={level:'needs-review',label:'نیاز به بررسی',description:'داده‌های ورودی ناکافی است.'};
  else state.assessment={level:'acceptable',label:'قابل قبول',description:'بر اساس داده موجود شاخص بحرانی شدیدی مشاهده نشد. قضاوت نهایی با مهندس است.'};
}

Prefer 1-8 findings when any non-blue area is visible. Return [] only if the image is blank.`;

severity فقط یکی از: Low, Medium, High, Critical
فقط آرایه JSON برگردان، بدون متن اضافه.`;

function parseFindings(text){
  if(!text) return [];
  let c=String(text).trim();
  // strip thinking tags some models emit
  c=c.replace(/<think>[\s\S]*?<\/think>/gi,'').trim();
  c=c.replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/i,'');
  // try direct parse
  try{
    const p=JSON.parse(c);
    if(Array.isArray(p)) return p;
    if(p && Array.isArray(p.findings)) return p.findings;
    if(p && Array.isArray(p.results)) return p.results;
  }catch{}
  // find first JSON array
  const m=c.match(/\[[\s\S]*\]/);
  if(m){
    try{return JSON.parse(m[0]);}catch{}
    // fix trailing commas
    try{return JSON.parse(m[0].replace(/,\s*]/g,']').replace(/,\s*}/g,'}'));}catch{}
  }
  return [];
}
function normFindings(arr){
  return (arr||[]).map(f=>({
    location:f.location||'مکان نامشخص',
    issue:f.issue||f.problem||'',
    severity:String(f.severity||'low').toLowerCase(),
    confidence:Math.min(1,Math.max(0,Number(f.confidence)||0)),
    evidence:f.evidence||'',
    recommendation:f.recommendation||''
  })).filter(f=>f.issue);
}
async function compressImg(file,maxDim=1280){
  return new Promise((res,rej)=>{
    const img=new Image();const url=URL.createObjectURL(file);
    img.onload=()=>{
      const c=document.createElement('canvas');let w=img.width,h=img.height;
      if(w>maxDim||h>maxDim){if(w>h){h=Math.round(h*maxDim/w);w=maxDim;}else{w=Math.round(w*maxDim/h);h=maxDim;}}
      c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      c.toBlob(b=>{if(!b)return rej();const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(b);},'image/jpeg',0.85);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej();};
    img.src=url;
  });
}
async function analyzeOneImage(img){
  const key=state.settings.apiKey;
  if(!key) throw new Error('MISSING_API_KEY');
  const hash=img.hash;
  // فقط cache موفق با یافته یا صریحاً خالیِ معتبر — اگر force باشد دوباره بفرست
  if(state.cache[hash]&&!img.forceReanalyze && Array.isArray(state.cache[hash].findings) && state.cache[hash].findings.length>0){
    return {imageId:img.id,fileName:img.name,findings:state.cache[hash].findings,fromCache:true};
  }
  const dataUrl=await compressImg(img.file, 1536);
  const provider=state.settings.aiProvider;
  let findings=[];
  let rawText='';

  const userText = visionUserText(img.name);

  // OpenAI-compatible providers (OpenAI + Groq)
  if(provider==='openai' || provider==='groq'){
    const isGroq = provider==='groq';
    const endpoint = isGroq
      ? 'https://api.groq.com/openai/v1/chat/completions'
      : 'https://api.openai.com/v1/chat/completions';
    const model = state.settings.model || (isGroq ? 'qwen/qwen3.6-27b' : 'gpt-4o-mini');
    const res=await fetch(endpoint,{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
      body:JSON.stringify({
        model,max_tokens:3000,temperature:0.15,
        messages:[
          {role:'system',content:SYS_PROMPT},
          {role:'user',content:[
            {type:'text',text:userText},
            {type:'image_url',image_url:{url:dataUrl}}
          ]}
        ]
      })
    });
    if(res.status===429)throw new Error('RATE_LIMIT');
    if(res.status===401||res.status===403)throw new Error('MISSING_API_KEY');
    if(!res.ok){
      const errTxt=await res.text().catch(()=> '');
      console.error('API error', res.status, errTxt);
      throw new Error('API_ERROR');
    }
    const data=await res.json();
    rawText=data?.choices?.[0]?.message?.content||'';
    findings=normFindings(parseFindings(rawText));
  }else{
    // Gemini
    const model=state.settings.model||'gemini-1.5-flash';
    const b64=dataUrl.replace(/^data:image\/\w+;base64,/,'');
    const mime=dataUrl.match(/^data:(image\/\w+);/)?.[1]||'image/jpeg';
    const url=`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`;
    const res=await fetch(url,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        contents:[{parts:[{text:SYS_PROMPT+'\n\n'+userText},{inline_data:{mime_type:mime,data:b64}}]}],
        generationConfig:{temperature:0.15,maxOutputTokens:3000}
      })
    });
    if(res.status===429)throw new Error('RATE_LIMIT');
    if(res.status===401||res.status===403)throw new Error('MISSING_API_KEY');
    if(!res.ok)throw new Error('API_ERROR');
    const data=await res.json();
    rawText=data?.candidates?.[0]?.content?.parts?.[0]?.text||'';
    findings=normFindings(parseFindings(rawText));
  }

  if(!findings.length && rawText){
    console.warn('Vision returned text but no parseable findings. Raw:', rawText.slice(0,500));
  }

  // فقط وقتی یافته داریم cache کن تا نتیجه خالی قفل نشود
  if(findings.length){
    state.cache[hash]={findings,timestamp:Date.now()};
    try{localStorage.setItem('ei_cache',JSON.stringify(state.cache));}catch{}
  }
  img.forceReanalyze=false;
  return {imageId:img.id,fileName:img.name,findings,fromCache:false,rawPreview:rawText?rawText.slice(0,300):''};
}


/* ========== FILE + RECOMPUTE ========== */
async function handleFiles(fileList){
  for(const file of fileList){
    if(file.name.toLowerCase().endsWith('.txt') || file.type==='text/plain'){
      try{
        const text=await file.text();
        const parsed=parseTxt(text);
        state.files.push({id:uid(),name:file.name,size:file.size,text,parsed});
        if(!parsed.success) toast('اطلاعات قابل استخراج پیدا نشد: '+file.name,'warning');
        else toast(file.name+' پردازش شد.','success');
        if(state.projectName==='پروژه جدید'){
          state.projectName=file.name.replace(/\.txt$/i,'');
          setProjectName(state.projectName,true);
        }
      }catch(e){console.error(e);toast('فایل قابل خواندن نیست.','error');}
    } else if(['image/png','image/jpeg','image/webp','image/jpg'].includes(file.type) || /\.(png|jpe?g|webp)$/i.test(file.name)){
      try{
        const buf=await file.arrayBuffer();
        const h=await hashBuf(buf);
        const thumb=URL.createObjectURL(file);
        state.images.push({id:uid(),name:file.name,size:file.size,file,thumb,hash:h,forceReanalyze:false});
        toast(file.name+' اضافه شد.','success');
      }catch(e){toast('تصویر نامعتبر.','error');}
    } else {
      toast('فرمت پشتیبانی نمی‌شود: '+file.name,'error');
    }
  }
  recompute();
}

function recompute(){
  // ادغام همه TXTها
  let mergedExtracted={};
  let tables={floors:[],exits:[],rooms:[],stairs:[],behaviors:[],components:[]};
  for(const f of state.files){
    const p=f.parsed||parseTxt(f.text||'');
    f.parsed=p;
    if(p.extracted){
      for(const [k,v] of Object.entries(p.extracted)){
        if(v.status==='extracted') mergedExtracted[k]=v;
        else if(!mergedExtracted[k]) mergedExtracted[k]=v;
      }
    }
    if(p.tables){
      for(const key of Object.keys(tables)){
        if(Array.isArray(p.tables[key])) tables[key]=tables[key].concat(p.tables[key]);
      }
      // سازگاری
      if(p.tables.floors) tables.floors=tables.floors.concat(p.tables.floors);
      if(p.tables.exits) tables.exits=tables.exits.concat(p.tables.exits);
    }
  }
  // اطمینان از وجود کلیدهای PATTERNS
  for(const p of PATTERNS){
    if(!mergedExtracted[p.key]) mergedExtracted[p.key]={value:null,label:p.label,unit:p.unit,status:'missing'};
  }
  state.extracted=mergedExtracted;
  state.tables=tables;
  state.numerical=runNumerical(mergedExtracted,tables);
  state.dataQuality=dataQuality(mergedExtracted,state.images.length,tables);
}

function chartComponents(id,data){

    }
    chartComponents('c-comp', rows.filter(r=>r.lastOut!=null||r.totalUse!=null));

    }
    if(door){
      p2+=`بحرانی‌ترین در شناسایی‌شده «${escapeHtml(String(door))}» است`;
      if(doorUse!=null) p2+=` که حدود ${doorUse} نفر از آن عبور کرده‌اند`;
      p2+=' و از این رو ظرفیت و عرض مفید این خروجی در اولویت بازنگری قرار دارد. ';
    }
    if(corr) p2+=`در میان فضاهای داخلی، «${escapeHtml(String(corr))}» به‌عنوان پرتراکم‌ترین مسیر/فضا برجسته شده و احتمال تشکیل صف یا تداخل جریان در آن وجود دارد. `;
    parts.push(`<p>${p2}</p>`);

    // انتظار و رفتارها
    let p3='';
    if(tWait!=null || tWaitAvg!=null){
      p3+='شاخص‌های مرتبط با زمان انتظار (تخمینی از رفتارهای WAIT و مسافت حرکت) ';
      if(tWait!=null) p3+=`حداکثر حدود ${tWait} ثانیه`;
      if(tWait!=null && tWaitAvg!=null) p3+=' و ';
      if(tWaitAvg!=null) p3+=`میانگین حدود ${tWaitAvg} ثانیه`;
      p3+=' را نشان می‌دهند. ';
      if(tWait!=null && tWait>120) p3+='این مقادیر بیانگر وجود فاز انتظار طولانی پیش از تخلیه نهایی است که معمولاً در سناریوهای مرحله‌ای یا پناهگیری موقت (Refuge) دیده می‌شود و باید با سناریوی عملیاتی ساختمان هم‌خوانی داشته باشد. ';
      else p3+='سطح انتظار در محدوده قابل‌بررسی است، اما مقایسه با معیارهای طراحی پروژه توصیه می‌شود. ';
    }
    if(behAll.length){
      const slow=[...behAll].filter(b=>b.maxExit!=null).sort((a,b)=>(b.maxExit||0)-(a.maxExit||0)).slice(0,3);
      if(slow.length){
        p3+=`در تفکیک بر حسب Behavior، دیرترین گروه‌ها شامل ${slow.map(b=>`«${escapeHtml(b.name)}» (حداکثر ${b.maxExit} s`+(b.avgExit!=null?`، میانگین ${b.avgExit} s`:'')+')').join('، ')} هستند که نقش اصلی را در تعیین زمان کل تخلیه ایفا می‌کنند. `;
      }
    }
    if(p3) parts.push(`<p>${p3}</p>`);

    // Refuge
    if(refugeAll.length){
      const sorted=[...refugeAll].sort((a,b)=>(a.firstIn??0)-(b.firstIn??0));
      const earliest=sorted[0];
      const fullest=[...refugeAll].sort((a,b)=>(b.totalUse||0)-(a.totalUse||0))[0];
      let p4=`در تحلیل فضاهای پناه (Refuge Room)، ${refugeAll.length} فضا با استفاده مثبت شناسایی شده است. `;
      if(earliest) p4+=`زودترین رسیدن افراد مربوط به «${escapeHtml(earliest.shortName||earliest.name)}» در حدود ${earliest.firstIn??'—'} ثانیه است`;
      if(fullest) p4+=` و بیشترین استقرار مربوط به «${escapeHtml(fullest.shortName||fullest.name)}» با حدود ${fullest.totalUse??'—'} نفر می‌باشد`;
      p4+='. این الگو نشان می‌دهد که زمان‌بندی ورود به پناهگاه‌ها و ظرفیت آن‌ها باید در سناریوی عملیاتی و مسیرهای دسترسی بازبینی شود تا از انباشت نامتوازن جلوگیری گردد.';
      parts.push(`<p>${p4}</p>`);
    }

    // گلوگاه‌ها و پیشنهادها
    let p5='';
    if(bnAll.length){
      const crit=bnAll.filter(b=>b.severity==='critical'||b.severity==='high').length;
      p5+=`در مجموع ${bnAll.length} مورد گلوگاه یا نقطه بحرانی استخراج شده که ${crit} مورد آن با شدت بالا یا بحرانی ارزیابی شده است. `;
      const top=bnAll.slice(0,3);
      if(top.length){
        p5+='مهم‌ترین موارد عبارتند از: '+top.map(b=>`«${escapeHtml(b.location||'')}» از منظر ${escapeHtml(b.issue||'')}`).join('؛ ')+'. ';
      }
      p5+='این نقاط باید در اولویت مطالعات اصلاح هندسی، ظرفیت خروجی و مسیریابی قرار گیرند. ';
    } else {
      p5+='بر اساس داده‌های فعلی، گلوگاه مشخصی توسط موتور تحلیلی ثبت نشده است؛ با این حال نبود هشدار به‌معنای قطعی بودن ایمنی نیست و بررسی مهندسی مستقل همچنان لازم است. ';
    }
    if(recAll.length){
      p5+=`هم‌راستا با یافته‌ها، ${recAll.length} پیشنهاد اصلاحی تولید شده که مهم‌ترین آن‌ها شامل ${recAll.slice(0,3).map(r=>escapeHtml(r.problem||r.recommendation||'')).join('؛ ')} می‌شود. `;
      p5+='اجرای این پیشنهادها منوط به تأیید مهندس مسئول و تطبیق با ضوابط ملی و مشخصات پروژه است.';
    }
    parts.push(`<p>${p5}</p>`);

    // جمع‌بندی
    let p6=`در جمع‌بندی، وضعیت کلی پروژه از نظر سامانه «${escapeHtml(assessLabel)}» ارزیابی شده است. ${escapeHtml(assessDesc)} `;
    p6+=`کیفیت داده ورودی حدود ${dq.completeness||0}٪ برآورد شده`;
    if((dq.notes||[]).length) p6+=` و نکات کیفیت شامل موارد زیر است: ${dq.notes.map(n=>escapeHtml(n)).join('؛ ')}`;
    p6+='. توصیه می‌شود نتایج این گزارش به‌همراه نقشه‌های معماری و سناریوهای جایگزین تخلیه در کمیته فنی پروژه مرور شود و تصمیم‌های طراحی صرفاً بر اساس خروجی خودکار اتخاذ نگردد.';
    parts.push(`<p>${p6}</p>`);

    return parts.join('\n');
  })();

  return `<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"/>
<title>گزارش اجرایی — ${escapeHtml(state.projectName)}</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  @page{size:A4;margin:12mm}
  body{font-family:'Vazirmatn',Tahoma,sans-serif;color:#0f172a;background:#fff;font-size:10.5pt;line-height:1.45}
  .page{width:100%;max-width:210mm;margin:0 auto;padding:0}
  .page-break{page-break-before:always;break-before:page;margin-top:0;padding-top:0}
  .header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #1e40af;padding-bottom:8px;margin-bottom:10px}
  .header h1{font-size:14pt;color:#1e3a8a;font-weight:700}
  .header .sub{font-size:9pt;color:#64748b;margin-top:2px}
  .meta{text-align:left;font-size:8.5pt;color:#475569}
  .meta strong{color:#0f172a}
  .assess{border:1px solid #e2e8f0;border-right:4px solid ${assessColor};background:${assessBg};color:${assessFg};padding:8px 10px;border-radius:6px;margin-bottom:10px}
  .assess .t{font-weight:700;font-size:11pt}
  .assess .d{font-size:9pt;opacity:.9;margin-top:2px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
  .box{border:1px solid #e2e8f0;border-radius:6px;overflow:hidden}
  .box h2{background:#1e3a8a;color:#fff;font-size:9.5pt;padding:5px 8px;font-weight:600}
  .box .body{padding:6px 8px}
  table.kpi{width:100%;border-collapse:collapse;font-size:9.5pt}
  table.kpi td{padding:3px 4px;border-bottom:1px solid #f1f5f9}
  table.kpi tr:last-child td{border-bottom:none}
  table.kpi .lbl{color:#64748b;width:55%}
  table.kpi .val{font-weight:600;text-align:left}
  table.data{width:100%;border-collapse:collapse;font-size:8.5pt}
  table.data th{background:#f8fafc;color:#475569;font-weight:600;padding:4px 5px;border-bottom:1px solid #e2e8f0;text-align:right}
  table.data td{padding:3px 5px;border-bottom:1px solid #f1f5f9}
  .list{list-style:none;padding:0}
  .list li{padding:4px 0;border-bottom:1px solid #f1f5f9;font-size:9pt}
  .list li:last-child{border-bottom:none}
  .tag{display:inline-block;font-size:7.5pt;font-weight:700;padding:1px 6px;border-radius:999px;margin-left:4px}
  .tag-c{background:#fee2e2;color:#991b1b}.tag-h{background:#ffedd5;color:#c2410c}
  .tag-m{background:#fef3c7;color:#a16207}.tag-l{background:#dcfce7;color:#166534}
  .footer{margin-top:8px;padding-top:6px;border-top:1px solid #e2e8f0;font-size:7.5pt;color:#94a3b8;display:flex;justify-content:space-between}
  .note{font-size:8pt;color:#64748b;background:#f8fafc;border:1px dashed #e2e8f0;border-radius:6px;padding:6px 8px;margin-top:6px}
  .narrative h2{font-size:12pt;color:#1e3a8a;margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid #dbeafe}
  .narrative p{text-align:justify;margin-bottom:9px;font-size:10.5pt;line-height:1.75;color:#1e293b}
  .narrative .lead{font-weight:600;color:#1e3a8a}
  @media print{
  .item,.section,.kpi,.assess{page-break-inside:avoid;break-inside:avoid}
  h2{page-break-after:avoid}
    body{print-color-adjust:exact;-webkit-print-color-adjust:exact}
    .page{padding:0}
    .page-break{page-break-before:always;break-before:page}
  }
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <div>
      <h1>گزارش تحلیلی تخلیه اضطراری</h1>
      <div class="sub">Evacuation Insight — صفحه خلاصه اجرایی (مناسب گزارش کار)</div>
    </div>
    <div class="meta">
      <div><strong>پروژه:</strong> ${escapeHtml(state.projectName)}</div>
      <div><strong>تاریخ:</strong> ${dateStr}</div>
      <div><strong>کیفیت داده:</strong> ${dq.completeness||0}٪</div>
    </div>
  </div>

  <div class="assess">
    <div class="t">ارزیابی کلی: ${escapeHtml(assessLabel)}</div>
    <div class="d">${escapeHtml(assessDesc)}</div>
  </div>

  <div class="grid">
    <div class="box">
      <h2>شاخص‌های کلیدی عملکرد (KPI)</h2>
      <div class="body">
        <table class="kpi">
          ${row('تعداد کل افراد', k.totalOccupants!=null?k.totalOccupants+' نفر':'—')}
          ${row('تعداد طبقات (تراز)', k.numberOfFloors)}
          ${row('تعداد خروجی‌های فعال', k.numberOfExits)}
          ${row('زمان کل تخلیه', k.evacuationTime!=null?k.evacuationTime+' s':'—')}
          ${row('متوسط زمان خروج', k.averageEvacuationTime!=null?k.averageEvacuationTime+' s':'—')}
          ${row('خروج اولین نفر', k.firstOccupantExit!=null?k.firstOccupantExit+' s':'—')}
          ${row('بیشترین زمان انتظار (تخمینی)', k.maxWaitingTime!=null?k.maxWaitingTime+' s':'—')}
          ${row('متوسط سرعت', k.averageSpeed!=null?k.averageSpeed+' m/s':'—')}
          ${row('بحرانی‌ترین در', k.criticalDoor||'—')}
          ${row('بحرانی‌ترین راهرو/فضا', k.criticalCorridor||'—')}
        </table>
      </div>
    </div>
    <div class="box">
      <h2>گلوگاه‌ها و نقاط بحرانی (اولویت‌دار)</h2>
      <div class="body">
        ${!bn.length?'<div style="color:#94a3b8;font-size:9pt">گلوگاهی ثبت نشده است.</div>':
          `<ul class="list">${bn.map(b=>{
            const tc=b.severity==='critical'?'tag-c':b.severity==='high'?'tag-h':b.severity==='medium'?'tag-m':'tag-l';
            return `<li><span class="tag ${tc}">${sevFa(b.severity)}</span><strong>${escapeHtml(b.location||'')}</strong> — ${escapeHtml(b.issue||'')}</li>`;
          }).join('')}</ul>`}
      </div>
    </div>
  </div>

  <div class="grid">
    <div class="box">
      <h2>پیشنهادهای اصلاحی اولویت‌دار</h2>
      <div class="body">
        ${!rec.length?'<div style="color:#94a3b8;font-size:9pt">پیشنهادی تولید نشده است.</div>':
          `<ul class="list">${rec.map((r,i)=>{
            const tc=r.priority==='critical'?'tag-c':r.priority==='high'?'tag-h':r.priority==='medium'?'tag-m':'tag-l';
            return `<li><span class="tag ${tc}">${sevFa(r.priority)}</span><strong>${i+1}. ${escapeHtml(r.problem||'')}</strong><br/><span style="color:#475569">${escapeHtml(r.recommendation||'')}</span></li>`;
          }).join('')}</ul>`}
      </div>
    </div>
    <div class="box">
      <h2>خلاصه Refuge Room / رفتارهای دیرتخلیه</h2>
      <div class="body">
        ${refuge.length?`<table class="data"><thead><tr><th>Refuge</th><th>افراد</th><th>اولین ورود</th></tr></thead>
          <tbody>${refuge.map(r=>`<tr><td>${escapeHtml((r.shortName||r.name||'').slice(0,22))}</td><td>${r.totalUse??'—'}</td><td>${r.firstIn!=null?r.firstIn+' s':'—'}</td></tr>`).join('')}</tbody></table>`:
          behaviors.length?`<table class="data"><thead><tr><th>Behavior</th><th>حداکثر</th><th>میانگین</th></tr></thead>
          <tbody>${behaviors.map(b=>`<tr><td>${escapeHtml(b.name)}</td><td>${b.maxExit??'—'}</td><td>${b.avgExit??'—'}</td></tr>`).join('')}</tbody></table>`:
          '<div style="color:#94a3b8;font-size:9pt">داده تکمیلی موجود نیست.</div>'}
      </div>
    </div>
  </div>

  <div class="note">
    <strong>روش کار:</strong> ترکیب تحلیل عددی خروجی Pathfinder (فایل TXT) با یافته‌های تصویری (در صورت وجود) و موتور قاعده‌محور.
    صفحه بعد تفسیر تشریحی همین نتایج است. این گزارش جایگزین قضاوت نهایی مهندس ایمنی نیست.
  </div>

  <div class="footer">
    <span>Evacuation Insight — سامانه تحلیل تخلیه اضطراری</span>
    <span>صفحه ۱ از ۲</span>
  </div>
</div>

<div class="page page-break">
  <div class="header">
    <div>
      <h1>تفسیر تشریحی نتایج</h1>
      <div class="sub">تحلیل روایی شاخص‌ها، گلوگاه‌ها و پیشنهادها — مناسب بخش بحث گزارش کار</div>
    </div>
    <div class="meta">
      <div><strong>پروژه:</strong> ${escapeHtml(state.projectName)}</div>
      <div><strong>تاریخ:</strong> ${dateStr}</div>
    </div>
  </div>
  <div class="narrative">
    <h2>بحث و تفسیر فنی</h2>
    ${narrative}
  </div>
  <div class="note" style="margin-top:12px">
    متن فوق به‌صورت خودکار از روی داده‌های استخراج‌شده تولید شده و باید توسط مهندس مسئول بازبینی و در صورت نیاز ویرایش شود.
  </div>
  <div class="footer">
    <span>Evacuation Insight — سامانه تحلیل تخلیه اضطراری</span>
    <span>صفحه ۲ از ۲</span>
  </div>
</div>
</body>
</html>`;
}

function buildReportHtml(){
  const k=state.numerical.kpis||{},dq=state.dataQuality,a=state.assessment;
  const dateStr=new Date().toLocaleString('fa-IR');
  const assessClass=a?(a.level||'needs-review'):'needs-review';
  const kpi=(label,val,unit='')=>`
    <div class="kpi">
      <div class="kpi-l">${label}</div>
      <div class="kpi-v">${val!=null&&val!==''?val:'—'}${val!=null&&val!==''&&unit?`<span class="u">${unit}</span>`:''}</div>
    </div>`;
  const bnHtml=!state.bottlenecks.length
    ? `<div class="empty">گلوگاهی ثبت نشده است.</div>`
    : state.bottlenecks.map((b,i)=>`
      <div class="item sev-${b.severity||'low'}">
        <div class="item-top">
          <span class="idx">${i+1}</span>
          <span class="sev">${sevFa(b.severity)}</span>
          <span class="src">${b.source||''}</span>
        </div>
        <div class="item-title">${escapeHtml(b.location||'—')}</div>
        <div class="item-body">${escapeHtml(b.issue||'')}</div>
        ${(b.evidence&&b.evidence.length)?`<div class="item-ev">${b.evidence.map(e=>`<div>• ${escapeHtml(e)}</div>`).join('')}</div>`:''}
        ${b.recommendation?`<div class="item-rec"><strong>پیشنهاد:</strong> ${escapeHtml(b.recommendation)}</div>`:''}
        ${b.confidence!=null?`<div class="item-meta">اطمینان مدل: ${Math.round(b.confidence*100)}%</div>`:''}
      </div>`).join('');
  const recHtml=!state.recommendations.length
    ? `<div class="empty">پیشنهادی تولید نشده است.</div>`
    : state.recommendations.map((r,i)=>`
      <div class="item sev-${r.priority||'low'}">
        <div class="item-top">
          <span class="idx">${i+1}</span>
          <span class="sev">${sevFa(r.priority)}</span>
          <span class="src">${r.source||''}</span>
        </div>
        <div class="item-title">${escapeHtml(r.problem||'')}</div>
        ${r.possibleCause?`<div class="item-body">علت محتمل: ${escapeHtml(r.possibleCause)}</div>`:''}
        <div class="item-rec"><strong>اقدام پیشنهادی:</strong> ${escapeHtml(r.recommendation||'')}</div>
      </div>`).join('');

  return `<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>گزارش تحلیل تخلیه — ${escapeHtml(state.projectName)}</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  :root{
    --bg:#f1f5f9;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;
    --primary:#2563eb;--primary-soft:#dbeafe;
    --ok:#16a34a;--warn:#d97706;--bad:#dc2626;--crit:#7f1d1d;
  }
  *{box-sizing:border-box}
  body{
    margin:0;font-family:'Vazirmatn',Tahoma,system-ui,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.7;
  }
  .wrap{max-width:960px;margin:0 auto;padding:2rem 1.25rem 3rem}
  .hero{
    background:linear-gradient(135deg,#1e293b 0%,#1d4ed8 100%);
    color:#fff;border-radius:16px;padding:1.75rem 1.5rem;margin-bottom:1.25rem;
    box-shadow:0 10px 30px rgba(29,78,216,.25);
  }
  .hero-brand{font-size:.8rem;opacity:.85;margin-bottom:.35rem}
  .hero h1{margin:0 0 .4rem;font-size:1.45rem;font-weight:700}
  .hero-meta{display:flex;flex-wrap:wrap;gap:.75rem 1.25rem;font-size:.85rem;opacity:.92}
  .section{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:1.25rem 1.35rem;margin-bottom:1rem;box-shadow:0 1px 3px rgba(0,0,0,.04);
  }
  .section h2{
    margin:0 0 1rem;font-size:1.05rem;font-weight:700;
    display:flex;align-items:center;gap:.5rem;
    padding-bottom:.65rem;border-bottom:2px solid var(--primary-soft);color:#1e3a8a;
  }
  .section h2 span.num{
    display:inline-flex;align-items:center;justify-content:center;
    width:26px;height:26px;border-radius:8px;background:var(--primary);color:#fff;
    font-size:.8rem;font-weight:700;
  }
  .assess{
    border-radius:12px;padding:1rem 1.15rem;border:1px solid var(--line);
    display:flex;gap:.85rem;align-items:flex-start;
  }
  .assess.acceptable{background:#f0fdf4;border-color:#86efac}
  .assess.needs-review{background:#fffbeb;border-color:#fcd34d}
  .assess.high-concern{background:#fef2f2;border-color:#fca5a5}
  .assess.critical-concern{background:#450a0a;border-color:#7f1d1d;color:#fecaca}

function dl(content,name,mime){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:mime}));a.download=name;a.click();
}

function loadScript(src){
  return new Promise((resolve,reject)=>{
    const exist=[...document.getElementsByTagName('script')].find(s=>s.src===src);
    if(exist){ if(exist.dataset.loaded) return resolve(); exist.addEventListener('load',()=>resolve()); return; }
    const s=document.createElement('script');
    s.src=src; s.async=true;
    s.onload=()=>{s.dataset.loaded='1';resolve();};
    s.onerror=()=>reject(new Error('load failed: '+src));
    document.head.appendChild(s);
  });
}

}
