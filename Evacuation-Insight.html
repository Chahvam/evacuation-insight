function buildScenarioReportTxt(){
  const r=state.scenarios.result;
  if(!r||!r.ready) return '';
  const line='============================================================';
  const dateStr=new Date().toLocaleString('fa-IR');
  const L=[];
  L.push(line);
  L.push('گزارش مقایسه سناریوهای تخلیه — Evacuation Insight');
  L.push('پروژه: '+(state.projectName||'—'));
  L.push('حادثه: '+hazLabel(r.hazard));
  L.push('تاریخ: '+dateStr);
  L.push(line);
  L.push('');
  L.push('خلاصه اجرایی');
  L.push(r.pickTitle);
  L.push(r.exec);
  L.push('');
  L.push('ماتریس شاخص‌ها');
  const names=r.loaded.map(scLabel).join('\t');
  L.push('شاخص\t'+names);
  L.push('امتیاز\t'+r.loaded.map(k=>r.scores[k]!=null?String(r.scores[k]):'—').join('\t'));
  r.rows.forEach(row=>{
    L.push(row.label+'\t'+r.loaded.map(k=>row.vals[k]==null?'—':String(row.vals[k])).join('\t'));
  });
  L.push('');
  L.push('تفسیر اجراها');
  r.interpretations.forEach(it=>{ L.push('- '+scLabel(it.key)+': '+it.text); });
  L.push('');
  L.push('یافته‌ها');
  r.why.forEach(w=>L.push('- '+w));
  L.push('');
  r.loaded.forEach(k=>{
    const p=r.profiles[k];
    if(p.topExits.length){
      L.push('درهای پرترافیک ('+scLabel(k)+')');
      p.topExits.forEach(e=>L.push('  * '+e.name+' | عبور '+e.totalUse+' | سهم '+(e.share??'—')+'٪ | آخرین '+ (e.lastOut??'—')));
    }
    if(p.lateBeh.length){
      L.push('رفتارها ('+scLabel(k)+')');
      p.lateBeh.forEach(b=>L.push('  * '+b.name+' | n='+(b.count??'—')+' | min='+(b.minExit??'—')+' | max='+(b.maxExit??'—')));
    }
  });
  L.push('');
  L.push('پیشنهاد معماری');
  r.arch.forEach(a=>L.push('- '+a));
  L.push('');
  L.push('پیشنهاد بهره‌برداری');
  r.ops.forEach(a=>L.push('- '+a));
  L.push('');
  L.push('اقدام بعدی در Pathfinder');
  r.actions.forEach((a,i)=>L.push((i+1)+') '+a));
  L.push('');
  L.push('یادداشت: این مقایسه جایگزین مدل دود یا حکم آیین‌نامه‌ای نیست.');
  L.push(line);
  return L.join('\r\n');
}

async function exportScenario(kind){
  if(!state.scenarios.result || !state.scenarios.result.ready){
    toast('ابتدا مقایسه را اجرا کنید.','warning');
    return;
  }
  if(!document.getElementById('sc-export-root')){
    toast('نتیجه روی صفحه نیست.','warning');
    return;
  }
  drawScenarioChart();
  await new Promise(r=>setTimeout(r,220));
  const safe=scSafeName();
  if(kind==='html'){
    dl(buildScenarioReportHtml(), 'scenario_'+safe+'.html', 'text/html;charset=utf-8');
    toast('فایل HTML با همان ظاهر صفحه ذخیره شد.','success');
    return;
  }
  if(kind==='txt'){
    dl('\uFEFF'+buildScenarioReportTxt(), 'scenario_'+safe+'.txt', 'text/plain;charset=utf-8');
    toast('فایل متنی ذخیره شد.','success');
    return;
  }
  await exportScenarioPdf(safe);
}

async function exportScenarioPdf(safe){
  showLoading('آماده‌سازی PDF با ظاهر صفحه...',10);
  let host=null, stage=null;
  try{
    await ensurePdfLibs();
    drawScenarioChart();
    await new Promise(r=>setTimeout(r,250));
    const clone=snapshotScenarioExport();
    host=document.createElement('div');
    host.style.cssText='position:fixed;left:0;top:0;width:900px;background:#f4f6f9;z-index:2147483646;';
    const style=document.createElement('style');
    style.textContent=scenarioUiCss();
    host.appendChild(style);
    const wrap=document.createElement('div');
    wrap.className='page';
    wrap.style.cssText='width:900px;max-width:900px;padding:16px;background:#f4f6f9;box-sizing:border-box;';
    const title=state.projectName||'مقایسه سناریوها';
    wrap.innerHTML=`<div class="card" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem">
      <div><div style="font-weight:700">${escapeHtml(title)}</div>
      <div style="font-size:.85rem;color:#64748b">مقایسه سناریوها · Evacuation Insight</div></div>
      <div style="font-size:.85rem;color:#64748b">${new Date().toLocaleString('fa-IR')}</div>
    </div>`+clone.innerHTML;
    host.appendChild(wrap);
    document.body.appendChild(host);
    try{ if(document.fonts&&document.fonts.ready) await document.fonts.ready; }catch(e){}
    await new Promise(r=>setTimeout(r,200));

    const JsPDF=(window.jspdf&&window.jspdf.jsPDF)||window.jsPDF;
    if(!JsPDF) throw new Error('jsPDF نیست');
    const pdf=new JsPDF({unit:'mm',format:'a4',orientation:'portrait',compress:true});
    const cssW=900, pageCssH=1273, pageW=210, pageH=297, scale=1.5;
    const maxCssH=1080;

    const measure=el=>{
      const r=el.getBoundingClientRect();
      return Math.ceil(Math.max(r.height||0, el.offsetHeight||0, 36));
    };

    const atoms=[];
    [...wrap.children].filter(el=>el.nodeType===1).forEach(el=>{
      if((el.classList.contains('grid-2') || el.classList.contains('sc-grid')) && measure(el)>maxCssH){
        [...el.children].filter(c=>c.nodeType===1).forEach(c=>atoms.push(c));
      } else {
        atoms.push(el);
      }
    });

    const pageBoxes=[]; let cur=[], curH=0;
    const flush=()=>{ if(cur.length){ pageBoxes.push(cur); cur=[]; curH=0; } };
    atoms.forEach(el=>{
      const h=measure(el);
      const keep=el.querySelector && el.querySelector('table');
      if(h>maxCssH){
        flush();
        cur.push(el);
        flush();
        return;
      }
      if(cur.length && curH+h+24>maxCssH) flush();
      if(keep && cur.length && (maxCssH-curH)<h) flush();
      cur.push(el);
      curH+=h+24;
    });
    flush();
    const total=Math.max(pageBoxes.length,1);
    stage=document.createElement('div');
    stage.style.cssText='position:fixed;left:0;top:0;width:900px;background:#f4f6f9;z-index:2147483647;';
    const st2=document.createElement('style'); st2.textContent=scenarioUiCss(); stage.appendChild(st2);
    document.body.appendChild(stage);

    for(let i=0;i<pageBoxes.length;i++){
      const page=document.createElement('div');
      page.style.cssText=`position:relative;width:${cssW}px;height:${pageCssH}px;background:#f4f6f9;overflow:hidden;box-sizing:border-box;padding:20px 20px 52px;`;
      const inner=document.createElement('div');
      inner.style.cssText='width:100%;';
      pageBoxes[i].forEach(el=>inner.appendChild(el.cloneNode(true)));
      page.appendChild(inner);
      const f=document.createElement('div');
      f.style.cssText='position:absolute;left:0;right:0;bottom:0;height:40px;text-align:center;color:#64748b;line-height:40px;font-size:12px;background:#f4f6f9;';
      f.textContent=(state.projectName||'مقایسه سناریوها')+'  ·  صفحه '+toFaNum(i+1)+' از '+toFaNum(total);
      page.appendChild(f);
      stage.appendChild(page);
      await new Promise(r=>setTimeout(r,40));
      const avail=pageCssH-20-52;
      const ih=Math.max(inner.scrollHeight, inner.getBoundingClientRect().height||0);
      if(ih>avail){
        const s=Math.max(0.55, (avail-8)/ih);
        inner.style.transformOrigin='top center';
        inner.style.transform='scale('+s+')';
        await new Promise(r=>setTimeout(r,20));
      }
      const canvas=await window.html2canvas(page,{
        scale, backgroundColor:'#f4f6f9', useCORS:true, logging:false,
        width:cssW, height:pageCssH, windowWidth:cssW, windowHeight:pageCssH
      });
      if(i>0) pdf.addPage();
      pdf.addImage(canvas.toDataURL('image/jpeg',0.93),'JPEG',0,0,pageW,pageH);
      stage.removeChild(page);
      showLoading('ساخت PDF...', 25+Math.round((i+1)/total*70));
    }
    pdf.save('scenario_'+safe+'.pdf');
    stage.remove(); host.remove(); hideLoading();
    toast('فایل PDF با ظاهر همین صفحه ذخیره شد.','success');
  }catch(err){
    console.error(err);
    if(host) try{host.remove();}catch(e){}
    if(stage) try{stage.remove();}catch(e){}
    hideLoading();
    try{
      const w=window.open('','_blank');
      if(!w){ toast('پنجره چاپ باز نشد.','error'); return; }
      w.document.write(buildScenarioReportHtml());
      w.document.close();
      setTimeout(()=>{try{w.focus();w.print();}catch(e){}},500);
      toast('PDF خودکار ممکن نشد؛ پنجره چاپ با همان ظاهر باز شد.','warning');
    }catch(e){ toast('خروجی PDF ممکن نشد.','error'); }
  }
}

        <li style="margin-bottom:.45rem"><b>از TXT چیزی استخراج نمی‌شود:</b> باید خلاصه Queues پث‌فایندر باشد نه لاگ خام.</li>
        <li style="margin-bottom:.45rem"><b>تحلیل عکس صفر یافته:</b> کلید نیست یا مدل Vision نیست. عدد را بدون عکس ادامه دهید.</li>
        <li style="margin-bottom:.45rem"><b>تعداد طبقات خالی:</b> بعد از «تحلیل پروژه» نتایج عددی را دوباره باز کنید.</li>
        <li style="margin-bottom:.45rem"><b>صفحه قدیمی:</b> فایل HTML را دوباره باز کنید و Ctrl+F5 بزنید.</li>
        <li style="margin-bottom:.45rem"><b>PDF جدول را می‌برد:</b> در مقایسه سناریوها جدول کامل به صفحه بعد می‌رود.</li>
        <li style="margin-bottom:.45rem"><b>نمی‌دانم از کجا شروع کنم:</b> همین صفحه → شروع سریع → ورود اطلاعات.</li>
      </ul>
    </div>
    <p class="footer-note">این راهنما برای خودتان است؛ برای کارفرما فایل گزارش را بفرستید.</p>`;

  const toc=[
    ['h-map','نقشه بخش‌ها'],['h-quick','شروع سریع'],['h-import','ورود فایل'],['h-analyze','تحلیل و داشبورد'],
    ['h-num','نتایج عددی'],['h-img','تصاویر'],['h-bn','گلوگاه'],['h-rep','گزارش نهایی'],
    ['h-an','گزارش تحلیلی'],['h-sc','سناریوها'],['h-set','تنظیمات'],['h-faq','رفع اشکال']
  ];
  const box=document.getElementById('help-toc');
  if(box){
    toc.forEach(([id,lab])=>{
      const b=document.createElement('button');
      b.type='button'; b.textContent=lab;
      b.onclick=()=>document.getElementById(id)?.scrollIntoView({behavior:'smooth',block:'start'});
      box.appendChild(b);
    });
  }
  el.querySelectorAll('[data-go]').forEach(b=>{
    b.onclick=()=>navigate(b.getAttribute('data-go'));
  });
  el.querySelectorAll('[data-jump]').forEach(b=>{
    b.onclick=()=>document.getElementById(b.getAttribute('data-jump'))?.scrollIntoView({behavior:'smooth',block:'start'});
  });
}

function renderSettings(el){
  const st=state.settings;
  el.innerHTML=`
    <div class="card"><h3 style="margin-bottom:.75rem"><i data-lucide="cpu"></i> AI Vision Provider</h3>
      <div class="radio-group">
        <label class="radio-item"><input type="radio" name="prov" value="groq" ${st.aiProvider==='groq'?'checked':''}/> Groq (پیشنهادی — Vision رایگان)</label>
        <label class="radio-item"><input type="radio" name="prov" value="openai" ${st.aiProvider==='openai'?'checked':''}/> OpenAI</label>
        <label class="radio-item"><input type="radio" name="prov" value="gemini" ${st.aiProvider==='gemini'?'checked':''}/> Google Gemini</label>
        <label class="radio-item disabled"><input type="radio" disabled/> Local Vision AI <span class="coming-soon">Coming Soon</span></label>
      </div></div>
    <div class="card"><h3 style="margin-bottom:.75rem"><i data-lucide="key"></i> پیکربندی API</h3>
      <div class="form-group"><label>کلید API</label><input type="password" class="form-control" id="s-key" value="${escapeHtml(st.apiKey)}" placeholder="کلید API از console.groq.com" autocomplete="off"/></div>
      <div class="form-group"><label>مدل</label><input type="text" class="form-control" id="s-model" value="${escapeHtml(st.model)}" placeholder="qwen/qwen3.6-27b"/></div>
      <p style="font-size:.8rem;color:var(--text-muted);margin-bottom:.75rem">برای Groq مدل پیشنهادی: <code>qwen/qwen3.6-27b</code> یا <code>qwen/qwen3.8-27b</code></p>
      <button class="btn btn-primary" id="s-save">ذخیره تنظیمات</button>
      <button class="btn btn-secondary" id="s-test" style="margin-right:.5rem">تست اتصال Groq</button>
      <div class="security-warning"><i data-lucide="shield-alert"></i><div><strong>هشدار:</strong> کلید فقط در localStorage مرورگر شما ذخیره می‌شود و نباید در کد عمومی قرار گیرد. برای production از Backend Proxy استفاده کنید.</div></div></div>
    <div class="card"><h3 style="margin-bottom:.75rem"><i data-lucide="database"></i> داده</h3>
      <button class="btn btn-secondary" id="s-cache">پاک کردن Cache</button>
      <button class="btn btn-danger" id="s-clr" style="margin-right:.5rem">پاک کردن پروژه</button></div>`;
  document.getElementById('s-save').onclick=()=>{
    state.settings.apiKey=document.getElementById('s-key').value.trim();
    const prov=document.querySelector('input[name="prov"]:checked')?.value||'groq';
    state.settings.aiProvider=prov;
    const defaultModel = prov==='groq' ? 'qwen/qwen3.6-27b' : (prov==='openai' ? 'gpt-4o-mini' : 'gemini-1.5-flash');
    state.settings.model=document.getElementById('s-model').value.trim()||defaultModel;
    localStorage.setItem('ei_api_key',state.settings.apiKey);
    localStorage.setItem('ei_model',state.settings.model);
    localStorage.setItem('ei_provider',state.settings.aiProvider);
    toast('تنظیمات ذخیره شد.','success');
  };
  document.getElementById('s-test').onclick=async()=>{
    const key=document.getElementById('s-key').value.trim()||state.settings.apiKey;
    const model=(document.getElementById('s-model').value.trim()||state.settings.model||'qwen/qwen3.6-27b');
    if(!key){toast('ابتدا کلید را وارد کنید.','warning');return;}
    showLoading('تست اتصال به Groq...',40);
    try{
      const res=await fetch('https://api.groq.com/openai/v1/chat/completions',{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
        body:JSON.stringify({
          model,
          max_tokens:32,
          messages:[{role:'user',content:'Reply with only: OK'}]
        })
      });
      hideLoading();
      if(res.ok){
        toast('اتصال Groq موفق — مدل '+model+' در دسترس است.','success');
      }else{
        const t=await res.text().catch(()=> '');
        console.error('Groq test failed', res.status, t);
        let msg='خطا '+res.status;
        if(res.status===401) msg='کلید API نامعتبر است.';
        else if(res.status===404) msg='مدل پیدا نشد. مقدار مدل را به qwen/qwen3.6-27b تغییر دهید.';
        else if(res.status===429) msg='محدودیت نرخ — کمی صبر کنید.';
        else msg='خطا '+res.status+' — جزئیات در Console (F12)';
        toast(msg,'error');
      }
    }catch(e){
      hideLoading();
      console.error(e);
      toast('عدم دسترسی به api.groq.com — شبکه یا فیلتر.','error');
    }
  };
  document.getElementById('s-cache').onclick=()=>{state.cache={};localStorage.removeItem('ei_cache');toast('Cache پاک شد.','success');};
  document.getElementById('s-clr').onclick=()=>{if(confirm('کل پروژه پاک شود؟')){reset();navigate('dashboard');toast('پاک شد.','success');}};
}

function openModal(id){
  const img=state.images.find(i=>i.id===id);if(!img)return;
  const m=document.getElementById('image-modal');
  const el=document.getElementById('modal-img');
  el.src=img.file?URL.createObjectURL(img.file):(img.thumb||'');
  m.classList.remove('hidden');
}

/* ========== ANALYSIS ========== */
async function runAnalysis(){
  if(!state.files.length&&!state.images.length){
    toast('ابتدا از بخش «ورود اطلاعات» فایل TXT یا تصویر وارد کنید.','warning');
    navigate('import');
    return;
  }
  state.cancel=false;
  showLoading('آماده‌سازی...',5);
  try{
    recompute();
    const hasExtracted = Object.values(state.extracted||{}).some(e=>e.status==='extracted');
    if(state.files.length && !hasExtracted){
      toast('فایل TXT خوانده شد ولی داده قابل استخراج پیدا نشد. فرمت فایل را بررسی کنید.','warning');
    }

    let aiOk=0, aiFail=0, aiSkip=false;
    if(state.images.length){
      if(!navigator.onLine){
        toast('اینترنت قطع است — فقط تحلیل عددی انجام شد.','warning');
        aiSkip=true;
      } else if(!state.settings.apiKey){
        toast('کلید API تنظیم نشده. به تنظیمات بروید و کلید Groq را ذخیره کنید.','warning');
        aiSkip=true;
        navigate('settings');
      } else {
        const results=[];
        for(let i=0;i<state.images.length;i++){
          if(state.cancel){hideLoading();toast('لغو شد.','warning');return;}
          const img=state.images[i];
          showLoading(`تحلیل تصویر ${i+1} از ${state.images.length}... (${img.name})`, Math.round(((i+1)/state.images.length)*80));
          try{
            const r = await analyzeOneImage(img);
            results.push(r);
            if(r.error) aiFail++;
            else if((r.findings||[]).length) aiOk++;
            else {
              aiFail++;
              toast(`تصویر «${img.name}»: مدل پاسخی قابل‌استخراج برنگرداند. دکمه Re-analyze را بزنید یا مدل را عوض کنید.`,'warning');
              if(r.rawPreview) console.warn('Raw AI:', r.rawPreview);
            }
          }catch(err){
            console.error('Image analysis error:', err);
            let msg = err.message || 'ارتباط با سرویس برقرار نشد.';
            if(err.message==='MISSING_API_KEY') msg='کلید API نامعتبر است. دوباره در تنظیمات ذخیره کنید.';
            else if(err.message==='RATE_LIMIT') msg='محدودیت درخواست Groq پر شده. کمی صبر کنید.';
            else if(err.message==='API_ERROR') msg='خطای API. مدل را روی qwen/qwen3.6-27b بگذارید و دوباره امتحان کنید.';
            else if(String(err.message).includes('Failed to fetch') || String(err.name)==='TypeError')
              msg='دسترسی به api.groq.com برقرار نشد (شبکه/فیلتر).';
            results.push({imageId:img.id,fileName:img.name,findings:[],error:msg});
            aiFail++;
            toast(msg,'error');
          }
        }
        state.imageAnalyses=results;
      }
    }

    showLoading('ترکیب شواهد...',90);
    fuseAndRecommend();
    showLoading('تمام',100);
    setTimeout(hideLoading,350);

    const k = state.numerical.kpis||{};
    const parts=[];
    if(k.evacuationTime!=null) parts.push('زمان تخلیه: '+k.evacuationTime+'s');
    if(k.totalOccupants!=null) parts.push('افراد: '+k.totalOccupants);
    parts.push('گلوگاه: '+(state.bottlenecks||[]).length);
    if(state.images.length && !aiSkip) parts.push('تصویر OK: '+aiOk+(aiFail? ' / خطا: '+aiFail : ''));
    toast('تحلیل انجام شد — '+parts.join(' | '),'success');

    setProjectName(state.projectName,true);
    // همیشه به داشبورد برو تا نتیجه دیده شود
    navigate('dashboard');
  }catch(e){
    hideLoading();
    console.error(e);
    toast('خطا در تحلیل: '+(e.message||'نامشخص'),'error');
  }
}

function reset(){
  state.files=[];state.images=[];state.extracted={};state.tables={floors:[],exits:[]};
  state.numerical={};state.imageAnalyses=[];state.bottlenecks=[];state.recommendations=[];
  state.dataQuality={completeness:0,notes:[]};state.assessment=null;
  state.analytical={theme:state.analytical?.theme||'#1e3a8a',snapshots:[],flowImages:[],refugeImages:[]};
  state.scenarios={base:null,blocked:null,simultaneous:null,result:null,hazard:state.scenarios?.hazard||'fire'};
  state.projectName='پروژه جدید';
  setProjectName(state.projectName,true);
}

  const s=document.getElementById('sidebar');
  s.classList.toggle('collapsed');s.classList.toggle('expanded');
};
document.getElementById('nav').onclick=e=>{
  const item=e.target.closest('.nav-item');if(!item)return;
  e.preventDefault();navigate(item.dataset.view);
};
document.getElementById('btn-analyze').onclick=runAnalysis;
document.getElementById('btn-clear').onclick=()=>{if(confirm('پروژه پاک شود؟')){reset();navigate('dashboard');toast('پاک شد.','success');}};
document.getElementById('btn-cancel').onclick=()=>{state.cancel=true;};
document.querySelector('#image-modal .modal-backdrop').onclick=()=>document.getElementById('image-modal').classList.add('hidden');
document.querySelector('#image-modal .modal-close').onclick=()=>document.getElementById('image-modal').classList.add('hidden');

const pnameInput=document.getElementById('project-name-input');
if(pnameInput){
  pnameInput.value=state.projectName;
  pnameInput.addEventListener('change',()=>setProjectName(pnameInput.value));
  pnameInput.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();pnameInput.blur();}});

if(window.lucide)lucide.createIcons();
navigate('dashboard');
</script>
