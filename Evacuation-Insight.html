async function exportReportPdf(safeName){
  showLoading('آماده‌سازی کتابخانه‌های PDF...',10);
  let host=null;
  try{
    await ensurePdfLibs();
    showLoading('ساخت ظاهر حرفه‌ای گزارش...',30);

    host=document.createElement('div');
    host.id='ei-pdf-host';
    host.style.cssText='position:fixed;left:0;top:0;width:794px;z-index:2147483647;background:#f1f5f9;overflow:visible;';
    host.innerHTML=buildPdfMountHtml();
    document.body.appendChild(host);

    try{ if(document.fonts&&document.fonts.ready) await document.fonts.ready; }catch(e){}
    await new Promise(r=>setTimeout(r,600));

    const sheet=host.querySelector('#ei-pdf-sheet')||host;
    const scale=2;
    const pageWmm=210, pageHmm=297, margin=10;
    const usableWmm=pageWmm-margin*2;
    const usableHmm=pageHmm-margin*2;
    // عرض منطقی رندر (px در CSS)
    const cssW=794;
    const pxPerMm=cssW/usableWmm;
    const pageCssH=usableHmm*pxPerMm; // ارتفاع قابل‌استفاده هر صفحه به px CSS

    // جمع‌آوری بلوک‌های غیرقابل‌برش
    let blocks=[...sheet.querySelectorAll('[data-pdf-block]')];
    // اگر برای بخش گلوگاه/پیشنهاد فقط آیتم‌ها بلاک هستند، عنوان بخش را هم جدا گرفتیم
    // اگر بلوکی نبود، کل sheet یک بلوک
    if(!blocks.length) blocks=[sheet];

    showLoading('رندر بلوک‌های گزارش...',50);
    const rendered=[];
    for(let i=0;i<blocks.length;i++){
      const el=blocks[i];
      // اطمینان از پس‌زمینه
      const canvas=await window.html2canvas(el,{
        scale,
        backgroundColor:'#f1f5f9',
        useCORS:true,
        allowTaint:true,
        logging:false,
        scrollX:0,
        scrollY:0,
        onclone:(doc)=>{
          doc.querySelectorAll('[data-pdf-block],#ei-pdf-sheet, #ei-pdf-sheet *').forEach(n=>{
            try{
              n.style.outline='none';
              n.style.boxShadow='none';
              // کادر مشکی ناخواسته را ملایم کن
              const b=n.style.border||'';
              if(b && /black|#000|rgb\(0,\s*0,\s*0\)/i.test(b)) n.style.borderColor='#e2e8f0';
              const cs=doc.defaultView && doc.defaultView.getComputedStyle(n);
              if(cs && (cs.outlineStyle && cs.outlineStyle!=='none')) n.style.outline='none';
            }catch(e){}
          });
        }
      });
      rendered.push({
        canvas,
        // ارتفاع در مختصات CSS (قبل از scale)
        cssH: canvas.height/scale,
        cssW: canvas.width/scale
      });
      showLoading('رندر بلوک‌های گزارش...', 50+Math.round((i+1)/blocks.length*25));
    }

    showLoading('صفحه‌بندی بدون برش متن...',80);
    const JsPDF=(window.jspdf&&window.jspdf.jsPDF)||window.jsPDF;
    if(!JsPDF) throw new Error('jsPDF در دسترس نیست');
    const pdf=new JsPDF({unit:'mm',format:'a4',orientation:'portrait',compress:true});

    let curYmm=margin;
    let pageIndex=0;

    const newPage=()=>{
      if(pageIndex>0) pdf.addPage();
      pdf.setFillColor(241,245,249);
      pdf.rect(0,0,pageWmm,pageHmm,'F');
      curYmm=margin;
      pageIndex++;
    };
    newPage();

    for(const block of rendered){
      const blockHmm=(block.cssH/cssW)*usableWmm; // ارتفاع بلوک به mm با عرض usable
      // اگر بلوک از یک صفحه بزرگ‌تر است: برش اجباری با overlap کم
      if(blockHmm>usableHmm-2){
        // صفحه جدید اگر چیزی روی صفحه هست
        if(curYmm>margin+1) newPage();
        const imgW=block.canvas.width;
        const imgH=block.canvas.height;
        const pxPage=Math.floor(imgW*(usableHmm/usableWmm));
        let sy=0;
        while(sy<imgH){
          if(sy>0) newPage();
          const sh=Math.min(pxPage, imgH-sy);
          const pc=document.createElement('canvas');
          pc.width=imgW; pc.height=sh;
          const ctx=pc.getContext('2d');
          ctx.fillStyle='#f1f5f9';
          ctx.fillRect(0,0,imgW,sh);
          ctx.drawImage(block.canvas,0,sy,imgW,sh,0,0,imgW,sh);
          const mmH=(sh/imgW)*usableWmm;
          pdf.addImage(pc.toDataURL('image/jpeg',0.95),'JPEG',margin,curYmm,usableWmm,mmH);
          curYmm+=mmH+2;
          sy+=sh;
        }
        continue;
      }
      // اگر در فضای باقی‌مانده جا نمی‌شود → صفحه جدید
      if(curYmm+blockHmm>pageHmm-margin){
        newPage();
      }
      const data=block.canvas.toDataURL('image/jpeg',0.95);
      pdf.addImage(data,'JPEG',margin,curYmm,usableWmm,blockHmm);
      curYmm+=blockHmm+3; // فاصله بین بلوک‌ها
    }

    pdf.save('report_'+safeName+'.pdf');
    host.remove();
    host=null;
    hideLoading();
    toast('گزارش PDF با صفحه‌بندی اصلاح‌شده ذخیره شد.','success');
  }catch(err){
    console.error(err);
    if(host) try{host.remove();}catch(e){}
    hideLoading();
    toast('خطا در PDF خودکار — پنجره چاپ باز می‌شود (Save as PDF).','warning');
    openPrintReport();
  }
}

function toFaNum(v){
  if(v==null||v==='') return '—';
  return String(v).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]).replace(/\./g,'٫');
}
function toFaDate(d){
  try{return new Date(d||Date.now()).toLocaleDateString('fa-IR');}catch(e){return '—';}
}
function themeInk(hex){
  const h=String(hex||'#1e3a8a').replace('#','');
  if(h.length<6) return '#ffffff';
  const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
  const L=(0.299*r+0.587*g+0.114*b)/255;
  return L>0.62?'#0f172a':'#ffffff';
}
function guessSnapMeta(name){
  const n=String(name||'');
  let cat='density';
  if(/cong|congestion|ازدحام/i.test(n)) cat='congestion';
  else if(/los|level\s*of\s*service/i.test(n)) cat='los';
  else if(/speed/i.test(n)) cat='speed';
  else if(/usage/i.test(n)) cat='usage';
  else if(/dens/i.test(n)) cat='density';
  let floor='';
  let m=n.match(/Floor[_\s-]*([-+]?\d+(?:\.\d+)?)/i);
  if(m) floor=m[1];
  else if((m=n.match(/[-_]F\(([-+]?\d+(?:\.\d+)?)\)/i))) floor=m[1];
  else if((m=n.match(/([-+]?\d+(?:\.\d+)?)\s*m/i))) floor=m[1];
  let simTime='';
  m=n.match(/cong(?:estion)?[_-](\d+(?:\.\d+)?)/i);
  if(m) simTime=m[1];
  return {cat,floor,simTime};
}
function readImgFile(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(r.result);
    r.onerror=rej;
    r.readAsDataURL(file);
  });
}
async function addAnalyticalImages(listName, files, forcedCat){
  for(const file of files){
    if(!/^image\//.test(file.type) && !/\.(png|jpe?g|webp)$/i.test(file.name)) continue;
    const dataUrl=await readImgFile(file);
    const meta=guessSnapMeta(file.name);
    const item={id:uid(),name:file.name,dataUrl,floor:meta.floor||'',cat:forcedCat||meta.cat,simTime:meta.simTime||''};
    state.analytical[listName].push(item);
  }
  toast(files.length+' تصویر افزوده شد.','success');
  navigate('analytical');
}

function snapsOf(cat){

function interpretSnap(img, kind){
  const floor = img && img.floor ? ('تراز '+toFaNum(img.floor)+' متر') : (img && img.name ? img.name : 'طبقه مورد بررسی');
  const k=state.numerical.kpis||{};
  if(kind==='density'){
    return 'نقشه تراکم تجمعی '+floor+' توزیع فضایی حضور افراد را نشان می‌دهد. نوارهای گرم (نارنجی تا قرمز) معمولاً در ورودی راه‌پله، پاگرد و نقاط ادغام جریان تشکیل می‌شوند. اگر این الگو در چند طبقه تکرار شود، محدودیت سیستماتیک هندسی است نه رخداد موضعی یک طبقه. '+
      (k.criticalCorridor?('فضای پرتراکم استخراج‌شده از فایل TXT: «'+k.criticalCorridor+'». '):'')+
      'تفسیر مهندسی: تراکم لحظه‌ای به‌تنهایی کافی نیست؛ باید با سرعت پایین و LOS نامطلوب در همان مختصات هم‌خوانی داشته باشد تا گلوگاه قطعی اعلام شود.';
  }
  if(kind==='speed'){
    return 'نقشه سرعت '+floor+' کیفیت حرکت را روی همان هندسه نشان می‌دهد. بازه آبی/سبز معمولاً حرکت آزاد (حدود ۰٫۸ تا ۱٫۴ متر بر ثانیه) و بازه قرمز افت شدید سرعت (زیر ۰٫۴ متر بر ثانیه) و صف‌بندی است. '+
      (k.averageSpeed!=null?('متوسط سرعت کل مدل حدود '+toFaNum(k.averageSpeed)+' متر بر ثانیه است. '):'')+
      'هم‌پوشانی نقاط قرمز این نقشه با نقاط گرم Density، استحکام تشخیص گلوگاه را بالا می‌برد.';
  }
  if(kind==='los'){
    return 'نقشه LOS '+floor+' کیفیت خدمت حرکت را بر اساس سطوح Fruin (A تا F) نمایش می‌دهد. بنفش/سبز (A–C) جریان مطلوب و زرد تا قرمز (D–F) محدودیت جدی یا نزدیک به توقف است. ناحیه‌ای که هم‌زمان LOS ضعیف، Density بالا و Speed پایین داشته باشد، اولویت اول اصلاح عرض راهرو یا درگاه پله است.';
  }
  if(kind==='usage'){
    return 'نقشه Usage '+floor+' بار تجمعی فضا در کل مدت شبیه‌سازی است (occupant×second)، نه یک لحظه اوج. تمرکز رنگ در هسته پله و راهروی میانی یعنی این اجزا در بازه طولانی زیر بار بوده‌اند. این یافته برای تصمیم معماری (عریض‌سازی پایدار، نه فقط رفع اوج لحظه‌ای) اهمیت دارد.';
  }
  if(kind==='congestion'){
    const when=img && img.simTime ? (' این فریم حدود ثانیه '+toFaNum(img.simTime)+' شبیه‌سازی است.') : '';
    return 'نقشه Congestion '+floor+' زمان ازدحام را بر حسب ثانیه نشان می‌دهد، نه تراکم نفر بر مترمربع. آبی نزدیک صفر است و قرمز یا سفید بالای نوار رنگ یعنی بیشترین ماندگاری کندی در همان فریم.'+when+
      ' اگر تقریباً همه پلان آبی باشد و فقط یک در یا دهانه قرمز باشد، ازدحام سراسری نیست و گلوگاه موضعی همان نقطه است. تکرار این لکه در فریم‌های بعدی یعنی گلوگاه پایدار است و اولویت اصلاح عرض یا حذف ادغام جریان همانجاست.';
  }
  if(kind==='flow'){
    return 'نمودار/تصویر جریان «'+((img&&img.name)||'')+'» الگوی عبور از در یا مقطع را نشان می‌دهد. شیب تند منحنی تجمعی یعنی نرخ عبور بالا؛ پله‌ای شدن منحنی نشانه توقف-حرکت (Stop-and-Go) و صف پشت در است. درِ کم‌شیب یا بدون عبور، ظرفیت استفاده‌نشده یا مسیر ازدست‌رفته است و باید در تعادل بار مسیرها بررسی شود.';
  }
  if(kind==='refuge'){
    return 'تصویر مرتبط با فضای پناه «'+((img&&img.name)||'')+'» وضعیت تجمع یا روند اشغال Refuge را نشان می‌دهد. پر شدن پلکانی معمولاً با تریگر طبقات هم‌خوان است. اگر راهروی منتهی به پناهگاه همزمان پرتراکم باشد، گره حیاتی مدل همین تراز است و هر افزایش عرض یا مسیر موازی اثر مستقیم بر RSET دارد.';
  }
  return 'تصویر خروجی Pathfinder مربوط به '+floor+' است و باید در کنار شاخص‌های عددی همان تراز تفسیر شود.';
}

function figBlock(img, cap, kind){
  if(!img) return '';
  const interp=interpretSnap(img, kind||'');
  return `<div class="fig-wrap">
    <div class="blk-gap"></div>
    <div class="fig keep">
      <img src="${img.dataUrl}" width="560" alt=""/>
      <div class="figcap">${cap}</div>
    </div>
    <div class="figint">${interp}</div>
  </div>`;
}
function tableWrap(cap, innerHtml){
  return `<div class="tbl-wrap"><div class="blk-gap"></div><div class="tblcap">${cap}</div>${innerHtml}</div>`;
}

function expertRecommendations(){
  const k=state.numerical.kpis||{};
  const beh=state.numerical.behaviorEvacuation||[];
  const exits=state.numerical.exitUtilization||[];
  const refuge=state.numerical.refugeRooms||[];
  const items=[];
  const wait=beh.filter(b=>/WAIT/i.test(b.name)).sort((a,b)=>(b.maxExit||0)-(a.maxExit||0));
  const evac=beh.filter(b=>/EVAC/i.test(b.name));
  if(wait.length){
    items.push({t:'بازتنظیم فاصله رهاسازی طبقات (Staged Release Interval)',
      d:'گروه‌های انتظار دیرتخلیه مانند «'+(wait[0].name||'')+'» تا '+toFaNum(wait[0].maxExit)+' ثانیه زمان تکمیل دارند. اگر نرخ عبور درها هنوز زیر ظرفیت اسمی است، می‌توان فاصله ۷۰–۹۰ ثانیه‌ای تریگرها را کمی کوتاه کرد تا زمان انتظار کم شود؛ مشروط بر اینکه عرض کریدور طبقاتی هم‌زمان اصلاح شود تا صف در پاگرد دوباره اوج نگیرد.'});
  }
  if(exits.length>=2){
    const s=[...exits].sort((a,b)=>(b.totalUse||0)-(a.totalUse||0));
    items.push({t:'تعادل‌بخشی بار بین هسته‌های خروج موازی',
      d:'بیشترین عبور از «'+(s[0].name||'')+'» با حدود '+toFaNum(s[0].totalUse)+' نفر ثبت شده است. عدم توازن بین مسیرهای موازی معمولاً از هندسه دسترسی، علائم راهبری یا تخصیص طبقات به هسته پله ناشی می‌شود. بازتوزیع Wayfinding، اتصال کوتاه بین دو بال، یا تغییر درِ ترجیحی مدل می‌تواند بار را متعادل کند.'});
  }
  items.push({t:'افزایش عرض مفید کریدورهای عمودی دسترسی به پاگرد پله',
    d:'تکرار الگوی تراکم در ورودی پله‌های طبقات تیپ، مسئله سیستماتیک معماری است. افزایش عرض این بازه کوتاه راهرو، حذف پیش‌آمدگی ستون/مبلمان و نرم کردن کنج ۹۰ درجه، LOS را از باند E–F به C–D نزدیک می‌کند بدون آنکه کل پلان طبقه عوض شود.'});
  items.push({t:'عریض‌سازی درگاه اتصال راهرو به پاگرد',
    d:'اغلب پله هنوز به ظرفیت اسمی نرسیده و تنگنا در درگاه است. افزایش عرض مفید در یا تبدیل در تک‌لنگه به دو لنگه نامساوی، نرخ ورود به پله را به ظرفیت واقعی پله نزدیک می‌کند.'});
  if(refuge.length){
    const full=[...refuge].sort((a,b)=>(b.totalUse||0)-(a.totalUse||0))[0];
    items.push({t:'تقویت مسیر افقی تراز پناهگاه و خروج نهایی',
      d:(full?('پناهگاه «'+(full.shortName||full.name)+'» حدود '+toFaNum(full.totalUse)+' نفر پذیرش داشته است. '):'')+
        'تراز Refuge معمولاً هم مقصد تجمع و هم مسیر خروج نهایی است. عریض‌سازی راهروی افقی، افزودن مسیر موازی مستقل، یا جدا کردن جریان ورود به پناه از جریان خروج نهایی، ریسک انسداد تک‌مسیره را کم می‌کند.'});
  }
  items.push({t:'سناریوی ازدست‌رفتن یک راه‌پله (Stair Unavailability)',
    d:'مطابق منطق آیین‌نامه‌ای، یک اجرا با انسداد یکی از هسته‌های پرتردد انجام شود تا معلوم شود RSET و تراکم پناهگاه تا چه حد به آن هسته وابسته است.'});
  items.push({t:'پیشنهاد خلاقانه: بافر میانی و «دریچه آرام‌سازی» در پاگرد',
    d:'به‌جای فقط عریض کردن راهرو، می‌توان یک فضای انتظار کوچک (Holding Niche) کنار پاگرد ایجاد کرد تا افراد قبل از ورود به پله از جریان اصلی جدا شوند. این کار اوج چگالی در آستانه در را می‌شکند و برای افراد کم‌توان نیز نقطه توقف امن می‌سازد.'});
  items.push({t:'پیشنهاد خلاقانه: زمان‌بندی پویا به‌جای تریگر ثابت',
    d:'تریگر طبقاتی می‌تواند به‌جای زمان ثابت، به پرشدگی لحظه‌ای پاگرد یا نرخ عبور پله وصل شود (Occupancy-triggered release). وقتی چگالی پاگرد از حد مشخص پایین آمد، طبقه بعدی رها شود. این منطق صف را پایدارتر از فاصله ثابت ۷۵–۹۰ ثانیه نگه می‌دارد.'});
  items.push({t:'پیشنهاد معماری: مسیر خروج دوم از تراز پناه',
    d:'اگر هندسه اجازه دهد، یک خروج افقی مستقل (مثلاً به حیاط، رمپ یا بنای مجاور) از تراز Refuge تعریف شود تا ۹۵٪ جمعیت روی یک کریدور سوار نباشند.'});
  items.push({t:'پیشنهاد بهره‌برداری: راهبری فعال و تفکیک جریان',
    d:'تابلوهای پویا، نور خطی کف و تفکیک ورود/خروج در پناهگاه هزینه کمی دارند و می‌توانند عدم‌توازن هسته‌های پله را بدون تخریب سازه اصلاح کنند. آموزش راهبران تخلیه برای هدایت گروه WAIT به مسیر کم‌بار نیز اثر فوری دارد.'});
  if(k.averageSpeed!=null && k.averageSpeed<0.6){
    items.push({t:'بازنگری ترکیب مسیر افقی و قائم',
      d:'متوسط سرعت کل مدل حدود '+toFaNum(k.averageSpeed)+' متر بر ثانیه است و نشان می‌دهد سهم زیادی از زمان در ازدحام یا انتظار مصرف شده. کوتاه کردن مسیر افقی پناهگاه یا حذف شکست‌های غیرضروری پلان، زمان حرکت خالص را کم می‌کند.'});
  }
  (state.recommendations||[]).slice(0,6).forEach(r=>{
    items.push({t:r.problem||'پیشنهاد حاصل از موتور تحلیلی', d:r.recommendation||''});
  });
  // unique by title
  const seen=new Set(); const out=[];
  items.forEach(x=>{if(!seen.has(x.t)){seen.add(x.t);out.push(x);}});
  return out.slice(0,12);
}


function buildAnalyticalHtml(kind){
  const k=state.numerical.kpis||{};
  const theme=state.analytical.theme||'#1e3a8a';
  const ink=themeInk(theme);
  const title=state.projectName||'گزارش تحلیلی تخلیه اضطراری';
  const dateStr=toFaDate(Date.now());
  const occ=k.totalOccupants, floors=k.numberOfFloors;
  const tEvac=k.evacuationTime, tAvg=k.averageEvacuationTime, tFirst=k.firstOccupantExit;
  const spd=k.averageSpeed, dist=k.averageDistance, tWait=k.maxWaitingTime, tWaitAvg=k.averageWaitingTime;
  const door=k.criticalDoor, corr=k.criticalCorridor;
  const beh=state.numerical.behaviorEvacuation||[];
  const exits=(state.numerical.exitUtilization||[]).slice(0,12);
  const refuge=state.numerical.refugeRooms||[];
  const dens=snapsOf('density'), los=snapsOf('los'), spe=snapsOf('speed'), usa=snapsOf('usage'), cong=snapsOf('congestion');
  const flows=state.analytical.flowImages||[];
  const refs=state.analytical.refugeImages||[];
  let figN=0, tabN=0;
  const nextFig=()=>{figN+=1; return toFaNum(figN);};
  const nextTab=()=>{tabN+=1; return toFaNum(tabN);};
  const t1=nextTab();
  const wait=beh.filter(b=>/WAIT/i.test(b.name)).sort((a,b)=>(b.maxExit||0)-(a.maxExit||0));
  const evacB=beh.filter(b=>/EVAC/i.test(b.name)).sort((a,b)=>(a.maxExit||0)-(b.maxExit||0));
  const tBeh=beh.length?nextTab():'—';
  const behRows=beh.map(b=>`<tr><td>${escapeHtml(b.name)}</td><td>${toFaNum(b.count)}</td><td>${toFaNum(b.minExit)}</td><td>${toFaNum(b.maxExit)}</td><td>${toFaNum(b.avgExit)}</td></tr>`).join('');
  const tExit=exits.length?nextTab():'—';
  const exitRows=exits.map(e=>`<tr><td>${escapeHtml(e.name)}</td><td>${toFaNum(e.totalUse)}</td><td>${toFaNum(e.flowAvg)}</td><td>${toFaNum(e.firstIn)}</td><td>${toFaNum(e.lastOut)}</td></tr>`).join('');
  const tRef=refuge.length?nextTab():'—';
  const refRows=refuge.map(r=>`<tr><td>${escapeHtml(r.shortName||r.name)}</td><td>${toFaNum(r.floor)}</td><td>${toFaNum(r.totalUse)}</td><td>${toFaNum(r.firstIn)}</td><td>${toFaNum(r.lastOut)}</td></tr>`).join('');
  const tCrit=nextTab();
  const bnRows=(state.bottlenecks||[]).slice(0,8).map((b,i)=>`<tr><td>${toFaNum(i+1)}</td><td>${escapeHtml(b.location||'')}</td><td>${escapeHtml(b.issue||'')}</td><td>${sevFa(b.severity)}</td></tr>`).join('');
  const recs=expertRecommendations();

  const densFig=dens[0]?figBlock(dens[0], `شکل ${nextFig()} — تراکم جمعیتی ${dens[0].floor?('تراز '+toFaNum(dens[0].floor)+' متر'):escapeHtml(dens[0].name)} (تجمعی)`, 'density'):'';
  const speFig=spe[0]?figBlock(spe[0], `شکل ${nextFig()} — سرعت حرکت ${spe[0].floor?('تراز '+toFaNum(spe[0].floor)+' متر'):escapeHtml(spe[0].name)}`, 'speed'):'';
  const losFig=los[0]?figBlock(los[0], `شکل ${nextFig()} — سطح خدمات‌رسانی LOS ${los[0].floor?('تراز '+toFaNum(los[0].floor)+' متر'):escapeHtml(los[0].name)}`, 'los'):'';
  const usaFig=usa[0]?figBlock(usa[0], `شکل ${nextFig()} — میزان استفاده Usage ${usa[0].floor?('تراز '+toFaNum(usa[0].floor)+' متر'):escapeHtml(usa[0].name)}`, 'usage'):'';
  const congCap=(im)=>`شکل ${nextFig()} — زمان ازدحام Congestion ${im.floor?('تراز '+toFaNum(im.floor)+' متر'):escapeHtml(im.name)}${im.simTime?(' — حدود ثانیه '+toFaNum(im.simTime)):''}`;
  const congFig=cong[0]?figBlock(cong[0], congCap(cong[0]), 'congestion'):'';
  const congMore=cong.slice(1).map(im=>figBlock(im, congCap(im), 'congestion')).join('');
  const flowFigs=flows.map(im=>figBlock(im, `شکل ${nextFig()} — جریان در / مسیر — ${escapeHtml(im.name)}`, 'flow')).join('');
  const refFigs=refs.map(im=>figBlock(im, `شکل ${nextFig()} — Refuge — ${escapeHtml(im.name)}`, 'refuge')).join('');

  const appendixImgs=[
    ...dens.map((im,i)=>({im,kind:'density',label:`پیوست شکل آ-${toFaNum(i+1)} — Density — ${im.floor?('تراز '+toFaNum(im.floor)):im.name}`})),
    ...los.map((im,i)=>({im,kind:'los',label:`پیوست شکل ب-${toFaNum(i+1)} — LOS — ${im.floor?('تراز '+toFaNum(im.floor)):im.name}`})),
    ...spe.map((im,i)=>({im,kind:'speed',label:`پیوست شکل پ-${toFaNum(i+1)} — Speed — ${im.floor?('تراز '+toFaNum(im.floor)):im.name}`})),
    ...usa.map((im,i)=>({im,kind:'usage',label:`پیوست شکل ت-${toFaNum(i+1)} — Usage — ${im.floor?('تراز '+toFaNum(im.floor)):im.name}`})),
    ...cong.map((im,i)=>({im,kind:'congestion',label:`پیوست شکل چ-${toFaNum(i+1)} — Congestion — ${im.floor?('تراز '+toFaNum(im.floor)):im.name}${im.simTime?(' — t='+toFaNum(im.simTime)+' s'):''}`})),
    ...flows.map((im,i)=>({im,kind:'flow',label:`پیوست شکل ث-${toFaNum(i+1)} — Flow — ${im.name}`})),
    ...refs.map((im,i)=>({im,kind:'refuge',label:`پیوست شکل ج-${toFaNum(i+1)} — Refuge — ${im.name}`}))
  ];

  const rsetMin=tEvac!=null?Math.floor(tEvac/60):null;
  const rsetSec=tEvac!=null?Math.round(tEvac%60):null;
  const pad=n=>String(n).padStart(2,'0').replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
  const rsetFa=tEvac!=null?(toFaNum(rsetMin)+':'+pad(rsetSec)+' دقیقه'):'—';

  const pBehWait = wait.length?(`دیرترین گروه رفتاری «${escapeHtml(wait[0].name)}» با بیشینه ${toFaNum(wait[0].maxExit)} و میانگین ${toFaNum(wait[0].avgExit)} ثانیه است. `):'';
  const pBehEvac = evacB.length?(`زودترین گروه EVAC «${escapeHtml(evacB[0].name)}» با بیشینه ${toFaNum(evacB[0].maxExit)} ثانیه تخلیه شده است. `):'';
  const pRef = refuge.length?(`تعداد ${toFaNum(refuge.length)} فضای Refuge با استفاده مثبت شناسایی شد؛ زودترین ورود مربوط به «${escapeHtml((refuge.slice().sort((a,b)=>(a.firstIn??9e9)-(b.firstIn??9e9))[0].shortName)||'')}» است. `):'';

  return `<!DOCTYPE html>

<head>
<meta charset="UTF-8"/>

<div class="pb"></div>
<h2 data-ch="1">۱- سناریو تخلیه مدلسازی</h2>
<p>سناریوی این گزارش مستقیماً از خروجی خام Pathfinder پروژه «${escapeHtml(title)}» استخراج شده و تلاش می‌کند تصویر کمی و کیفی واحدی از عملکرد تخلیه به‌دست دهد. جمعیت مدل ${occ!=null?toFaNum(occ)+' نفر':'در فایل مشخص نشده'} و تعداد ترازهای ارتفاعی ${floors!=null?toFaNum(floors):'نامشخص'} است. زمان خروج اولین نفر ${tFirst!=null?toFaNum(tFirst)+' ثانیه':'نامشخص'} و زمان خروج آخرین نفر ${tEvac!=null?toFaNum(tEvac)+' ثانیه':'نامشخص'} ثبت شده است. فاصله این دو عدد، پهنای پنجره تخلیه را نشان می‌دهد و باید در کنار راهبرد مرحله‌ای تفسیر شود نه به‌تنهایی به‌عنوان ضعف هندسی.</p>
<p>${pBehEvac}${pBehWait}وجود همزمان رفتارهای EVAC و WAIT نشان می‌دهد مدل از تخلیه مرحله‌ای استفاده کرده است: بخشی از طبقات بلافاصله حرکت می‌کنند و بخشی تا فعال‌شدن تریگر در محل می‌مانند. این منطق اگر درست تنظیم شود از هجوم همزمان به راه‌پله جلوگیری می‌کند، اما اگر فاصله تریگرها بیش از ظرفیت باقی‌مانده پله باشد، زمان انتظار سهم نامتناسبی از RSET می‌سازد. بنابراین هر عدد زمانی این گزارش باید به سه جزء تفکیک شود: انتظار سناریو، حرکت خالص، و تأخیر صف در گلوگاه.</p>
<p>از منظر مسیر بحرانی، بحرانی‌ترین در استخراج‌شده ${door?('«'+escapeHtml(door)+'»'):'در فایل مشخص نشده'} و پرتراکم‌ترین فضا ${corr?('«'+escapeHtml(corr)+'»'):'در فایل مشخص نشده'} است. این دو نقطه نقطه شروع بررسی هندسی‌اند. اگر آخرین خروج مدل روی همین خانواده درها رخ داده باشد، هر اصلاح عرض، تعادل بار یا مسیر موازی مستقیماً RSET را جابه‌جا می‌کند. در غیر این صورت گلوگاه در بالادست (پاگرد، راهروی طبقاتی یا پناهگاه) قرار دارد و دستکاری فقط در خروجی نهایی اثر محدودی دارد.</p>
<p>خوانش صحیح سناریو ایجاب می‌کند جمعیت، تراز، رفتار و خروجی‌ها با هم دیده شوند. جمعیتی که روی چند هسته پله توزیع شده با جمعیتی که به یک راهروی افقی پناهگاه ختم می‌شود، دو مسئله متفاوت می‌سازد. هدف این بخش تثبیت چارچوب تفسیر برای فصل‌های بعد است تا شاخص‌ها جدا از بستر سناریو قضاوت نشوند.</p>

<div class="pb"></div>
<h2 data-ch="2">۲- مقدمه و هدف</h2>
<p>گزارش حاضر برای تحلیل فنی نتایج شبیه‌سازی تخلیه اضطراری با نرم‌افزار Pathfinder تهیه شده است. Pathfinder شبیه‌ساز عامل‌محور است و حرکت هر فرد با الگوریتم هدایت و اجتناب از برخورد (Steering) روی هندسه واقعی ساختمان محاسبه می‌شود. برخلاف مدل‌های صرفاً جریان‌محور که ظرفیت را به‌صورت عدد ثابت به مقطع نسبت می‌دهند، در این رویکرد صف و تداخل از تعامل افراد با تنگناها به‌صورت طبیعی ظاهر می‌شود. همین ویژگی اجازه می‌دهد محل دقیق کاهش سرعت و تشکیل صف از روی نقشه و جدول همزمان خوانده شود.</p>
<p>هدف گزارش، ارزیابی کمی و کیفی عملکرد سیستم تخلیه است: زمان لازم خروج ایمن (RSET)، تراکم جمعیتی، زمان ازدحام (Congestion بر حسب ثانیه)، سطح خدمت مسیرها، سرعت حرکت، میزان استفاده تجمعی از فضاها، جریان درها و در صورت وجود عملکرد نقاط پناه. این شاخص‌ها وقتی معتبرند که با یکدیگر هم‌خوان باشند. تراکم بالا بدون افت سرعت ممکن است گذرا باشد؛ افت سرعت بدون عبور قابل‌توجه ممکن است در مسیر کم‌استفاده رخ دهد. تنها ناحیه‌ای که چند شاخص همزمان آن را نامطلوب نشان دهند، اولویت مداخله معماری یا بهره‌برداری است.</p>
<p>نتایج باید مبنای قضاوت مهندس ایمنی در برابر ضوابط مرتبط و معیار پذیرش پروژه قرار گیرد و به‌تنهایی حکم قبول یا رد ساختمان نیست. Pathfinder ظرفیت اسمی آیین‌نامه را جایگزین نمی‌کند؛ بلکه رفتار جمعیت را روی هندسه مفروض نشان می‌دهد. کیفیت داده ورودی این تحلیل حدود ${toFaNum(state.dataQuality?.completeness||0)} درصد برآورد شده است. ${(state.dataQuality?.notes||[]).map(n=>escapeHtml(n)).join(' ')} هر چه کامل‌بودن داده کمتر باشد، قطعیت پیشنهادهای هندسی باید محافظه‌کارانه‌تر بیان شود.</p>
<p>ساختار گزارش از کلیات سناریو به شاخص‌های حرکتی و سپس به گلوگاه و پیشنهاد می‌رسد. این ترتیب تعمدی است تا پیش از توصیه عریض‌سازی یا تغییر تریگر، تصویر واحدی از زمان، مسافت، تراکم و جریان شکل بگیرد.</p>

<div class="pb"></div>
<h2 data-ch="3">۳- راهبرد تخلیه و منطق شبیه‌سازی</h2>
<p>از روی اسامی Behavior دو خانواده اصلی قابل تشخیص است. گروه EVAC مسیر خروج یا پناه را زود آغاز می‌کند و معمولاً نزدیک‌ترین ترازها یا طبقات انتخابی را نمایندگی می‌کند. گروه WAIT تا فرمان مرحله‌ای صبر می‌کند. این همان تخلیه پلکانی است که برای جلوگیری از هجوم همزمان همه طبقات به راه‌پله طراحی می‌شود. بدون این تفکیک، تفسیر RSET به اشتباه تمام تأخیر را به عرض پله نسبت می‌دهد.</p>
<p>${tWait!=null?('بیشترین زمان انتظار تخمینی حدود '+toFaNum(tWait)+' ثانیه است. '):''}${tWaitAvg!=null?('میانگین انتظار حدود '+toFaNum(tWaitAvg)+' ثانیه برآورد شده است. '):''}اگر انتظار بخش بزرگی از RSET را بسازد، کاهش زمان کل فقط با عریض کردن پله به‌دست نمی‌آید و باید فاصله تریگرها بازبینی شود. برعکس، اگر نرخ عبور درها نزدیک ظرفیت اسمی باشد، جلو انداختن تریگر ممکن است تراکم پاگرد را بدتر کند. تصمیم درست از مقایسه «ظرفیت باقی‌مانده پله» با «نرخ ورود گروه بعدی» حاصل می‌شود نه از نگاه جدا به هر شاخص.</p>
<p>سه مؤلفه باید جدا گزارش شود: زمان انتظار سناریو، زمان حرکت خالص، و تأخیر صف در گلوگاه هندسی. اختلاط این سه نتیجه‌گیری را گمراه‌کننده می‌کند. برای مثال گروهی با مسافت متوسط و زمان بسیار بالا احتمالاً بیشتر منتظر تریگر یا گرفتار صف بوده تا در مسیر طولانی. در مقابل گروهی با مسافت زیاد و سرعت نزدیک حرکت آزاد، مسئله‌اش هندسه دسترسی است نه زمان‌بندی.</p>
<p>حالت Steering اجازه می‌دهد صف به‌صورت طبیعی پشت درگاه پاگرد شکل بگیرد. بنابراین اگر نقشه سرعت و تراکم هر دو همان نقطه را نشان دهند، گلوگاه فیزیکی است و تغییر تریگر به‌تنهایی آن را حل نمی‌کند. اگر نقشه خلوت باشد ولی زمان WAIT بالا باشد، گلوگاه منطقی/زمان‌بندی است و مداخله اصلی باید روی سناریو باشد.</p>

<div class="pb"></div>
<h2 data-ch="4">۴- نتایج کلی زمان تخلیه (RSET)</h2>
<p>در این گزارش RSET برابر زمان خروج آخرین نفر گرفته شده است: ${tEvac!=null?toFaNum(tEvac)+' ثانیه، معادل حدود '+rsetFa:'در فایل موجود نبود'}. میانگین تکمیل افراد ${tAvg!=null?toFaNum(tAvg)+' ثانیه':'نامشخص'} است. فاصله زیاد بین میانگین و بیشینه معمولاً یعنی دمِ توزیع زمان کل را تعیین می‌کند، نه اکثریت جمعیت. به بیان دیگر طرح ممکن است برای بیشتر افراد قابل‌قبول باشد اما آخرین گروه WAIT یا افراد گرفتار صف، معیار پذیرش را مشخص می‌کنند.</p>
<p>تفسیر مهندسی RSET باید به معیار پذیرش پروژه وصل شود. اگر کارفرما یا مرجع قانونی سقف زمانی مشخصی دارد، مقایسه RSET با آن سقف اولویت دارد. اگر سقف تعریف نشده، گزارش فقط تصویر عملکرد را می‌دهد و نباید از آن حکم قبولی استخراج شود. همچنین RSET تابع فرضیات سرعت، عرض مفید، در دسترس بودن همه پله‌ها و کامل بودن هندسه است؛ تغییر هر فرض می‌تواند عدد را جابه‌جا کند.</p>
${beh.length?`
${tableWrap('جدول '+tBeh+' — زمان تکمیل تخلیه به تفکیک Behavior', `<div class="tbl-box"><table class="rt data"><thead><tr><th>رفتار</th><th>تعداد</th><th>کمینه (s)</th><th>بیشینه (s)</th><th>میانگین (s)</th></tr></thead><tbody>${behRows}</tbody></table></div>`)}
<p>${pBehEvac}${pBehWait}پراکندگی داخل یک Behavior یعنی اختلاف کمینه و بیشینه، اثر صف پشت در پله و تفاوت فاصله تا هسته خروج را نشان می‌دهد. اگر این اختلاف در WAITها بزرگ باشد، حتی افراد یک طبقه تجربه زمانی یکسانی ندارند. در این حالت راهبری داخل طبقه، انتخاب درِ نزدیک‌تر و حذف موانع محلی می‌تواند پراکندگی را کم کند بدون آنکه کل پلان عوض شود.</p>
<p>الگوی مطلوب در تخلیه مرحله‌ای این است که منحنی تکمیل گروه‌ها با ترتیب تریگر هم‌خوان باشد و همپوشانی شدید میان دو گروه متوالی دیده نشود. همپوشانی زیاد یعنی گروه بعدی پیش از تخلیه کافی گروه قبلی وارد پله شده و صف دوباره ساخته شده است. فاصله بیش از حد میان گروه‌ها نیز یعنی ظرفیت پله هدر رفته و RSET مصنوعی بالا مانده است.</p>`:
'<p>جدول Behavior در فایل TXT در دسترس نبود.</p>'}

<div class="pb"></div>
<h2 data-ch="5">۵- تحلیل مسافت پیموده‌شده</h2>
<p>مسافت پیموده‌شده طول مسیر واقعی عامل است نه فاصله مستقیم روی پلان. ${dist!=null?('میانگین مسافت این مدل حدود '+toFaNum(dist)+' متر است. '):'میانگین مسافت در فایل استخراج نشد. '}${spd!=null?('متوسط سرعت برآوردی '+toFaNum(spd)+' متر بر ثانیه است. '):''}اگر گروهی مسافت متوسط داشته باشد اما زمانش خیلی زیاد باشد، سهم اصلی تأخیر انتظار یا ازدحام است نه طول مسیر. این تمایز برای انتخاب بین کوتاه کردن مسیر و عریض کردن گلوگاه حیاتی است.</p>
<p>روند منطقی آن است که با دور شدن تراز از خروج یا پناه، مسافت میانگین بالا برود. اگر طبقه‌ای نزدیک خروج مسافت غیرعادی زیاد داشته باشد، احتمال مسیر غیربهینه، دورزدن هسته پله یا انتخاب در اشتباه وجود دارد و باید Cost مسیر و درهای ترجیحی مدل بازبینی شود. مسافت زیاد به‌تنهایی بد نیست؛ وقتی نگران‌کننده است که با سرعت پایین یا صف طولانی همراه شود.</p>
<p>مقایسه مسافت و زمان همچنین نشان می‌دهد آیا افراد مسیر جایگزین را پیدا کرده‌اند یا همه به یک هسته چسبیده‌اند. اگر دو گروه با مبدأ مشابه مسافت خیلی متفاوت داشته باشند، توزیع دسترسی به هسته‌های موازی نامتوازن است و علائم راهبری یا اتصال کوتاه بین دو بال می‌تواند مؤثرتر از تخریب سازه باشد.</p>

<div class="pb"></div>
<h2 data-ch="6">۶- تحلیل تراکم جمعیتی (Density)</h2>
<p>نقشه‌های Density برحسب نفر بر مترمربع محل تشکیل ازدحام را نشان می‌دهند. بازه تقریبی ۰٫۵۵ تا ۱٫۵ نفر بر مترمربع معمولاً عبور روان است؛ بالای حدود ۲٫۵ نفر بر مترمربع با افت سرعت روی Fundamental Diagram همراه است. نقاط تکرارشونده در طبقات تیپ مانند ورودی پله، پاگرد و محل ادغام دو جریان، محدودیت معماری‌اند نه اتفاق یک طبقه. اگر همین الگو از ترازهای میانی تا فوقانی تکرار شود، اصلاح باید در تیپ طبقه انجام شود نه فقط در یک تراز خاص.</p>
<p>تراکم لحظه‌ای به‌تنهایی برای اعلام گلوگاه کافی نیست. باید دید ازدحام چقدر ماندگار است، آیا سرعت همان نقطه افت کرده، و آیا عبور از آن مقطع قابل‌توجه است. اوج کوتاه که جریان را متوقف نکند ممکن است قابل‌پذیرش باشد. آنچه نگران‌کننده است ماندگاری ازدحام در بازه تخلیه همان طبقه است؛ Usage و نمودار جریان در این ماندگاری را بهتر نشان می‌دهند.</p>
${densFig||'<p class="note">تصویر Density بارگذاری نشده؛ تحلیل بر داده عددی استوار است. با افزودن اسکرین‌شات طبقات، شکل و تفسیر در همین بخش می‌آید.</p>'}
<p>از نظر مهندسی، اوج کوتاه‌مدت تراکم اگر جریان را متوقف نکند ممکن است قابل‌پذیرش باشد. آنچه نگران‌کننده است ماندگاری ازدحام در همان نقطه در بخش بزرگی از زمان تخلیه طبقه است؛ این را Usage و نمودار جریان در بهتر نشان می‌دهند.</p>

<div class="pb"></div>
<h2 data-ch="7">۷- تحلیل سرعت حرکت (Speed)</h2>
<p>نقشه سرعت باید تقریباً آینه معکوس Density باشد. افت سرعت به زیر حدود ۰٫۴ متر بر ثانیه در ورودی پله نشانه صف است. سرعت آزاد راه رفتن معمولاً در حدود ۱٫۲ تا ۱٫۴ متر بر ثانیه است؛ بنابراین بازه قرمز نقشه فاصله معناداری با حرکت آزاد دارد. اگر سرعت در راهروهای محیطی مطلوب بماند، مشکل سراسری طبقه نیست و مداخله باید موضعی باشد. ${spd!=null?('متوسط سرعت کل مدل حدود '+toFaNum(spd)+' متر بر ثانیه است و اگر این عدد از ۰٫۶ پایین‌تر باشد، سهم صف و انتظار در کل مدل بالاست. '):''}</p>
<p>هم‌پوشانی نقاط کند با نقاط گرم Density استحکام تشخیص گلوگاه را بالا می‌برد. اگر سرعت پایین در جایی دیده شود که تراکم بالا نیست، علت می‌تواند شیب پله، تغییر جهت تند، یا رفتار انتظار تعریف‌شده باشد نه عرض ناکافی. این تفکیک از توصیه‌های نادرست عریض‌سازی جلوگیری می‌کند.</p>
${speFig||'<p class="note">تصویر Speed بارگذاری نشده است.</p>'}

<div class="pb"></div>
<h2 data-ch="8">۸- تحلیل سطح خدمات‌رسانی (Level of Service)</h2>
<p>شاخص LOS با مقیاس Fruin از سطح A تا F کیفیت حرکت را خلاصه می‌کند. سطح A جریان آزاد است و سطح F توقف یا قفل جریان. سطوح D تا F در مسیر تخلیه اضطراری نیازمند توجه‌اند، به‌ویژه اگر در ورودی پله یا راهروی خروج نهایی تکرار شوند. تشخیص گلوگاه وقتی معتبر است که LOS ضعیف با Density بالا، Speed پایین و عبور قابل‌توجه همزمان باشد.</p>
<p>LOS بد در فضایی که practically کسی از آن عبور نمی‌کند اولویت طراحی نیست. برعکس، LOS متوسط در تنها مسیر خروج نهایی ساختمان می‌تواند ریسک بالا داشته باشد چون جایگزین ندارد. بنابراین شدت رنگ نقشه باید با نقش عملکردی فضا وزن شود نه فقط با مساحت رنگ‌شده.</p>
${losFig||'<p class="note">تصویر LOS بارگذاری نشده است.</p>'}

<div class="pb"></div>
<h2 data-ch="9">۹- تحلیل میزان استفاده از فضاها (Usage)</h2>
<p>شاخص Usage بار تجمعی فضا در کل شبیه‌سازی است و برخلاف تراکم لحظه‌ای، مسیرهایی را نشان می‌دهد که مدت طولانی اشغال شده‌اند. هسته پله و راهروی میانی اگر در Usage هم برجسته باشند، یعنی بار پایدار تحمل کرده‌اند نه فقط یک موج کوتاه. این یافته پشتوانه عریض‌سازی دائمی یا افزودن مسیر موازی است.</p>
<p>عدم‌توازن Usage میان دو هسته موازی یعنی ظرفیت موجود کامل مصرف نشده است. در این حالت علائم راهبری، اتصال کوتاه بین دو بال یا بازتعریف درِ ترجیحی می‌تواند پیش از تخریب، بار را متعادل کند. Usage بالا در تراز پناهگاه نیز هشدار می‌دهد که همان تراز هم مقصد تجمع است و هم مسیر خروج نهایی؛ جدایی این دو جریان اثر مستقیمی بر کاهش ازدحام دارد.</p>
${usaFig||'<p class="note">تصویر Usage بارگذاری نشده است.</p>'}

<div class="pb"></div>
<h2 data-ch="10">۱۰- تحلیل زمان ازدحام (Congestion)</h2>
<p>نقشه Congestion در Pathfinder زمان ازدحام را بر حسب ثانیه نشان می‌دهد، نه تراکم نفر بر مترمربع. نوار رنگ معمولاً از آبی (صفر ثانیه) تا قرمز بالای مقیاس (اغلب ۱۰ ثانیه، ولی باید همان عدد چاپ‌شده روی تصویر خوانده شود) درجه بندی شده است. زمینه آبی یعنی در آن فریم تقریباً کسی معطل نشده است. لکه زرد تا قرمز یا سفید روی در، دهانه پله یا محل ادغام دو راهرو یعنی همان نقطه بیشترین ماندگاری کندی را داشته است.</p>
<p>این شاخص مکمل Density است. تراکم لحظه‌ای ممکن است بالا باشد و زود خالی شود؛ Congestion می‌گوید آن کندی چند ثانیه طول کشیده. اگر در یک فریم تقریباً همه طبقه آبی باشد و فقط یک در قرمز باشد، گلوگاه موضعی است نه قفل سراسری طبقه. تکرار همان لکه در فریم‌های پیاپی یعنی گلوگاه پایدار است و اولویت اصلاح عرض یا حذف ادغام جریان همانجاست. ${tWait!=null?('بیشترین زمان انتظار عددی مدل حدود '+toFaNum(tWait)+' ثانیه است و باید با لکه‌های گرم همین نقشه‌ها هم‌خوان دیده شود. '):''}نام فایل‌هایی مثل Cong_123.000_3-F(0) یعنی حدود ثانیه ۱۲۳ و تراز F(0).</p>
${congFig||'<p class="note">تصویر Congestion بارگذاری نشده است. از Pathfinder نمای Congestion را با نوار رنگ و برچسب Floor ذخیره کنید. اگر نام فایل با Cong شروع شود، خانه درست خودش پر می‌شود.</p>'}
${congMore}

<div class="pb"></div>
<h2 data-ch="11">۱۱- تحلیل جریان عبوری از درها و شناسایی گلوگاه‌ها</h2>
<p>جریان عبوری از درها امکان شناسایی کمّی گلوگاه را فراهم می‌کند. ظرفیت اسمی یک لنگه در اضطراری معمولاً در حدود ۱٫۰ تا ۱٫۳ نفر بر ثانیه بر متر عرض مؤثر بحث می‌شود. نرخ میانگین خیلی پایین‌تر از این عدد یعنی در کم‌استفاده مانده یا جریان بالادست بند آمده است. نرخ نزدیک ظرفیت به‌همراه صف پشت در یعنی گلوگاه واقعی همان مقطع است.</p>
<p>درِ بدون عبور در کل شبیه‌سازی نیازمند بررسی هندسی و رفتاری است: یا از مدل دیده نمی‌شود، یا قفل است، یا مسیر منتهی به آن برای عوامل جذاب نیست. چنین ظرفیتی اگر در واقعیت قابل‌استفاده باشد، فرصت تعادل بار است. آخرین خروج ثبت‌شده روی درهای پرتردد اگر نزدیک RSET کل باشد، مسیر بحرانی از همان خانواده عبور می‌کند.</p>
${exits.length?`
${tableWrap('جدول '+tExit+' — پرتکرارترین درها و مسیرها', `<div class="tbl-box"><table class="rt data"><thead><tr><th>در / مسیر</th><th>کل عبور</th><th>جریان میانگین</th><th>اولین ورود</th><th>آخرین خروج</th></tr></thead><tbody>${exitRows}</tbody></table></div>`)}
<p>آخرین خروج ثبت‌شده روی درهای پرتردد اگر نزدیک RSET کل باشد، مسیر بحرانی از همان خانواده درها عبور می‌کند و هر بهبود عرض یا تعادل بار، مستقیماً زمان کل را جابه‌جا می‌کند.</p>`:''}
${flowFigs||'<p class="note">نمودار Flow Rate بارگذاری نشده است.</p>'}

<div class="pb"></div>
<h2 data-ch="12">۱۲- تحلیل نقاط تجمع امن (Refuge Room)</h2>
<p>فضای پناه وقتی درست کار می‌کند که ورود گروه‌ها کنترل‌شده، ظرفیت با جمعیت طبقه متناسب، و مسیر خروج نهایی از پناه جدا یا دست‌کم عریض باشد. ${pRef}اگر ورود همه طبقات از یک راهروی افقی بگذرد، تراز پناه گره ترافیکی اصلی ساختمان است و هر اختلال در همان راهرو کل تخلیه را متوقف می‌کند.</p>
<p>الگوی پلکانی پر شدن پناهگاه‌ها باید با ترتیب تریگر طبقات هم‌خوان باشد. پر شدن خیلی سریع یک فضا و خالی ماندن فضای مجاور یعنی تخصیص جمعیت به پناهگاه‌ها نامتوازن است. در این حالت بازتوزیع ظرفیت یا هدایت بخشی از جمعیت به مسیر دوم، مؤثرتر از افزایش صرف مساحت یک اتاق است. همچنین جریان ورود به پناه باید از جریان خروج نهایی جدا شود تا تداخل دو موج در یک مقطع ایجاد نشود.</p>
${refuge.length?`
${tableWrap('جدول '+tRef+' — فضاهای Refuge', `<div class="tbl-box"><table class="rt data"><thead><tr><th>نام</th><th>تراز</th><th>افراد</th><th>اولین ورود</th><th>آخرین خروج</th></tr></thead><tbody>${refRows}</tbody></table></div>`)}`:''}
${refFigs||'<p class="note">تصویر Refuge بارگذاری نشده است.</p>'}

<div class="pb"></div>
<h2 data-ch="13">۱۳- جمع‌بندی و نتیجه‌گیری</h2>
<p>تخلیه ${occ!=null?toFaNum(occ)+' نفر ':''}در حالت Steering بررسی شد. RSET ${tEvac!=null?toFaNum(tEvac)+' ثانیه ('+rsetFa+')':'نامشخص'} و میانگین تکمیل ${tAvg!=null?toFaNum(tAvg)+' ثانیه':'نامشخص'} است. ارزیابی کلی سامانه: ${state.assessment?escapeHtml(state.assessment.label+' — '+state.assessment.description):'نیاز به تکمیل داده و بررسی مهندسی'}.</p>
<p>راهبرد مرحله‌ای احتمالاً از هجوم همزمان کل جمعیت به پله جلوگیری کرده است، اما تکرار الگوی ازدحام در ورودی پله طبقات تیپ و تراز پناه نشان می‌دهد ظرفیت هندسی موضعی هنوز محدودکننده است. ${cong.length?'نقشه‌های Congestion همین ماندگاری را به ثانیه نشان می‌دهند: لکه قرمز روی زمینه آبی گلوگاه موضعی است، نه تراکم سراسری طبقه. ':''}عدم توازن بین مسیرهای موازی نیز ظرفیت موجود را کامل مصرف نمی‌کند. جمع‌بندی عملی این است که بخشی از زمان در منطق سناریو و بخشی در هندسه گلوگاه مصرف می‌شود و نسخه اصلاحی باید هر دو را با هم ببیند.</p>
<p>پیشنهاد می‌شود معیار پذیرش زمانی پروژه صریحاً ثبت شود، یک سناریوی ازدست‌رفتن راه‌پله اجرا گردد، و نتایج این گزارش با نقشه‌های معماری و عرض مفید واقعی درها مقابله شود. تا آن زمان اعداد شبیه‌سازی ابزار تصمیم‌اند نه حکم نهایی ایمنی.</p>
${tableWrap('جدول '+tCrit+' — نقاط بحرانی شناسایی‌شده', `<div class="tbl-box"><table class="rt data"><thead><tr><th>ردیف</th><th>موقعیت</th><th>محدودیت</th><th>شدت</th></tr></thead><tbody>${bnRows||'<tr><td colspan="4">گلوگاه عددی ثبت نشده است؛ جمع‌بندی بر اساس شاخص‌های کلی است.</td></tr>'}</tbody></table></div>`)}

<div class="pb"></div>
<h2 data-ch="14">۱۴- پیشنهادات فنی</h2>
<p>پیشنهادها ترکیبی از اصلاح هندسی، بهره‌برداری، زمان‌بندی سناریو و ایده‌های تکمیلی است. اولویت با مداخله‌هایی است که روی مسیر بحرانی و تراز پناه اثر مستقیم دارند.</p>
${recs.map((r,i)=>`<div class="rec-block"><div class="rec-title">${toFaNum(i+1)}. ${escapeHtml(r.t)}</div><p>${escapeHtml(r.d)}</p></div>`).join('')}
<div class="rec-block"><div class="rec-title">${toFaNum(recs.length+1)}. معیار پذیرش نهایی</div><p>در مرحله نهایی، RSET باید با معیار پذیرش کارفرما و مرجع قانونی مقایسه شود. خروجی نرم‌افزار جایگزین قضاوت مهندس مسئول نیست.</p></div>

<div class="pb"></div>
<h2 data-ch="15">۱۵- پیوست تصاویر</h2>
<p>تمام تصاویر بارگذاری‌شده با شماره مستقل پیوست شده‌اند. تفسیر کوتاه زیر هر شکل آمده است.</p>
${appendixImgs.length?appendixImgs.map(x=>figBlock(x.im,x.label,x.kind)).join(''):'<p class="note">تصویری برای پیوست بارگذاری نشده است.</p>'}

async function exportAnalytical(kind){
  const safe=String(state.projectName).replace(/[^\w\u0600-\u06FF\-]+/g,'_')||'report';
  if(kind==='word'){
    exportAnalyticalWord(safe);
    return;
  }
  await exportAnalyticalPdfFile(safe);
}

async function exportAnalyticalPdfFile(safe){
  showLoading('آماده‌سازی خروجی PDF...',8);
  let host=null;
  try{
    await ensurePdfLibs();
    showLoading('چینش صفحات گزارش تحلیلی...',25);
    const html=buildAnalyticalHtml('pdf');
    const doc=new DOMParser().parseFromString(html,'text/html');
    host=document.createElement('div');
    host.id='ei-ar-pdf-host';
    host.style.cssText='position:fixed;left:0;top:0;width:794px;background:#fff;z-index:2147483646;overflow:visible;';
    const wrap=document.createElement('div');
    wrap.id='ar-root';
    wrap.style.cssText='width:794px;background:#fff;padding:0 96px 24px;box-sizing:border-box;';
    const bodyKids=[...doc.body.childNodes];
    bodyKids.forEach(n=>wrap.appendChild(n));
    host.appendChild(wrap);
    document.body.appendChild(host);

    try{ if(document.fonts&&document.fonts.ready) await document.fonts.ready; }catch(e){}
    await new Promise(r=>setTimeout(r,400));

    const theme=state.analytical.theme||'#1e3a8a';
    const ink=(typeof themeInk==='function')?themeInk(theme):'#fff';
    const title=state.projectName||'گزارش تحلیلی';

    const blocks=[...wrap.children].filter(el=>el.nodeType===1 && !el.classList.contains('running-hdr') && !el.classList.contains('print-hdr'));
    const JsPDF=(window.jspdf&&window.jspdf.jsPDF)||window.jsPDF;
    if(!JsPDF) throw new Error('jsPDF در دسترس نیست');
    const pdf=new JsPDF({unit:'mm',format:'a4',orientation:'portrait',compress:true});
    const pageW=210, pageH=297;
    const cssW=794, pageCssH=1123;
    const scale=1.6;

    const makeHeader=()=>{
      const h=document.createElement('div');
      h.style.cssText=`width:${cssW}px;height:48px;background:${theme};color:${ink};text-align:center;font-weight:700;font-family:Vazirmatn,Tahoma,Arial;font-size:15px;line-height:48px;box-sizing:border-box;`;
      h.textContent=title;
      return h;
    };
    const makeFooter=(i,total)=>{
      const f=document.createElement('div');
      f.style.cssText=`position:absolute;left:0;right:0;bottom:0;height:36px;width:${cssW}px;text-align:center;color:#64748b;font-family:Vazirmatn,Tahoma,Arial;font-size:12px;line-height:36px;border-top:1px solid #e2e8f0;background:#fff;`;
      f.textContent='صفحه '+toFaNum(i)+' از '+toFaNum(total);
      return f;
    };

    const measure=el=>{
      const r=el.getBoundingClientRect();
      return Math.max(r.height||0, el.offsetHeight||0, el.scrollHeight||0);
    };
    const maxCssH=860;
    const pageBoxes=[];
    let cur=[], curH=0;
    const flush=()=>{ if(cur.length){ pageBoxes.push(cur); cur=[]; curH=0; } };
    const expandBlocks=[];
    blocks.forEach(el=>{
      if(el.tagName==='UL' || el.tagName==='OL'){
        [...el.children].forEach(li=>expandBlocks.push(li));
      } else expandBlocks.push(el);
    });
    expandBlocks.forEach(el=>{
      if(el.classList && el.classList.contains('pb')){
        flush();
        return;
      }
      const h=Math.min(measure(el)||36, maxCssH);
      if(el.tagName==='H2' && cur.length) flush();
      if(cur.length && curH+h>maxCssH) flush();
      cur.push(el); curH+=h+10;
    });
    flush();

    const total=Math.max(pageBoxes.length,1);
    const chPage={};
    pageBoxes.forEach((box,idx)=>{
      box.forEach(el=>{
        if(el.tagName==='H2' && el.getAttribute && el.getAttribute('data-ch'))
          chPage[el.getAttribute('data-ch')]=idx+1;
      });
    });
    const fillToc=root=>{
      root.querySelectorAll('table.toc tr[data-ch]').forEach(row=>{
        const ch=row.getAttribute('data-ch');
        const slot=row.querySelector('td.pg');
        if(slot) slot.textContent=chPage[ch]?toFaNum(chPage[ch]):'—';
      });
    };
    showLoading('ساخت فایل PDF...',40);
    const stage=document.createElement('div');
    stage.style.cssText='position:fixed;left:0;top:0;width:794px;background:#fff;z-index:2147483647;';
    document.body.appendChild(stage);

    for(let i=0;i<pageBoxes.length;i++){
      stage.innerHTML='';
      const page=document.createElement('div');
      page.style.cssText=`position:relative;width:${cssW}px;height:${pageCssH}px;background:#fff;box-sizing:border-box;overflow:hidden;`;
      page.appendChild(makeHeader());
      const inner=document.createElement('div');
      inner.style.cssText=(i===0?'padding:48px 96px 56px;':'padding:28px 96px 56px;')+'box-sizing:border-box;text-align:justify;line-height:1.5;font-size:13pt;font-family:Vazirmatn,Tahoma,Arial';
      pageBoxes[i].forEach(el=>inner.appendChild(el.cloneNode(true)));
      fillToc(inner);
      page.appendChild(inner);
      page.appendChild(makeFooter(i+1,total));
      stage.appendChild(page);
      await new Promise(r=>setTimeout(r,40));
      const canvas=await window.html2canvas(page,{
        scale, backgroundColor:'#ffffff', useCORS:true, allowTaint:true, logging:false, width:cssW, height:pageCssH, windowWidth:cssW, windowHeight:pageCssH
      });
      const data=canvas.toDataURL('image/jpeg',0.93);
      if(i>0) pdf.addPage();
      pdf.addImage(data,'JPEG',0,0,pageW,pageH);
      showLoading('ساخت فایل PDF...', 40+Math.round((i+1)/total*50));
    }

    pdf.save('analytical_'+safe+'.pdf');
    stage.remove();
    host.remove();
    hideLoading();
    toast('فایل PDF ذخیره شد.','success');
  }catch(err){
    console.error(err);
    if(host) try{host.remove();}catch(e){}
    hideLoading();
    toast('ساخت خودکار PDF ممکن نشد؛ پنجره چاپ باز می‌شود.','warning');
    const html=buildAnalyticalHtml('pdf');
    const w=window.open('','_blank');
    if(!w) return;
    w.document.write(html);
    w.document.close();
    setTimeout(()=>{try{w.focus();w.print();}catch(e){}},600);
  }
}



const SCENARIO_DEFS=[
  {key:'base', title:'۱. اجرای پایه', hint:'همه مسیرها باز — همان سناریوی فعلی مدل', how:'مدل را بدون بستن پله یا در اجرا کنید و فایل Queues_summary.txt را ذخیره کنید. این اجرا مبنای مقایسه است.'},
  {key:'blocked', title:'۲. پله / مسیر بحرانی بسته', hint:'یک هسته پرتردد از دسترس خارج شود', how:'در Pathfinder بحرانی‌ترین راه‌پله یا خروج را ببندید (Stair unavailability) و دوباره اجرا کنید. این اجرا تاب‌آوری ساختمان را می‌سنجد.'},
  {key:'simultaneous', title:'۳. تخلیه همزمان', hint:'تریگر مرحله‌ای حذف شود؛ همه با هم حرکت کنند', how:'Behaviorهای WAIT را به حرکت فوری تبدیل کنید یا فاصله تریگر طبقات را صفر کنید تا همه همزمان خارج شوند.'}
];

function snapshotFromParsed(name, parsed){
  const numerical=runNumerical(parsed.extracted||{}, parsed.tables||{});
  return {name, parsed, numerical, at:Date.now()};
}

async function loadScenarioSlot(key, file){
  const text=await file.text();
  const parsed=parseTxt(text);
  if(!parsed.success){ toast('از این فایل شاخص قابل استخراج نشد.','warning'); }
  state.scenarios[key]=snapshotFromParsed(file.name, parsed);
  state.scenarios.result=null;
  toast(SCENARIO_DEFS.find(d=>d.key===key).title+' بارگذاری شد.','success');
  renderScenarios(document.getElementById('view'));
  if(window.lucide) lucide.createIcons();
}

function assignExistingToSlot(key, fileId){
  const f=(state.files||[]).find(x=>x.id===fileId);
  if(!f) return;
  const parsed=f.parsed||parseTxt(f.text||'');
  state.scenarios[key]=snapshotFromParsed(f.name, parsed);
  state.scenarios.result=null;
  toast('فایل «'+f.name+'» به این اجرا نسبت داده شد.','success');
  renderScenarios(document.getElementById('view'));
  if(window.lucide) lucide.createIcons();
}

function scLabel(k){ return {base:'پایه', blocked:'مسیر بسته', simultaneous:'همزمان'}[k]||k; }
function hazLabel(h){ return {fire:'آتش‌سوزی', earthquake:'زلزله', explosion:'انفجار', general:'بدون فرض حادثه'}[h]||h; }
function slotKpis(slot){ return slot && slot.numerical && slot.numerical.kpis ? slot.numerical.kpis : null; }
function numOrNull(v){ return (v==null||v===''||isNaN(v))?null:Number(v); }
function deltaOf(a,b){
  a=numOrNull(a); b=numOrNull(b);
  if(a==null||b==null) return null;
  return +(b-a).toFixed(2);
}
function deltaHtml(d, unit, invert){
  if(d==null) return '—';
  const good = invert ? d>0 : d<0;
  const cls = d===0?'':(good?'delta-down':'delta-up');
  const sign = d>0?'+':'';
  return `<span class="${cls}">${sign}${toFaNum(d)}${unit?(' '+unit):''}</span>`;
}
function relScore(vals, v, better){
  const nums=vals.filter(x=>x!=null && !isNaN(x));
  if(v==null || !nums.length) return null;
  const mn=Math.min(...nums), mx=Math.max(...nums);
  if(mx===mn) return 75;
  const t=(v-mn)/(mx-mn);
  const s=better==='high'?t:1-t;
  return Math.round(s*100);
}

function profileOf(key){
  const slot=state.scenarios[key];
  if(!slot || !slot.numerical) return null;
  const num=slot.numerical;
  const k=num.kpis||{};
  return {
    key, fileName:slot.name||'—',
    k,
    topExits:(num.exitUtilization||[]).slice(0,6),
    lateBeh:(num.behaviorEvacuation||[]).slice(0,6),
    refuge:(num.refugeRooms||[]).slice(0,6),
    floors:(num.floorEvacuation||[]).slice(0,10)
  };
}

function compareScenarios(){
  const s=state.scenarios;
  const keys=['base','blocked','simultaneous'];
  const loaded=keys.filter(k=>slotKpis(s[k]));
  if(loaded.length<2){
    s.result={ready:false, note:'حداقل دو اجرا لازم است. چک‌لیست را کامل کنید و دوباره مقایسه کنید.'};
    return s.result;
  }
  const m={}; loaded.forEach(k=>m[k]=slotKpis(s[k]));
  const profiles={}; loaded.forEach(k=>profiles[k]=profileOf(k));

  const metricDefs=[
    {id:'rset', label:'RSET — خروج آخرین نفر', unit:'s', get:k=>k.evacuationTime, better:'low', weight:0.4, meaning:'زمانی که آخرین نفر به نقطه امن رسیده است. شاخص اصلی تصمیم‌گیری.'},
    {id:'avg', label:'متوسط زمان خروج', unit:'s', get:k=>k.averageEvacuationTime, better:'low', weight:0.15, meaning:'اگر خیلی کمتر از RSET باشد، تعداد کمی دیرهنگام هستند؛ اگر نزدیک RSET باشد ازدحام فراگیر است.'},
    {id:'first', label:'خروج اولین نفر', unit:'s', get:k=>k.firstOccupantExit, better:'low', weight:0.05, meaning:'شروع جریان خروج. عدد خیلی بزرگ یعنی تأخیر پیش‌حرکت یا مسیر طولانی.'},
    {id:'wait', label:'بیشترین انتظار', unit:'s', get:k=>k.maxWaitingTime, better:'low', weight:0.2, meaning:'صف پشت در یا پاگرد. افزایش ناگهانی یعنی گلوگاه هندسی.'},
    {id:'speed', label:'متوسط سرعت', unit:'m/s', get:k=>k.averageSpeed, better:'high', weight:0.12, meaning:'کاهش سرعت نسبت به پایه نشانه ازدحام یا مسیر طولانی‌تر است.'},
    {id:'dist', label:'متوسط مسافت', unit:'m', get:k=>k.averageDistance, better:'low', weight:0.08, meaning:'افزایش مسافت یعنی انحراف اجباری به مسیر جایگزین.'},
    {id:'occ', label:'جمعیت', unit:'نفر', get:k=>k.totalOccupants, better:'eq', weight:0, meaning:'باید بین اجراها تقریباً یکسان باشد؛ اختلاف یعنی مدل‌ها قابل مقایسه نیستند.'}
  ];
  const rows=metricDefs.map(r=>{
    const vals={};
    loaded.forEach(k=>vals[k]=r.get(m[k]));
    const nums=loaded.map(k=>vals[k]).filter(v=>v!=null && !isNaN(v));
    let best=null;
    if(nums.length && r.better==='low') best=Math.min(...nums);
    if(nums.length && r.better==='high') best=Math.max(...nums);
    return {...r, vals, best};
  });

  const scores={};
  loaded.forEach(k=>{
    let acc=0, wsum=0;
    rows.forEach(r=>{
      if(!r.weight) return;
      const sc=relScore(Object.values(r.vals), r.vals[k], r.better);
      if(sc==null) return;
      acc+=sc*r.weight; wsum+=r.weight;
    });
    scores[k]=wsum?Math.round(acc/wsum):null;
  });
  const ranked=loaded.map(k=>({k, score:scores[k]})).sort((a,b)=>(b.score??-1)-(a.score??-1));

  const rsets=loaded.map(k=>({k, v:m[k].evacuationTime})).filter(x=>x.v!=null).sort((a,b)=>a.v-b.v);
  const fastest=rsets[0]||null;

  let resilience=null;
  if(m.base && m.blocked && m.base.evacuationTime!=null && m.blocked.evacuationTime!=null){
    const ratio=m.blocked.evacuationTime/Math.max(m.base.evacuationTime,1);
    resilience={
      ratio:+ratio.toFixed(2),
      extra:+(m.blocked.evacuationTime-m.base.evacuationTime).toFixed(1),
      level: ratio<1.15?'good':ratio<1.4?'medium':'poor',
      waitDelta: deltaOf(m.base.maxWaitingTime, m.blocked.maxWaitingTime),
      distDelta: deltaOf(m.base.averageDistance, m.blocked.averageDistance),
      speedDelta: deltaOf(m.base.averageSpeed, m.blocked.averageSpeed)
    };
  }
  let staging=null;
  if(m.base && m.simultaneous && m.base.evacuationTime!=null && m.simultaneous.evacuationTime!=null){
    const d=m.simultaneous.evacuationTime-m.base.evacuationTime;
    staging={
      extra:+d.toFixed(1),
      helps:d>20,
      waitDelta: deltaOf(m.base.maxWaitingTime, m.simultaneous.maxWaitingTime),
      speedDelta: deltaOf(m.base.averageSpeed, m.simultaneous.averageSpeed)
    };
  }

  const occs=loaded.map(k=>m[k].totalOccupants).filter(v=>v!=null);
  const occWarn = occs.length>=2 && (Math.max(...occs)-Math.min(...occs))/Math.max(...occs,1) > 0.05;

  const hazard=s.hazard||'general';
  let pick='base', pickTitle='اجرای پایه (تخلیه مرحله‌ای / مسیرهای باز)', why=[], actions=[], arch=[], ops=[];

  if(staging && staging.helps){
    pick='base';
    pickTitle='تخلیه مرحله‌ای (اجرای پایه)';
    why.push('تخلیه همزمان حدود '+toFaNum(staging.extra)+' ثانیه به RSET اضافه می‌کند؛ تریگر طبقاتی در این هندسه مفید است و نباید حذف شود.');
  } else if(staging && !staging.helps){
    pick='simultaneous';
    pickTitle='تخلیه همزمان از نظر زمان قابل قبول است';
    why.push('تفاوت RSET همزمان با پایه حدود '+toFaNum(staging.extra)+' ثانیه است؛ مرحله‌ای‌کردن به‌تنهایی گلوگاه هندسی را حل نمی‌کند.');
  } else if(fastest){
    pick=fastest.k;
    pickTitle=SCENARIO_DEFS.find(d=>d.key===fastest.k).title;
    why.push('کمترین RSET در اجرای «'+scLabel(fastest.k)+'» ثبت شده ('+toFaNum(fastest.v)+' ثانیه).');
  }

  if(resilience){
    if(resilience.level==='poor'){
      why.push('با بستن مسیر بحرانی، RSET حدود '+toFaNum(resilience.extra)+' ثانیه ('+toFaNum(resilience.ratio)+' برابر) بالا می‌رود. ساختمان به یک هسته وابسته است و این برای کارفرما قابل دفاع نیست.');
      arch.push('یک مسیر خروج مستقل دوم با دسترسی به جبهه مقابل ساختمان تعریف کنید؛ تک‌هسته‌ای بودن مهم‌ترین ریسک این مدل است.');
      arch.push('عرض پاگرد و درِ طبقه هسته جایگزین را حداقل هم‌تراز هسته فعلی کنید تا پس از انسداد، جریان جابه‌جا شود نه متوقف.');
      actions.push('قبل از اتکا به اجرای پایه، معیار پذیرش RSET در حالت مسیر بسته را با کارفرما مکتوب کنید.');
    } else if(resilience.level==='medium'){
      why.push('انسداد مسیر بحرانی RSET را '+toFaNum(resilience.extra)+' ثانیه افزایش می‌دهد. تاب‌آوری متوسط است و با تعادل بار بهتر می‌شود.');
      arch.push('بار هسته‌های موازی را با علائم، درهای راهنما و حذف مسیرهای بن‌بست متعادل کنید.');
    } else {
      why.push('انسداد مسیر بحرانی اثر کمی روی RSET دارد؛ شبکه خروج نسبتاً تاب‌آور است و می‌توان روی بهره‌برداری تمرکز کرد.');
    }
    if(resilience.distDelta!=null && resilience.distDelta>8){
      why.push('در حالت مسیر بسته، متوسط مسافت حدود '+toFaNum(resilience.distDelta)+' متر زیاد می‌شود؛ افراد مجبور به دور زدن هستند.');
      arch.push('اتصال افقی بین دو هسته در ترازهای میانی اضافه کنید تا دورزدن به طبقه همکف موکول نشود.');
    }
    if(resilience.waitDelta!=null && resilience.waitDelta>10){
      why.push('انتظار در مسیر بسته '+toFaNum(resilience.waitDelta)+' ثانیه بیشتر است؛ صف به هسته باقی‌مانده منتقل شده است.');
    }
  }

  if(hazard==='fire'){
    why.push('برای آتش‌سوزی، تخلیه مرحله‌ای معمولاً بر خروج همزمان ارجح است چون از هجوم به پله درگیر دود می‌کاهد و زمان برای اعلام طبقه به طبقه می‌خرد.');
    if(pick==='simultaneous'){
      pick='base'; pickTitle='تخلیه مرحله‌ای برای آتش (حتی اگر همزمان کمی سریع‌تر باشد)';
      why.push('RSET کمتر در همزمان به‌تنهایی دلیل حذف مرحله‌ای نیست؛ اولویت آتش محافظت از مسیر پله و کنترل دود است.');
    }
    ops.push('تریگر تخلیه را طبقه‌به‌طبقه از مبدأ حریق به سمت بالا/پایین نگه دارید و پله درگیر را در رویه‌ عملیاتی از مدار خارج کنید.');
    ops.push('ظرفیت Refuge را با زمان رسیدن اولین فرد در اجرای پایه کنترل کنید؛ اگر ورود دیر است، آژیر آن تراز را زودتر بزنید.');
    actions.push('مسیر بسته در اجرای دوم را معادل پله درگیر دود فرض کنید و خروج از جبهه مقابل را در مدل فعال نگه دارید.');
    arch.push('درِ ضدحریق و لابی دودبند جلوی هسته پله، نرخ ورود به پاگرد را کنترل می‌کند و در عمل به کاهش انتظار کمک می‌کند.');
  } else if(hazard==='earthquake'){
    why.push('در زلزله افراد معمولاً فرمان انتظار طبقاتی را رعایت نمی‌کنند؛ اجرای همزمان به رفتار واقعی نزدیک‌تر است و باید مبنای طراحی ظرفیت باشد.');
    if(m.simultaneous){ pick='simultaneous'; pickTitle='تخلیه همزمان به‌عنوان سناریوی واقع‌گرایانه زلزله'; }
    ops.push('رویه‌ پس از زلزله را «خروج فوری از ساختمان» بنویسید، نه تخلیه مرحله‌ای اداری.');
    actions.push('اگر RSET همزمان جهش کرد، مسئله هندسه است نه مدیریت تریگر؛ عرض پله و در خروجی را اصلاح و دوباره اجرا کنید.');
    arch.push('پس‌لرزه ممکن است یک پله را از مدار خارج کند؛ اجرای مسیر بسته را معادل آسیب موضعی بخوانید.');
  } else if(hazard==='explosion'){
    why.push('در انفجار، اجرای مسیر بسته سناریوی طراحی است نه حالت فرعی. ظرفیت باید برای ازدست‌رفتن یک جبهه کافی باشد.');
    if(m.blocked){ pick='blocked'; pickTitle='طراحی بر اساس ازدست‌رفتن یک جبهه / پله'; }
    ops.push('خروج را از سمت مقابل ناحیه آسیب هدایت کنید و به یک حیاط یا درِ واحد وابسته نمانید.');
    arch.push('حداقل دو خروج نهایی در دو جبهه مستقل الزامی است؛ اگر هر دو به یک حیاط می‌رسند، از نظر عملی یک خروج محسوب می‌شوند.');
  }

  loaded.forEach(k=>{
    const p=profiles[k];
    if(!p) return;
    const top=p.topExits[0];
    if(top && top.share!=null && top.share>=40){
      why.push('در اجرای «'+scLabel(k)+'» حدود '+toFaNum(top.share)+'٪ عبور از «'+top.name+'» است؛ توزیع خروج نامتوازن است.');
      arch.push('عرض یا جذابیت مسیرهای کم‌استفاده را بالا ببرید (درِ نزدیک‌تر، روشنایی، حذف مانع) تا سهم در پرترافیک زیر ۴۰٪ بیاید.');
    }
  });

  if(m.base && m.base.criticalStair){
    actions.push('پله پرترافیک اجرای پایه («'+m.base.criticalStair+'») همان گزینه بستن در اجرای دوم است.');
  }
  if(m.base && m.base.criticalDoor){
    ops.push('در «'+m.base.criticalDoor+'» را در پلان بهره‌برداری به‌عنوان گلوگاه ثبت کنید: نگهبان، بازنگه‌داشتن لنگه دوم، و ممنوعیت مانع.');
  }
  if(occWarn){
    why.push('جمعیت بین اجراها بیش از ۵٪ فرق دارد؛ ابتدا Occupant count را یکسان کنید وگرنه مقایسه RSET گمراه‌کننده است.');
  }

  const interpretations=loaded.map(k=>{
    const p=profiles[k]; const kk=p.k;
    const parts=[];
    parts.push('اجرای «'+scLabel(k)+'» با فایل «'+p.fileName+'» جمعیت '+((kk.totalOccupants!=null)?toFaNum(kk.totalOccupants):'نامشخص')+' نفر و RSET '+((kk.evacuationTime!=null)?toFaNum(kk.evacuationTime)+' ثانیه':'نامشخص')+' دارد.');
    if(kk.averageEvacuationTime!=null && kk.evacuationTime!=null){
      const gap=+(kk.evacuationTime-kk.averageEvacuationTime).toFixed(1);
      if(gap>40) parts.push('فاصله میانگین تا آخرین نفر '+toFaNum(gap)+' ثانیه است؛ تعداد کمی دیرهنگام هستند و باید Behavior آن‌ها جدا بررسی شود.');
      else parts.push('فاصله میانگین تا آخرین نفر '+toFaNum(gap)+' ثانیه است و تأخیر کم‌وبیش فراگیر است نه محدود به یک گروه.');
    }
    if(p.lateBeh[0]) parts.push('دیرترین رفتار «'+p.lateBeh[0].name+'» با بیشینه '+toFaNum(p.lateBeh[0].maxExit)+' ثانیه است.');
    if(p.topExits[0]) parts.push('پرترافیک‌ترین در «'+p.topExits[0].name+'» با '+toFaNum(p.topExits[0].totalUse)+' عبور'+(p.topExits[0].share!=null?(' ('+toFaNum(p.topExits[0].share)+'٪)'):'')+' است.');
    if(p.refuge[0]) parts.push('زودترین ورود به پناه «'+(p.refuge[0].shortName||p.refuge[0].name)+'» در '+toFaNum(p.refuge[0].firstIn)+' ثانیه رخ داده است.');
    if(kk.criticalStair) parts.push('راه‌پله بحرانی: '+kk.criticalStair+'.');
    return {key:k, text:parts.join(' ')};
  });

  const exec=[];
  exec.push('پروژه «'+(state.projectName||'بدون نام')+'» برای حادثه «'+hazLabel(hazard)+'» با '+toFaNum(loaded.length)+' اجرای Pathfinder مقایسه شد.');
  exec.push('راهبرد پیشنهادی: '+pickTitle+'.');
  if(fastest) exec.push('کمینه RSET در اجرای «'+scLabel(fastest.k)+'» برابر '+toFaNum(fastest.v)+' ثانیه است.');
  if(resilience) exec.push('هزینه ازدست‌رفتن مسیر بحرانی '+toFaNum(resilience.extra)+' ثانیه است (نسبت '+toFaNum(resilience.ratio)+').');
  if(staging) exec.push('هزینه تخلیه همزمان نسبت به پایه '+toFaNum(staging.extra)+' ثانیه است.');
  exec.push('امتیاز نسبی (۰ تا ۱۰۰، فقط بین همین اجراها): '+ranked.map(x=>scLabel(x.k)+' '+toFaNum(x.score)).join('، ')+'.');

  ops.push('نتیجه را با سقف زمانی مورد قبول کارفرما (نه فقط کمینه RSET) بسنجید و اگر اجرای طراحی از سقف رد شد، هندسه را قبل از تغییر Behavior اصلاح کنید.');
  actions.push('پس از هر اصلاح عرض/در/پله، هر سه اجرا را دوباره ذخیره کنید؛ مقایسه فقط وقتی معتبر است که Occupant و هندسه پایه یکسان باشند.');

  const uniq=arr=>{ const o=[],seen=new Set(); arr.forEach(a=>{ if(a && !seen.has(a)){ seen.add(a); o.push(a);} }); return o; };

  s.result={
    ready:true, date:new Date().toISOString(),
    rows, loaded, profiles, scores, ranked, fastest:fastest&&fastest.k,
    resilience, staging, pick, pickTitle, why:uniq(why),
    actions:uniq(actions), arch:uniq(arch), ops:uniq(ops),
    interpretations, exec:exec.join(' '), hazard, occWarn
  };
  return s.result;
}

function scSafeName(){ return String(state.projectName||'scenario').replace(/[^\w\u0600-\u06FF\-]+/g,'_')||'scenario'; }

function renderScenarios(el){
  const s=state.scenarios;
  const r=s.result;
  const fileOpts=['<option value="">— انتخاب از TXTهای واردشده —</option>']
    .concat((state.files||[]).map(f=>`<option value="${escapeHtml(f.id)}">${escapeHtml(f.name)}</option>`)).join('');

  const cards=SCENARIO_DEFS.map(d=>{
    const slot=s[d.key];
    const k=slotKpis(slot);
    return `<div class="sc-card ${slot?'filled':''}">
      <h3>${escapeHtml(d.title)}</h3>
      <div style="font-size:.82rem;color:var(--text-muted)">${escapeHtml(d.hint)}</div>
      <div class="sc-how">${escapeHtml(d.how)}</div>
      ${slot?`<div class="sc-file">${escapeHtml(slot.name)}</div>
        <div class="sc-kpi-mini">
          <div><div class="l">RSET</div><div class="v">${k&&k.evacuationTime!=null?toFaNum(k.evacuationTime)+' s':'—'}</div></div>
          <div><div class="l">میانگین</div><div class="v">${k&&k.averageEvacuationTime!=null?toFaNum(k.averageEvacuationTime)+' s':'—'}</div></div>
          <div><div class="l">انتظار</div><div class="v">${k&&k.maxWaitingTime!=null?toFaNum(k.maxWaitingTime)+' s':'—'}</div></div>
          <div><div class="l">سرعت</div><div class="v">${k&&k.averageSpeed!=null?toFaNum(k.averageSpeed)+' m/s':'—'}</div></div>
        </div>`:
        '<div style="font-size:.82rem;color:var(--text-muted)">هنوز فایلی نسبت داده نشده.</div>'}
      <div style="display:flex;flex-wrap:wrap;gap:.4rem;margin-top:auto">
        <label class="btn btn-primary btn-sm" style="cursor:pointer">بارگذاری TXT
          <input type="file" accept=".txt,text/plain" hidden data-slot="${d.key}"/>
        </label>
        ${slot?`<button class="btn btn-ghost btn-sm" data-clear-slot="${d.key}">حذف</button>`:''}
      </div>
      <select class="form-control" data-assign="${d.key}" style="margin-top:.35rem">${fileOpts}</select>
    </div>`;
  }).join('');

  const haz=s.hazard||'fire';
  let resultHtml='';
  if(r && !r.ready){
    resultHtml=`<div class="sc-warn"><strong>آماده مقایسه نیست.</strong> ${escapeHtml(r.note||'')}</div>`;
  } else if(r && r.ready){
    const head=r.loaded.map(k=>`<th>${scLabel(k)}</th>`).join('');
    const body=r.rows.map(row=>{
      const tds=r.loaded.map(k=>{
        const v=row.vals[k];
        const txt=v==null?'—':toFaNum(v);
        const cls=(row.best!=null && v==row.best && row.better!=='eq')?'cmp-best':'';
        return `<td class="${cls}">${txt}</td>`;
      }).join('');
      return `<tr><td style="text-align:right"><div>${escapeHtml(row.label)}</div><div style="font-size:.72rem;color:var(--text-muted);font-weight:400">${escapeHtml(row.meaning||'')}</div></td>${tds}</tr>`;
    }).join('');
    const scoreRow=`<tr><td style="text-align:right;font-weight:700">امتیاز نسبی (۰–۱۰۰)</td>${r.loaded.map(k=>`<td class="${r.ranked[0]&&r.ranked[0].k===k?'cmp-best':''}">${r.scores[k]!=null?toFaNum(r.scores[k]):'—'}</td>`).join('')}</tr>`;
    const baseK=r.profiles.base && r.profiles.base.k;
    const deltaRows = (baseK && r.loaded.filter(k=>k!=='base').length)? r.loaded.filter(k=>k!=='base').map(k=>{
      const kk=r.profiles[k].k;
      return `<tr>
        <td style="text-align:right">${scLabel(k)} نسبت به پایه</td>
        <td>RSET ${deltaHtml(deltaOf(baseK.evacuationTime, kk.evacuationTime),'s')}</td>
        <td>انتظار ${deltaHtml(deltaOf(baseK.maxWaitingTime, kk.maxWaitingTime),'s')}</td>
        <td>سرعت ${deltaHtml(deltaOf(baseK.averageSpeed, kk.averageSpeed),'m/s', true)}</td>
      </tr>`;
    }).join(''):'';

    const interp=r.interpretations.map(it=>`<div class="sc-insight"><strong>${escapeHtml(scLabel(it.key))}</strong><p style="margin:.4rem 0 0;text-align:justify">${escapeHtml(it.text)}</p></div>`).join('');
    const exitBlocks=r.loaded.map(k=>{
      const p=r.profiles[k];
      if(!p.topExits.length) return '';
      return `<div class="sc-insight"><strong>درهای پرترافیک — ${escapeHtml(scLabel(k))}</strong>
        <table class="cmp-table" style="margin-top:.4rem"><thead><tr><th>در / مسیر</th><th>عبور</th><th>سهم</th><th>آخرین خروج</th></tr></thead>
        <tbody>${p.topExits.map(e=>`<tr><td>${escapeHtml(e.name)}</td><td>${toFaNum(e.totalUse)}</td><td>${e.share!=null?toFaNum(e.share)+'٪':'—'}</td><td>${toFaNum(e.lastOut)}</td></tr>`).join('')}</tbody></table></div>`;
    }).join('');
    const behBlocks=r.loaded.map(k=>{
      const p=r.profiles[k];
      if(!p.lateBeh.length) return '';
      return `<div class="sc-insight"><strong>رفتارهای دیرهنگام — ${escapeHtml(scLabel(k))}</strong>
        <table class="cmp-table" style="margin-top:.4rem"><thead><tr><th>Behavior</th><th>تعداد</th><th>کمینه</th><th>بیشینه</th></tr></thead>
        <tbody>${p.lateBeh.map(b=>`<tr><td>${escapeHtml(b.name)}</td><td>${toFaNum(b.count)}</td><td>${toFaNum(b.minExit)}</td><td>${toFaNum(b.maxExit)}</td></tr>`).join('')}</tbody></table></div>`;
    }).join('');

    const boxClass=r.resilience&&r.resilience.level==='poor'?'sc-bad':(r.resilience&&r.resilience.level==='medium'?'sc-warn':'sc-winner');
    resultHtml=`
      <div class="${boxClass}">
        <div style="font-size:.8rem;color:var(--text-muted);margin-bottom:.25rem">خلاصه اجرایی — ${escapeHtml(hazLabel(r.hazard))}</div>
        <div style="font-size:1.15rem;font-weight:700;margin-bottom:.5rem">${escapeHtml(r.pickTitle)}</div>
        <p style="text-align:justify;margin:0">${escapeHtml(r.exec)}</p>
      </div>
      <div class="card">
        <div class="card-header"><h2 class="card-title"><i data-lucide="table"></i> ماتریس مقایسه و امتیاز</h2></div>
        <div style="overflow-x:auto"><table class="cmp-table"><thead><tr><th>شاخص</th>${head}</tr></thead><tbody>${scoreRow}${body}</tbody></table></div>
        ${deltaRows?`<h3 style="margin:1rem 0 .4rem;font-size:.95rem">تغییر نسبت به اجرای پایه</h3><div style="overflow-x:auto"><table class="cmp-table"><tbody>${deltaRows}</tbody></table></div>`:''}
        <p style="font-size:.78rem;color:var(--text-muted);margin-top:.6rem">امتیاز نسبی فقط بین همین اجراهاست؛ عدد مطلق ایمنی نیست. سلول سبز در هر ردیف بهترین مقدار همان شاخص است.</p>
      </div>
      <div class="card">
        <div class="card-header"><h2 class="card-title"><i data-lucide="bar-chart-3"></i> نمودار زمان‌ها</h2></div>
        <div class="chart-container"><canvas id="sc-chart"></canvas></div>
        <div class="chart-container" style="margin-top:1rem"><canvas id="sc-chart2"></canvas></div>
      </div>
      <div class="card">
        <div class="card-header"><h2 class="card-title"><i data-lucide="file-search"></i> تفسیر هر اجرا</h2></div>
        ${interp}
        ${r.why.map(w=>`<div class="sc-insight">${escapeHtml(w)}</div>`).join('')}
      </div>
      <div class="card">
        <div class="card-header"><h2 class="card-title"><i data-lucide="door-open"></i> گلوگاه درها و رفتارها</h2></div>
        ${exitBlocks||'<p style="color:var(--text-muted)">داده در/مسیر در TXTها نیست.</p>'}
        ${behBlocks}
      </div>
      <div class="grid-2">
        <div class="card">
          <div class="card-header"><h2 class="card-title"><i data-lucide="building-2"></i> پیشنهاد معماری و هندسه</h2></div>
          ${r.arch.length?`<ul style="padding-right:1.1rem">${r.arch.map(a=>`<li style="margin-bottom:.45rem;text-align:justify">${escapeHtml(a)}</li>`).join('')}</ul>`:'<p style="color:var(--text-muted)">با داده‌های فعلی پیشنهاد هندسی جداگانه‌ای استخراج نشد.</p>'}
        </div>
        <div class="card">
          <div class="card-header"><h2 class="card-title"><i data-lucide="clipboard-list"></i> پیشنهاد بهره‌برداری</h2></div>
          ${r.ops.length?`<ul style="padding-right:1.1rem">${r.ops.map(a=>`<li style="margin-bottom:.45rem;text-align:justify">${escapeHtml(a)}</li>`).join('')}</ul>`:'<p style="color:var(--text-muted)">—</p>'}
        </div>
      </div>
      <div class="card">
        <div class="card-header"><h2 class="card-title"><i data-lucide="list-checks"></i> اقدام بعدی در Pathfinder</h2></div>
        <ol style="padding-right:1.2rem">${r.actions.map(a=>`<li style="margin-bottom:.45rem;text-align:justify">${escapeHtml(a)}</li>`).join('')}</ol>
        <p style="font-size:.78rem;color:var(--text-muted);margin-top:.75rem">این مقایسه جایگزین مدل دود، تحلیل سازه یا حکم آیین‌نامه‌ای نیست. اعتبار آن به یکسان بودن جمعیت و کامل بودن سه اجرا بستگی دارد.</p>
      </div>`;
  }

  el.innerHTML=`
    <div class="card">
      <div class="card-header"><h2 class="card-title"><i data-lucide="list-checks"></i> چک‌لیست سه اجرا در Pathfinder</h2></div>
      <p style="font-size:.9rem;margin-bottom:.75rem">سه خروجی TXT جدا (پایه، پله بسته، تخلیه همزمان) را وارد کنید. سامانه شاخص‌ها را مقایسه می‌کند، گلوگاه در/رفتار را نشان می‌دهد و راهبرد قابل دفاع برای حادثه انتخاب‌شده می‌سازد. سپس می‌توانید همان تحلیل را PDF، HTML یا TXT ذخیره کنید.</p>
      <div class="form-group"><label>نوع حادثه برای تفسیر نتیجه</label>
        <div class="hazard-group">
          <label class="radio-item"><input type="radio" name="haz" value="fire" ${haz==='fire'?'checked':''}/> آتش‌سوزی</label>
          <label class="radio-item"><input type="radio" name="haz" value="earthquake" ${haz==='earthquake'?'checked':''}/> زلزله</label>
          <label class="radio-item"><input type="radio" name="haz" value="explosion" ${haz==='explosion'?'checked':''}/> انفجار</label>
          <label class="radio-item"><input type="radio" name="haz" value="general" ${haz==='general'?'checked':''}/> بدون فرض حادثه</label>
        </div>
      </div>
    </div>
    <div style="display:flex;gap:.5rem;margin:1rem 0;flex-wrap:wrap">
      <button class="btn btn-primary" id="sc-run"><i data-lucide="git-compare"></i> مقایسه و تولید تحلیل</button>
      <button class="btn btn-secondary" id="sc-use-current">TXT فعلی پروژه را اجرای پایه کن</button>
      ${r&&r.ready?`<button class="btn btn-primary" id="sc-pdf"><i data-lucide="file-text"></i> خروجی PDF</button>
      <button class="btn btn-secondary" id="sc-html"><i data-lucide="code"></i> خروجی HTML</button>
      <button class="btn btn-secondary" id="sc-txt"><i data-lucide="align-right"></i> خروجی TXT</button>`:''}
    </div>
    <div id="sc-export-root">
    <div class="sc-grid">${cards}</div>
    ${resultHtml}
    </div>
    <p class="footer-note">RSET کمتر همیشه بهتر نیست؛ باید با ازدحام، انتظار، مسافت و ازدست‌رفتن مسیر خوانده شود.</p>`;

  el.querySelectorAll('input[data-slot]').forEach(inp=>{
    inp.onchange=()=>{ if(inp.files && inp.files[0]) loadScenarioSlot(inp.dataset.slot, inp.files[0]); };
  });
  el.querySelectorAll('select[data-assign]').forEach(sel=>{
    sel.onchange=()=>{ if(sel.value) assignExistingToSlot(sel.dataset.assign, sel.value); };
  });
  el.querySelectorAll('[data-clear-slot]').forEach(b=>{
    b.onclick=()=>{ state.scenarios[b.dataset.clearSlot]=null; state.scenarios.result=null; renderScenarios(el); if(window.lucide) lucide.createIcons(); };
  });
  el.querySelectorAll('input[name="haz"]').forEach(rdo=>{
    rdo.onchange=()=>{ state.scenarios.hazard=rdo.value; state.scenarios.result=null; };
  });
  const runBtn=document.getElementById('sc-run');
  if(runBtn) runBtn.onclick=()=>{ compareScenarios(); renderScenarios(el); if(window.lucide) lucide.createIcons(); };
  const useBtn=document.getElementById('sc-use-current');
  if(useBtn) useBtn.onclick=()=>{
    if(!state.files.length){ toast('ابتدا یک TXT در ورود اطلاعات بارگذاری کنید.','warning'); return; }
    assignExistingToSlot('base', state.files[0].id);
  };
  const pdfBtn=document.getElementById('sc-pdf');
  if(pdfBtn) pdfBtn.onclick=()=>exportScenario('pdf');
  const htmlBtn=document.getElementById('sc-html');
  if(htmlBtn) htmlBtn.onclick=()=>exportScenario('html');
  const txtBtn=document.getElementById('sc-txt');
  if(txtBtn) txtBtn.onclick=()=>exportScenario('txt');
  if(r && r.ready) setTimeout(drawScenarioChart, 40);
}

function drawScenarioChart(){
  const r=state.scenarios.result; if(!r||!r.ready) return;
  const labels=r.loaded.map(k=>scLabel(k));
  const row=id=>r.rows.find(x=>x.id===id);
  const vals=id=>r.loaded.map(k=>(row(id)&&row(id).vals[k])||0);
  const font={family:'Vazirmatn'};
  const canvas=document.getElementById('sc-chart');
  if(canvas && typeof Chart!=='undefined'){
    if(charts['sc-chart']) charts['sc-chart'].destroy();
    charts['sc-chart']=new Chart(canvas,{type:'bar', data:{
      labels,

function snapshotScenarioExport(){
  const root=document.getElementById('sc-export-root');
  if(!root) throw new Error('نتیجه روی صفحه نیست؛ ابتدا مقایسه را بزنید.');
  const clone=root.cloneNode(true);
  clone.querySelectorAll('button,input,select,label.btn,.sc-export-btns').forEach(n=>n.remove());
  const src=root.querySelectorAll('canvas');
  clone.querySelectorAll('canvas').forEach((dest,i)=>{
    const img=document.createElement('img');
    img.className='chart-img';
    try{ if(src[i]) img.src=src[i].toDataURL('image/png'); }catch(e){}
    dest.replaceWith(img);
  });
  clone.querySelectorAll('.chart-container').forEach(c=>{ c.style.height='auto'; });
  return clone;
}
